[workspace]
members = [
  "crates/agent-engine",
  "crates/agent-host-bridge",
  "crates/agent-host-bridge-napi",
  "crates/agent-lifecycle-store",
  "crates/agent-platform",
  "crates/agent-protocol",
  "crates/agent-runner",
  "crates/agent-session-bridge",
  "crates/agent-session-store",
  "crates/agent-spool",
  "crates/agent-tools",
  "crates/agentd-supervisor",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[workspace.dependencies]
napi = { version = "=3.12.0", default-features = false, features = ["async", "dyn-symbols", "napi8"] }
napi-build = "=2.4.0"
napi-derive = "=3.6.1"
tokio = { version = "=1.52.3", default-features = false }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
multiple_crate_versions = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
