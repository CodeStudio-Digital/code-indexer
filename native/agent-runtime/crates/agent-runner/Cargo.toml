[package]
name = "agent-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
performance-harness = []

[dependencies]
agent-engine = { path = "../agent-engine" }
agent-platform = { path = "../agent-platform" }
agent-protocol = { path = "../agent-protocol" }
agent-spool = { path = "../agent-spool" }
agent-tools = { path = "../agent-tools" }
prost = { version = "=0.14.1", default-features = false, features = ["derive", "std"] }
sha2 = { version = "=0.11.0", default-features = false }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "time"] }
zeroize = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt", "test-util"] }

[[example]]
name = "agent-runner-bootstrap-child"
path = "examples/agent_runner_bootstrap_child.rs"
test = false

[[example]]
name = "agent-runner-bootstrap-stall-child"
path = "examples/agent_runner_bootstrap_stall_child.rs"
test = false

[[example]]
name = "agent-runner-host-hello-probe"
path = "examples/agent_runner_host_hello_probe.rs"
test = false

[[example]]
name = "agent-runner-startup-benchmark"
path = "examples/agent_runner_startup_benchmark.rs"
required-features = ["performance-harness"]
test = false

[lints]
workspace = true
