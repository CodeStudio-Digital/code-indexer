<!doctype html><html class="dark"><head><meta charset="utf-8"><title>Provider selection regression</title></head>
<body><div id="root"></div><script type="module">
import React,{useCallback,useState} from 'react';
import {createRoot} from 'react-dom/client';
import {Composer} from '/features/chat/composer/Composer.tsx';
import {ProviderSelectionNotice} from '/features/chat/ProviderSelectionNotice.tsx';
import {useSessionProvider} from '/features/chat/useSessionProvider.ts';
import {useAgentStream,useAgentCurrentTurn} from '/hooks/useAgentStream.ts';
import {TooltipProvider} from '/components/ui/tooltip.tsx';
import {DialogProvider} from '/components/ui/dialog-provider.tsx';
import i18n,{i18nReady} from '/i18n/index.ts';
import '/index.css';
await i18nReady; await i18n.changeLanguage('pt-BR');
const h=React.createElement,noop=()=>{},sid='11111111-1111-4111-8111-111111111111';
const providers=[{id:'openai-api',label:'OpenAI API',models:[{id:'gpt-test',name:'GPT'}]},
 {id:'meridian',label:'Meridian',models:[{id:'antigravity/gemini-4-argon-medium',name:'Gemini'},{id:'gemini-fast',name:'Gemini Fast'}]}];
const row=id=>({session:{id,provider:'openai-api',model:'gpt-test'},messages:[]});
function Fixture(){
 const [id,setId]=useState(sid),[data,setData]=useState(()=>row(sid)),[provider,setProvider]=useState('openai-api'),[model,setModel]=useState('gpt-test');
 const updateSessionData=useCallback(fn=>setData(fn),[]);
 const {onSwitchProvider,providerChange,retryProviderChange}=useSessionProvider({selectedId:id,sessionData:data,setProvider,setModel,updateSessionData,refetchSessions:noop});
 const stream=useAgentStream(id);
 const turn=useAgentCurrentTurn(id);
 return h('main',{className:'mx-auto max-w-3xl space-y-3 p-6'},
  h('header',{'data-testid':'header'},data.session.provider+' · '+data.session.model),
  h('output',{'data-testid':'selection'},provider+' · '+model),
  h('output',{'data-testid':'agent-answer'},(turn?.blocks??[]).filter(block=>block.type==='text').map(block=>block.text).join('')),
  h('button',{onClick:()=>{const next=id===sid?'22222222-2222-4222-8222-222222222222':sid;setId(next);setData(row(next));}},'Outra sessão'),
  h(ProviderSelectionNotice,{state:providerChange,onRetry:retryProviderChange}),
  h(Composer,{compact:new URL(location.href).searchParams.has('compact'),sessionId:id,agent:'explore',setAgent:noop,provider,model,setModel,onSwitchProvider,

   sendBlocked:providerChange?.pending||!!providerChange?.error,streaming:false,onSend:text=>{void stream.sendMessage(text).catch(noop)},onAbort:noop}));
}
createRoot(document.getElementById('root')).render(h(TooltipProvider,null,h(DialogProvider,null,h(Fixture))));
</script></body></html>
