<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">

  <defs>
    <linearGradient id="csm-wire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8beeff"/>
      <stop offset=".42" stop-color="#67e8f9"/>
      <stop offset=".76" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="csm-node" cx="35%" cy="28%" r="72%">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset=".3" stop-color="#a5f3fc"/>
      <stop offset=".7" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </radialGradient>
    <radialGradient id="csm-core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset=".18" stop-color="#cffafe" stop-opacity=".96"/>
      <stop offset=".42" stop-color="#67e8f9" stop-opacity=".72"/>
      <stop offset=".72" stop-color="#6366f1" stop-opacity=".24"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="csm-glow" x="-45%" y="-45%" width="190%" height="190%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.29 0 0 0 0 0.83 0 0 0 0 1 0 0 0 .62 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <filter id="csm-soft" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>
  <style>
    .cs-logo-outline { stroke-dasharray: 24 13; animation: cs-logo-flow 11s linear infinite; }
    .cs-logo-fold { stroke-dasharray: 62; stroke-dashoffset: 62; animation: cs-logo-draw 5.4s ease-in-out infinite alternate; }
    .cs-logo-fold:nth-of-type(2n) { animation-delay: .45s; }
    .cs-logo-fold:nth-of-type(3n) { animation-delay: .9s; }
    .cs-logo-line { stroke-dasharray: 3 8; animation: cs-logo-flow 5.8s linear infinite; }
    .cs-logo-ray { stroke-dasharray: 42; stroke-dashoffset: 42; animation: cs-logo-spark 3s ease-in-out infinite; }
    .cs-logo-ray:nth-of-type(2n) { animation-delay: .28s; }
    .cs-logo-ray:nth-of-type(3n) { animation-delay: .56s; }
    .cs-logo-core { transform-box: fill-box; transform-origin: center; animation: cs-logo-breathe 3.2s ease-in-out infinite; }
    .cs-logo-node { transform-box: fill-box; transform-origin: center; animation: cs-logo-pulse 3.1s ease-in-out infinite; }
    .cs-logo-node:nth-of-type(3n) { animation-delay: .36s; }
    .cs-logo-node:nth-of-type(3n + 1) { animation-delay: .72s; }
    .cs-logo-node:nth-of-type(3n + 2) { animation-delay: 1.08s; }
    @keyframes cs-logo-flow { to { stroke-dashoffset: -92; } }
    @keyframes cs-logo-draw { to { stroke-dashoffset: 0; } }
    @keyframes cs-logo-spark { 0%, 100% { stroke-dashoffset: 42; opacity: .18; } 42%, 62% { stroke-dashoffset: 0; opacity: .92; } }
    @keyframes cs-logo-breathe { 0%, 100% { transform: scale(.82); opacity: .48; } 50% { transform: scale(1.12); opacity: .94; } }
    @keyframes cs-logo-pulse { 0%, 100% { transform: scale(.9); opacity: .72; } 50% { transform: scale(1.18); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .cs-logo-outline, .cs-logo-fold, .cs-logo-line, .cs-logo-ray, .cs-logo-core, .cs-logo-node { animation: none; } }
  </style>
