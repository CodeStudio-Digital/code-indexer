<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' file: data:;"
    />
    <title>CodeStudio Local</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      /* Card is inset so the rounded corners + shadow show against the
         transparent window. The whole card is a drag region. */
      .card {
        position: absolute;
        inset: 12px;
        border-radius: 16px;
        background:
          radial-gradient(90% 95% at 30% 4%, rgba(103, 232, 249, 0.2), transparent 48%),
          radial-gradient(80% 85% at 84% 20%, rgba(168, 85, 247, 0.14), transparent 52%),
          linear-gradient(145deg, #f8fbff 0%, #eef7ff 54%, #f9f5ff 100%);
        border: 1px solid rgba(30, 42, 90, 0.1);
        box-shadow: 0 18px 60px rgba(30, 42, 90, 0.24);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        -webkit-app-region: drag;
      }
      .brand-logo {
        width: min(340px, calc(100% - 56px));
        height: auto;
        filter: drop-shadow(0 14px 28px rgba(34, 211, 238, 0.16));
      }
      .row { display: flex; align-items: center; gap: 11px; }
      .spinner {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 3px solid rgba(30, 42, 90, 0.12);
        border-top-color: #22d3ee;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #status {
        font-size: 12.5px;
        color: #52607a;
        min-height: 16px;
        letter-spacing: 0.2px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="brand-logo" src="brand/logo-horizontal.svg" alt="CodeStudio" draggable="false" />
      <div class="row">
        <div class="spinner"></div>
        <div id="status">Iniciando…</div>
      </div>
    </div>
  </body>
</html>
