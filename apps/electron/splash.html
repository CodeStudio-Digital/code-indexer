<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src data:;"
    />
    <title>CodeStudio</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      /* Card is inset so the rounded corners + shadow show against the
         transparent window. The whole card is a drag region. */
      .card {
        position: absolute;
        inset: 12px;
        border-radius: 16px;
        background: radial-gradient(120% 120% at 30% 0%, #161b26 0%, #0b0d12 62%, #08090d 100%);
        border: 1px solid rgba(255, 255, 255, 0.07);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        -webkit-app-region: drag;
      }
      .mark { display: flex; align-items: center; gap: 12px; }
      .logo {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6 55%, #22d3ee);
        box-shadow: 0 6px 18px rgba(99, 102, 241, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .logo svg { width: 23px; height: 23px; }
      .name {
        font-size: 23px;
        font-weight: 650;
        letter-spacing: 0.2px;
        color: #f3f4f6;
      }
      .name span { color: #a5b4fc; }
      .row { display: flex; align-items: center; gap: 11px; }
      .spinner {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: #8b5cf6;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #status {
        font-size: 12.5px;
        color: #8b93a7;
        min-height: 16px;
        letter-spacing: 0.2px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="8 7 3 12 8 17" />
            <polyline points="16 7 21 12 16 17" />
          </svg>
        </div>
        <div class="name">Code<span>Studio</span></div>
      </div>
      <div class="row">
        <div class="spinner"></div>
        <div id="status">Iniciando…</div>
      </div>
    </div>
  </body>
</html>
