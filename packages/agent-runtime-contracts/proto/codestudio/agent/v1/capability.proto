syntax = "proto3";

package codestudio.agent.v1;

import "codestudio/agent/v1/common.proto";

// Immutable execution route resolved before an attempt becomes active.
enum CapabilityExecutionClass {
  CAPABILITY_EXECUTION_CLASS_UNSPECIFIED = 0;
  CAPABILITY_EXECUTION_CLASS_NATIVE_READ = 1;
  CAPABILITY_EXECUTION_CLASS_NATIVE_MUTATION = 2;
  CAPABILITY_EXECUTION_CLASS_NATIVE_PROCESS = 3;
  CAPABILITY_EXECUTION_CLASS_HOST_CAPABILITY = 4;
  CAPABILITY_EXECUTION_CLASS_CONTROL_INTERACTIVE = 5;
  CAPABILITY_EXECUTION_CLASS_NESTED_CODE = 6;
  CAPABILITY_EXECUTION_CLASS_REMOTE_ENVIRONMENT = 7;
}

// Runner -> Host. This is a policy/resource-binding request, never authority
// to execute. Input is canonical JSON and remains bounded by the Data channel.
message CapabilityPrepare {
  AttemptIdentity identity = 1;
  string runtime_instance_id = 2;
  string operation_id = 3;
  string provider_operation_id = 4;
  string tool_use_id = 5;
  string capability_id = 6;
  string capability_version = 7;
  CapabilityExecutionClass execution_class = 8;
  bool mutates = 9;
  bytes encoded_json_input = 10;
  bytes input_sha256 = 11;
  bytes capability_set_sha256 = 12;
  string idempotency_key = 13;
  int64 deadline_at_unix_ms = 14;
}

message CapabilityRejected {
  string decision_id = 1;
  string reason_code = 2;
  string policy_version = 3;
  int64 decided_at_unix_ms = 4;
}

message CapabilityApprovalRequired {
  string decision_id = 1;
  string interaction_id = 2;
  string reason_code = 3;
  string policy_version = 4;
  int64 decided_at_unix_ms = 5;
}

// Concrete local filesystem authority for a native read. The executor opens
// the file first, resolves the final OS handle path and rejects it unless that
// path remains inside canonical_root_path. The binding is never model output.
message NativeFilesystemReadBinding {
  string canonical_root_path = 1;
  uint64 max_read_bytes = 2;
  uint64 max_output_bytes = 3;
  bool require_utf8 = 4;
}

// Short-lived execution authority. Every resource field is repeated here so
// the eventual executor can fail closed without consulting mutable Host state.
message SealedExecutionGrant {
  string grant_id = 1;
  string decision_id = 2;
  string capability_id = 3;
  string capability_version = 4;
  string operation_id = 5;
  string tool_use_id = 6;
  bytes effective_input_sha256 = 7;
  CapabilityExecutionClass execution_class = 8;
  bool mutates = 9;
  string environment_id = 10;
  uint64 environment_version = 11;
  optional string workspace_lease_id = 12;
  optional uint64 workspace_lease_version = 13;
  optional uint64 workspace_fencing_epoch = 14;
  string resource_binding_id = 15;
  bytes constraints_sha256 = 16;
  string policy_version = 17;
  bytes nonce = 18;
  int64 issued_at_unix_ms = 19;
  int64 expires_at_unix_ms = 20;
  optional NativeFilesystemReadBinding native_filesystem_read = 21;
}

// Host -> Runner. V1 exposes only the pre-dispatch decision. Started and
// terminal are authoritative EngineEventRecord bodies rather than duplicate
// top-level capability frames; cancel and probe remain future lifecycle work.
message CapabilityUpdate {
  AttemptIdentity identity = 1;
  string runtime_instance_id = 2;
  string operation_id = 3;
  string tool_use_id = 4;
  oneof decision {
    CapabilityRejected rejected = 10;
    CapabilityApprovalRequired approval_required = 11;
    SealedExecutionGrant accepted = 12;
  }
}

// Runner -> Host after the authoritative CapabilityDispatchStarted record is
// durable. The Host resolves this reference against its exact prepared grant;
// provider input is never trusted a second time and an operation is executed
// at most once per physical Host session.
message CapabilityExecute {
  AttemptIdentity identity = 1;
  string runtime_instance_id = 2;
  string operation_id = 3;
  string tool_use_id = 4;
  string grant_id = 5;
  bytes effective_input_sha256 = 6;
  int64 deadline_at_unix_ms = 7;
}

message CapabilityExecutionSucceeded {
  string schema_id = 1;
  uint32 schema_version = 2;
  bytes encoded_result = 3;
  bytes result_sha256 = 4;
  uint64 bytes_read = 5;
  uint64 bytes_emitted = 6;
  bool truncated = 7;
  uint64 duration_ms = 8;
}

message CapabilityExecutionFailure {
  string reason_code = 1;
  uint64 duration_ms = 2;
}

// Host -> Runner. A Host executor exception after dispatch started is encoded
// as outcome_unknown. The runner commits that terminal classification and does
// not retry the physical effect.
message CapabilityExecutionResult {
  AttemptIdentity identity = 1;
  string runtime_instance_id = 2;
  string operation_id = 3;
  string tool_use_id = 4;
  string grant_id = 5;
  oneof outcome {
    CapabilityExecutionSucceeded succeeded = 10;
    CapabilityExecutionFailure failed = 11;
    CapabilityExecutionFailure cancelled = 12;
    CapabilityExecutionFailure outcome_unknown = 13;
  }
}

// A bounded window of independently certified read-only Host operations.
// Each member has its own durable started record and sealed grant. The Host
// validates the whole window before acknowledging or starting any member.
message CapabilityReadBatchExecute {
  AttemptIdentity identity = 1;
  string runtime_instance_id = 2;
  string batch_id = 3;
  repeated CapabilityExecute members = 4;
}

message CapabilityReadBatchAccepted {
  AttemptIdentity identity = 1;
  string runtime_instance_id = 2;
  string batch_id = 3;
}

// Unsolicited event after BatchAccepted, one per member in completion order.
// The runner commits each result before publishing it or advancing the model.
message CapabilityReadBatchResult {
  AttemptIdentity identity = 1;
  string runtime_instance_id = 2;
  string batch_id = 3;
  CapabilityExecutionResult result = 4;
}
