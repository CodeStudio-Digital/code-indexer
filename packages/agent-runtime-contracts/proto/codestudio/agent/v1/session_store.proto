syntax = "proto3";

package codestudio.agent.v1;

import "codestudio/agent/v1/common.proto";
import "codestudio/agent/v1/artifact.proto";
import "codestudio/agent/v1/supervisor_bootstrap.proto";

// This IDL is the only cross-language authority for the Rust session store.
// Filesystem paths and credentials are deliberately absent. A native
// in-process bridge resolves root_id and owns the authenticated capability.

enum StorageGeneration {
  STORAGE_GENERATION_UNSPECIFIED = 0;
  STORAGE_GENERATION_TYPESCRIPT_FS_V1 = 1;
  STORAGE_GENERATION_RUST_FS_V1 = 2;
}

enum SessionRecordKind {
  SESSION_RECORD_KIND_UNSPECIFIED = 0;
  SESSION_RECORD_KIND_CONVERSATION = 1;
  SESSION_RECORD_KIND_LIFECYCLE_EVENT = 2;
  SESSION_RECORD_KIND_METRIC_ROLLUP = 3;
  SESSION_RECORD_KIND_TOOL_OUTPUT = 4;
  SESSION_RECORD_KIND_CHECKPOINT = 5;
  SESSION_RECORD_KIND_PLAN = 6;
  SESSION_RECORD_KIND_TASK = 7;
  SESSION_RECORD_KIND_INPUT = 8;
  SESSION_RECORD_KIND_MEMORY = 9;
  SESSION_RECORD_KIND_SUBAGENT = 10;
  SESSION_RECORD_KIND_ARCHIVE = 11;
  SESSION_RECORD_KIND_ATTACHMENT = 12;
}

// Append-only attachment data, distinct from engine events. A reference is
// usable only after the complete contiguous group and full digest validate.
// Each encoded_chunk is at most 128 KiB; paths never cross this contract.
message SessionAttachmentChunkV1 {
  uint32 schema_version = 1;
  ArtifactRef reference = 2;
  uint64 chunk_offset = 3;
  bytes encoded_chunk = 4;
}

enum SessionDurabilityClass {
  SESSION_DURABILITY_CLASS_UNSPECIFIED = 0;
  SESSION_DURABILITY_CLASS_AUTHORITATIVE = 1;
  SESSION_DURABILITY_CLASS_DURABLE = 2;
  SESSION_DURABILITY_CLASS_COALESCED = 3;
}

// Canonical, bounded payload written by the Host-side Rust event sink. Raw
// transcript text is deliberately represented only by byte length and digest;
// transcript/artifact publication remains a separate durable protocol.
message EngineProviderStartedRecordV1 {
  string operation_id = 1;
}

message EngineProviderDeltaRecordV1 {
  string operation_id = 1;
  uint64 utf8_bytes = 2;
  bytes content_sha256 = 3;
  bool thinking = 4;
}

message EngineUsageSnapshotV1 {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  uint64 cached_input_tokens = 3;
  uint64 cost_micros = 4;
}

message EngineProviderUsageRecordV1 {
  string operation_id = 1;
  EngineUsageSnapshotV1 usage = 2;
}

message EngineProviderCompletedRecordV1 {
  string operation_id = 1;
  // Stateless providers complete without a resumable remote response ID.
  optional string response_id = 2;
}

message EngineCapabilityBoundaryRecordV1 {
  string operation_id = 1;
  string tool_use_id = 2;
  string capability_name = 3;
  string capability_id = 4;
  reserved 5;
  bytes input_sha256 = 6;
}

message EngineCapabilityDispatchStartedRecordV1 {
  string operation_id = 1;
  string tool_use_id = 2;
  string grant_id = 3;
  bytes effective_input_sha256 = 4;
  int64 started_at_unix_ms = 5;
}

// A denied invocation never crossed the dispatch/effect boundary.
message EngineCapabilityRefusedRecordV1 {
  string operation_id = 1;
  string tool_use_id = 2;
  string decision_id = 3;
  string reason_code = 4;
  string policy_version = 5;
  int64 decided_at_unix_ms = 6;
}

enum EngineCapabilityTerminalClassificationV1 {
  ENGINE_CAPABILITY_TERMINAL_CLASSIFICATION_V1_UNSPECIFIED = 0;
  ENGINE_CAPABILITY_TERMINAL_CLASSIFICATION_V1_SUCCEEDED = 1;
  ENGINE_CAPABILITY_TERMINAL_CLASSIFICATION_V1_FAILED = 2;
  ENGINE_CAPABILITY_TERMINAL_CLASSIFICATION_V1_CANCELLED = 3;
  ENGINE_CAPABILITY_TERMINAL_CLASSIFICATION_V1_OUTCOME_UNKNOWN = 4;
}

message EngineCapabilityTerminalRecordV1 {
  string operation_id = 1;
  string tool_use_id = 2;
  string grant_id = 3;
  EngineCapabilityTerminalClassificationV1 classification = 4;
  string reason_code = 5;
  string result_schema_id = 6;
  uint32 result_schema_version = 7;
  bytes result_sha256 = 8;
  uint64 result_bytes = 9;
  uint64 bytes_read = 10;
  uint64 bytes_emitted = 11;
  bool truncated = 12;
  uint64 duration_ms = 13;
  int64 completed_at_unix_ms = 14;
  reserved 15;
}

enum EngineContentKindV1 {
  ENGINE_CONTENT_KIND_V1_UNSPECIFIED = 0;
  ENGINE_CONTENT_KIND_V1_TRANSCRIPT = 1;
  ENGINE_CONTENT_KIND_V1_TOOL_INPUT = 2;
  ENGINE_CONTENT_KIND_V1_TOOL_RESULT = 3;
}

// Durable content, separate from lifecycle metadata. Each chunk is at most
// 128 KiB. Consumers publish only a complete group with a verified full hash.
// Content records use CONVERSATION, INPUT or TOOL_OUTPUT journal kinds.
message EngineContentRecordV1 {
  EngineContentKindV1 kind = 1;
  string content_id = 2;
  string operation_id = 3;
  string tool_use_id = 4;
  string content_schema_id = 5;
  uint32 content_schema_version = 6;
  bytes content_sha256 = 7;
  uint64 total_bytes = 8;
  uint64 chunk_offset = 9;
  bytes encoded_chunk = 10;
  bool thinking = 11;
}

enum EngineTerminalClassificationV1 {
  ENGINE_TERMINAL_CLASSIFICATION_V1_UNSPECIFIED = 0;
  ENGINE_TERMINAL_CLASSIFICATION_V1_COMPLETED = 1;
  ENGINE_TERMINAL_CLASSIFICATION_V1_FAILED = 2;
  ENGINE_TERMINAL_CLASSIFICATION_V1_INTERRUPTED = 3;
}

message EngineTerminalRecordV1 {
  EngineTerminalClassificationV1 classification = 1;
  string reason_code = 2;
  EngineUsageSnapshotV1 usage = 3;
}

message EngineEventRecordV1 {
  uint32 schema_version = 1;
  AttemptIdentity identity = 2;
  string runtime_instance_id = 3;
  uint64 local_sequence = 4;

  oneof body {
    EngineProviderStartedRecordV1 provider_started = 10;
    EngineProviderDeltaRecordV1 provider_delta = 11;
    EngineProviderUsageRecordV1 provider_usage = 12;
    EngineProviderCompletedRecordV1 provider_completed = 13;
    EngineCapabilityBoundaryRecordV1 capability_boundary = 14;
    EngineTerminalRecordV1 terminal = 15;
    EngineCapabilityDispatchStartedRecordV1 capability_dispatch_started = 16;
    EngineCapabilityTerminalRecordV1 capability_terminal = 17;
    EngineContentRecordV1 content = 18;
    EngineCapabilityRefusedRecordV1 capability_refused = 19;
  }
}

enum SessionStoreFailureCode {
  SESSION_STORE_FAILURE_CODE_UNSPECIFIED = 0;
  SESSION_STORE_FAILURE_CODE_INVALID_REQUEST = 1;
  SESSION_STORE_FAILURE_CODE_UNAUTHENTICATED = 2;
  SESSION_STORE_FAILURE_CODE_STALE_AUTHORITY = 3;
  SESSION_STORE_FAILURE_CODE_WRITER_ACTIVE = 4;
  SESSION_STORE_FAILURE_CODE_WRITER_NOT_FOUND = 5;
  SESSION_STORE_FAILURE_CODE_DIVERGENT_REPLAY = 6;
  SESSION_STORE_FAILURE_CODE_LIMIT_EXCEEDED = 7;
  SESSION_STORE_FAILURE_CODE_CORRUPT_BUNDLE = 8;
  SESSION_STORE_FAILURE_CODE_UNSAFE_STORAGE = 9;
  SESSION_STORE_FAILURE_CODE_CONCURRENT_MUTATION = 10;
  SESSION_STORE_FAILURE_CODE_UNSUPPORTED_OPERATION = 11;
  SESSION_STORE_FAILURE_CODE_INTERNAL = 12;
  SESSION_STORE_FAILURE_CODE_LOCK_BUSY = 13;
}

message SessionStoreAuthority {
  StorageGeneration storage_generation = 1;
  uint64 lease_epoch = 2;
  string writer_id = 3;
}

message SessionStoreLimits {
  uint64 max_records = 1;
  uint64 max_payload_bytes = 2;
  uint64 max_authority_transitions = 3;
}

// request_payload_sha256 is
// SHA-256("codestudio.agent.session-store-request.v1\0" || encoded_request).
// Authentication is the opaque native bridge owner, never a serialized token.
message SessionStoreRequestHeader {
  uint32 protocol_version = 1;
  string bridge_instance_id = 2;
  string request_id = 3;
  uint64 stream_seq = 4;
  int64 sent_at_unix_ms = 5;
  int64 deadline_at_unix_ms = 6;
  bytes request_payload_sha256 = 7;
}

message SessionStoreRequestFrame {
  SessionStoreRequestHeader header = 1;
  bytes encoded_request = 2;
}

message SessionStoreRequest {
  oneof body {
    OpenSessionWriter open_session_writer = 10;
    CommitSessionRecord commit_session_record = 11;
    PublishSessionProjection publish_session_projection = 12;
    QuerySessionState query_session_state = 13;
    TransferSessionStorageGeneration transfer_session_storage_generation = 14;
    ArchiveSession archive_session = 15;
    CloseSessionWriter close_session_writer = 16;
    ReadCommittedSessionPayload read_committed_session_payload = 17;
    ListCommittedSessionRecords list_committed_session_records = 18;
    OpenSessionReader open_session_reader = 19;
    CloseSessionReader close_session_reader = 20;
    AcquireStorageRootLock acquire_storage_root_lock = 21;
    ReleaseStorageRootLock release_storage_root_lock = 22;
    InspectSupervisorLifecycleEvidence inspect_supervisor_lifecycle_evidence = 23;
  }
}

// Read-only recovery proof from the fixed outbox namespace of a registered
// root. The native owner must acquire the dead supervisor's OS lock first.
message InspectSupervisorLifecycleEvidence {
  string root_id = 1;
  string connection_id = 2;
  string attempt_id = 3;
}

message SupervisorLifecycleEvidenceInspected {
  SupervisorLifecycleOutboxEntryV1 entry = 1;
}

// Resolves only roots registered by the authenticated native owner. The OS
// releases ownership on process death; the permanent lock file is not removed.
message AcquireStorageRootLock {
  string root_id = 1;
  string lock_name = 2;
}

message ReleaseStorageRootLock {
  string lock_handle = 1;
}

message StorageRootLockAcquired {
  string lock_handle = 1;
}

message StorageRootLockReleased {
  string lock_handle = 1;
}

message OpenSessionWriter {
  string root_id = 1;
  string session_id = 2;
  SessionStoreAuthority authority = 3;
  SessionStoreLimits limits = 4;
  string idempotency_key = 5;
}

message CommitSessionRecord {
  string writer_handle = 1;
  SessionStoreAuthority authority = 2;
  string operation_id = 3;
  SessionRecordKind kind = 4;
  SessionDurabilityClass durability = 5;
  bytes encoded_payload = 6;
  bytes expected_payload_sha256 = 7;
}

message PublishSessionProjection {
  string writer_handle = 1;
  SessionStoreAuthority authority = 2;
  string operation_id = 3;
  string projection_kind = 4;
  uint64 projection_version = 5;
  bytes expected_commit_sha256 = 6;
  bytes encoded_projection = 7;
}

message QuerySessionState {
  string writer_handle = 1;
  SessionStoreAuthority authority = 2;
  // Exactly one of writer_handle and reader_handle must be nonempty.
  string reader_handle = 3;
}

// Reads bytes only when the exact operation, kind, hash and length were
// committed by the currently fenced writer. A content hash alone is never a
// read capability.
message ReadCommittedSessionPayload {
  string writer_handle = 1;
  SessionStoreAuthority authority = 2;
  string operation_id = 3;
  SessionRecordKind kind = 4;
  bytes expected_payload_sha256 = 5;
  uint64 expected_payload_bytes = 6;
  string reader_handle = 7;
}

// Bounded, metadata-only cursor over the already-validated journal. Payloads
// remain path-free and require ReadCommittedSessionPayload with the exact
// receipt fields returned here.
message ListCommittedSessionRecords {
  string writer_handle = 1;
  SessionStoreAuthority authority = 2;
  uint64 after_global_sequence = 3;
  uint32 max_records = 4;
  // Empty creates a validated immutable snapshot. Subsequent pages must reuse
  // the returned id. Authorized appends preserve the frozen record set; reopen,
  // authority loss, a new snapshot or unexpected source changes invalidate it.
  string snapshot_id = 5;
  string reader_handle = 6;
}

// Validates an existing bundle without creating, repairing or leasing it.
// Source or authority changes invalidate the immutable reader snapshot.
message OpenSessionReader {
  string root_id = 1;
  string session_id = 2;
  // Omit to discover the current authority from its validated chain. This
  // grants only a read snapshot; writer acquisition still requires an epoch.
  SessionStoreAuthority authority = 3;
  SessionStoreLimits limits = 4;
}

message CloseSessionReader {
  string reader_handle = 1;
  SessionStoreAuthority authority = 2;
}

message TransferSessionStorageGeneration {
  string root_id = 1;
  string session_id = 2;
  StorageGeneration source_generation = 3;
  StorageGeneration target_generation = 4;
  uint64 expected_source_lease_epoch = 5;
  SessionStoreAuthority next_authority = 6;
  bytes verified_manifest_sha256 = 7;
  string idempotency_key = 8;
}

message ArchiveSession {
  string writer_handle = 1;
  SessionStoreAuthority authority = 2;
  string operation_id = 3;
  bytes expected_previous_commit_sha256 = 4;
}

message CloseSessionWriter {
  string writer_handle = 1;
  SessionStoreAuthority authority = 2;
}

// response_payload_sha256 is
// SHA-256("codestudio.agent.session-store-response.v1\0" || encoded_response).
message SessionStoreResponseHeader {
  uint32 protocol_version = 1;
  string bridge_instance_id = 2;
  string request_id = 3;
  uint64 stream_seq = 4;
  int64 completed_at_unix_ms = 5;
  bytes response_payload_sha256 = 6;
}

message SessionStoreResponseFrame {
  SessionStoreResponseHeader header = 1;
  bytes encoded_response = 2;
}

message SessionStoreResponse {
  oneof body {
    SessionWriterOpened session_writer_opened = 10;
    CommitSessionRecordReceipt commit_session_record_receipt = 11;
    SessionProjectionPublished session_projection_published = 12;
    SessionState session_state = 13;
    SessionStorageTransferred session_storage_transferred = 14;
    SessionArchived session_archived = 15;
    SessionWriterClosed session_writer_closed = 16;
    SessionStoreFailure failure = 17;
    CommittedSessionPayload committed_session_payload = 18;
    CommittedSessionRecordPage committed_session_record_page = 19;
    SessionReaderOpened session_reader_opened = 20;
    SessionReaderClosed session_reader_closed = 21;
    StorageRootLockAcquired storage_root_lock_acquired = 22;
    StorageRootLockReleased storage_root_lock_released = 23;
    SupervisorLifecycleEvidenceInspected supervisor_lifecycle_evidence_inspected = 24;
  }
}

message SessionWriterOpened {
  string writer_handle = 1;
  string session_id = 2;
  SessionStoreAuthority authority = 3;
  uint64 committed_records = 4;
  bytes last_commit_sha256 = 5;
  bool archived = 6;
  bool replay = 7;
}

message SessionReaderOpened {
  string reader_handle = 1;
  SessionState state = 2;
  string snapshot_id = 3;
}

message SessionReaderClosed {
  string session_id = 1;
  SessionStoreAuthority authority = 2;
}

message CommitSessionRecordReceipt {
  string session_id = 1;
  string operation_id = 2;
  SessionStoreAuthority authority = 3;
  uint64 global_sequence = 4;
  SessionRecordKind kind = 5;
  SessionDurabilityClass durability = 6;
  bytes previous_commit_sha256 = 7;
  bytes payload_sha256 = 8;
  bytes commit_sha256 = 9;
  uint64 payload_bytes = 10;
  bool replay = 11;
}

message SessionProjectionPublished {
  string session_id = 1;
  string operation_id = 2;
  SessionStoreAuthority authority = 3;
  string projection_kind = 4;
  uint64 projection_version = 5;
  bytes commit_sha256 = 6;
  bytes projection_sha256 = 7;
  bool replay = 8;
}

message SessionState {
  string session_id = 1;
  SessionStoreAuthority authority = 2;
  uint64 committed_records = 3;
  bytes last_commit_sha256 = 4;
  bool archived = 5;
}

message CommittedSessionPayload {
  CommitSessionRecordReceipt commit_receipt = 1;
  bytes encoded_payload = 2;
}

message CommittedSessionRecordPage {
  string session_id = 1;
  repeated CommitSessionRecordReceipt records = 2;
  uint64 next_global_sequence = 3;
  bool complete = 4;
  string snapshot_id = 5;
}

message SessionStorageTransferred {
  string session_id = 1;
  StorageGeneration source_generation = 2;
  SessionStoreAuthority activated_authority = 3;
  bytes verified_manifest_sha256 = 4;
  bytes activation_receipt_sha256 = 5;
  bool replay = 6;
}

message SessionArchived {
  CommitSessionRecordReceipt archive_receipt = 1;
}

message SessionWriterClosed {
  string session_id = 1;
  SessionStoreAuthority authority = 2;
}

message SessionStoreFailure {
  SessionStoreFailureCode code = 1;
  string reason_code = 2;
  optional string redacted_detail = 3;
  bool retryable = 4;
}
