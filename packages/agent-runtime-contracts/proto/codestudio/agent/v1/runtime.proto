syntax = "proto3";

package codestudio.agent.v1;

import "codestudio/agent/v1/artifact.proto";
import "codestudio/agent/v1/capability.proto";
import "codestudio/agent/v1/common.proto";
import "codestudio/agent/v1/session_store.proto";

enum TransportChannel {
  TRANSPORT_CHANNEL_UNSPECIFIED = 0;
  TRANSPORT_CHANNEL_CONTROL = 1;
  TRANSPORT_CHANNEL_DATA = 2;
  TRANSPORT_CHANNEL_MANAGEMENT = 3;
  TRANSPORT_CHANNEL_PULSE = 4;
}

// Header common to every length-delimited frame. Field numbers 1-20 are
// normative and must never be renumbered or reused.
message FrameHeader {
  uint32 protocol_version = 1;
  string connection_id = 2;
  string message_id = 3;
  optional string reply_to_message_id = 4;
  string session_id = 5;
  string command_id = 6;
  string agent_run_id = 7;
  string attempt_id = 8;
  string executor_owner_id = 9;
  uint64 fencing_epoch = 10;
  string correlation_id = 11;
  uint64 stream_seq = 12;
  int64 sent_at_unix_ms = 13;
  optional int64 deadline_at_unix_ms = 14;
  bytes payload_sha256 = 15;
  optional string operation_id = 16;
  optional string tool_use_id = 17;
  string root_agent_run_id = 18;
  optional string owner_agent_run_id = 19;
  optional string parent_agent_run_id = 20;
}

// A single Protobuf length-delimited transport frame. encoded_payload contains
// one serialized FramePayload and remains opaque until its size and digest have
// been validated. payload_sha256 is:
// SHA-256("codestudio.agent.frame-payload.v1\0" || encoded_payload).
//
// The physical endpoint determines the channel; channel is repeated here so
// cross-wiring fails closed before payload dispatch.
message Frame {
  FrameHeader header = 1;
  TransportChannel channel = 2;
  bytes encoded_payload = 3;
}

message FramePayload {
  oneof body {
    AgentHello agent_hello = 10;
    HostHello host_hello = 11;
    PrepareAttempt prepare_attempt = 12;
    AttemptPrepared attempt_prepared = 13;
    ActivateAttempt activate_attempt = 14;
    Heartbeat heartbeat = 15;
    CancelAttempt cancel_attempt = 16;
    FenceAttempt fence_attempt = 17;
    TerminalProposal terminal_proposal = 18;
    TerminalCommitted terminal_committed = 19;
    Ack ack = 20;
    BindAttemptChannel bind_attempt_channel = 21;
    AttemptChannelBound attempt_channel_bound = 22;
    HydrationManifest hydration_manifest = 23;
    HydrationProgress hydration_progress = 24;
    HydrationChunk hydration_chunk = 25;
    HydrationComplete hydration_complete = 26;
    HydrationCommitted hydration_committed = 27;
    ProviderStart provider_start = 28;
    ProviderAccepted provider_accepted = 29;
    ProviderCancel provider_cancel = 30;
    ProviderTextDelta provider_text_delta = 31;
    ProviderThinkingDelta provider_thinking_delta = 32;
    ProviderToolCall provider_tool_call = 33;
    ProviderUsageEvent provider_usage = 34;
    ProviderTerminal provider_terminal = 35;
    EngineEventProposal engine_event_proposal = 36;
    EngineEventCommitted engine_event_committed = 37;
    CapabilityPrepare capability_prepare = 38;
    CapabilityUpdate capability_update = 39;
    CapabilityExecute capability_execute = 40;
    CapabilityExecutionResult capability_execution_result = 41;
    CapabilityReadBatchExecute capability_read_batch_execute = 42;
    CapabilityReadBatchAccepted capability_read_batch_accepted = 43;
    CapabilityReadBatchResult capability_read_batch_result = 44;
    // Persists a resumable provider frontier without opening a provider stream.
    // The receipt is emitted only after the authoritative store commit.
    ProviderStart provider_checkpoint = 45;
    ProviderAccepted provider_checkpoint_committed = 46;
    ProviderEventConsumed provider_event_consumed = 47;
    ProviderRequestChunk provider_request_chunk = 48;
    // A transport receipt only; no provider has opened and no frontier has committed.
    ProviderAccepted provider_request_chunk_accepted = 49;
    ProviderRequestCommit provider_request_commit = 50;
  }
}

message AgentHello {
  ProtocolVersionRange supported_protocols = 1;
  string contract_version = 2;
  uint32 contract_schema_version = 3;
  RuntimeProvenance provenance = 4;
  bytes launch_nonce = 5;
  ContainmentCapabilities containment = 6;
  uint64 supported_feature_bits = 7;
  repeated NativeCapabilityProvenance native_capabilities = 8;
}

message HostHello {
  ProtocolVersion selected_protocol = 1;
  string connection_id = 2;
  string contract_version = 3;
  uint32 contract_schema_version = 4;
  uint64 heartbeat_interval_ms = 5;
  uint64 heartbeat_timeout_ms = 6;
  FrameLimits frame_limits = 7;
  bytes connection_session_token = 8;
  uint64 allowed_feature_bits = 9;
  uint64 required_feature_bits = 10;
}

// Host -> runner. Binds the independently provisioned data endpoint to the
// authenticated control connection. The Host-minted endpoint token is
// single-use and the runner retains only its handoff-bound verifier.
message BindAttemptChannel {
  AttemptIdentity identity = 1;
  string runtime_instance_id = 2;
  TransportChannel channel = 3;
  bytes connection_session_token = 4;
}

// Runner -> Host. Emitted only after peer, token, runtime, identity and caps
// were physically verified on the same data stream.
message AttemptChannelBound {
  AttemptIdentity identity = 1;
  string runtime_instance_id = 2;
  TransportChannel channel = 3;
  FrameLimits effective_limits = 4;
  int64 bound_at_unix_ms = 5;
}

// Starts one stop-and-wait hydration transfer. The receiver binds subsequent
// chunks to the SHA-256 of this exact FramePayload's opaque encoded bytes.
message HydrationManifest {
  AttemptIdentity identity = 1;
  string transfer_id = 2;
  repeated HydrationItem items = 3;
  uint64 total_payload_bytes = 4;
  uint64 max_chunk_bytes = 5;
}

message HydrationItem {
  uint32 ordinal = 1;
  oneof reference {
    SnapshotRef snapshot = 2;
    ArtifactRef artifact = 3;
  }
  uint64 byte_length = 4;
}

// Chunks are admitted exactly at the last acknowledged item/offset. The chunk
// hash covers encoded_chunk alone and never authorizes another item.
message HydrationChunk {
  AttemptIdentity identity = 1;
  string transfer_id = 2;
  bytes manifest_payload_sha256 = 3;
  uint32 item_ordinal = 4;
  uint64 offset = 5;
  bytes encoded_chunk = 6;
  bytes chunk_sha256 = 7;
  bool end_of_item = 8;
}

// Acknowledges the manifest or one chunk and grants exactly one next chunk.
message HydrationProgress {
  AttemptIdentity identity = 1;
  string runtime_instance_id = 2;
  string transfer_id = 3;
  bytes manifest_payload_sha256 = 4;
  uint32 next_item_ordinal = 5;
  uint64 next_offset = 6;
  uint64 accepted_payload_bytes = 7;
  uint64 max_next_chunk_bytes = 8;
}

message HydrationComplete {
  AttemptIdentity identity = 1;
  string transfer_id = 2;
  bytes manifest_payload_sha256 = 3;
  uint32 item_count = 4;
  uint64 total_payload_bytes = 5;
}

message HydrationCommitted {
  AttemptIdentity identity = 1;
  string runtime_instance_id = 2;
  string transfer_id = 3;
  bytes manifest_payload_sha256 = 4;
  uint32 item_count = 5;
  uint64 total_payload_bytes = 6;
}

enum ProviderMessageRole {
  PROVIDER_MESSAGE_ROLE_UNSPECIFIED = 0;
  PROVIDER_MESSAGE_ROLE_USER = 1;
  PROVIDER_MESSAGE_ROLE_ASSISTANT = 2;
  PROVIDER_MESSAGE_ROLE_TOOL = 3;
}

enum ProviderMessagePhase {
  PROVIDER_MESSAGE_PHASE_UNSPECIFIED = 0;
  PROVIDER_MESSAGE_PHASE_COMMENTARY = 1;
  PROVIDER_MESSAGE_PHASE_FINAL_ANSWER = 2;
}

message ProviderTextContent {
  oneof body {
    string inline_utf8 = 1;
    ArtifactRef artifact = 2;
  }
}

message ProviderToolUseContent {
  string tool_use_id = 1;
  string capability_name = 2;
  bytes encoded_json_arguments = 3;
  bytes arguments_sha256 = 4;
}

message ProviderToolResultContent {
  string tool_use_id = 1;
  oneof content {
    string inline_utf8 = 2;
    ArtifactRef artifact = 3;
  }
  bool is_error = 4;
  bool truncated = 5;
  optional uint64 original_bytes = 6;
}

message ProviderContentBlock {
  oneof body {
    ProviderTextContent text = 1;
    ProviderToolUseContent tool_use = 2;
    ProviderToolResultContent tool_result = 3;
    ArtifactRef attachment = 4;
    // Provider reasoning retained for continuation; never converted to public text.
    ProviderTextContent thinking = 5;
  }
}

message ProviderMessage {
  ProviderMessageRole role = 1;
  repeated ProviderContentBlock content = 2;
  ProviderMessagePhase phase = 3;
  bool is_meta = 4;
  // Engine-authored extractive summary. The exact replaced messages are in
  // this authenticated cold chapter; it never grants tool authority.
  ArtifactRef compacted_chapter = 5;
}

message ProviderContextChapterV1 {
  uint32 schema_version = 1;
  string session_id = 2;
  repeated ProviderMessage messages = 3;
}

// One-shot transfer. Host commits all chunks before acknowledging the frontier.
// Checkpoints retain the reference in ProviderMessage, never this transfer buffer.
message ProviderContextChapterWriteV1 {
  ArtifactRef reference = 1;
  bytes encoded_chapter = 2;
}

message ProviderToolDescriptor {
  string capability_name = 1;
  string description = 2;
  bytes encoded_json_schema = 3;
  bytes schema_sha256 = 4;
  string capability_id = 5;
  string capability_version = 6;
  CapabilityExecutionClass execution_class = 7;
  bool mutates = 8;
  // Trusted catalog assertions. Unspecified tools are sequential barriers.
  bool parallel_safe = 9;
  bool read_only = 10;
}

// Durable provider frontier. A resumed attempt never executes unresolved
// capabilities from this payload. The host must reconcile them first.
message ProviderResumeContextV1 {
  uint32 schema_version = 1;
  string session_id = 2;
  string agent_run_id = 3;
  string source_attempt_id = 4;
  ProviderBinding provider_binding = 5;
  ProviderTurnContext context = 6;
  repeated string unresolved_capability_operation_ids = 7;
}

// Host-owned journal checkpoint, committed before opening the provider. A
// delta retains an exact prefix from the previous frontier of this attempt;
// both the base and reconstructed frontier are content authenticated. Empty
// base_operation_id denotes a full checkpoint (also used after compaction).
message ProviderFrontierRecordV1 {
  uint32 schema_version = 1;
  string operation_id = 2;
  ProviderResumeContextV1 frontier = 3;
  string base_operation_id = 4;
  uint64 retained_message_count = 5;
  bytes base_frontier_sha256 = 6;
  bytes frontier_sha256 = 7;
}

// Canonical payload for ResolvedAttemptSpec.agent_definition_snapshot in the
// initial-turn V1 composer. SnapshotRef.schema_id is the fully-qualified
// message name and both schema versions must be exactly 1.
message AgentDefinitionSnapshotV1 {
  uint32 schema_version = 1;
  string agent_definition_id = 2;
  string system_prompt_utf8 = 3;
}

// Product-prepared conversation for a new attempt. Unlike a recovery frontier,
// this contains no unfinished tool dispatch or remote continuation authority.
// The sealed task is already present exactly once in messages.
message InitialConversationSnapshotV1 {
  uint32 schema_version = 1;
  string session_id = 2;
  repeated ProviderMessage messages = 3;
  ProviderPreparedUserContextV1 prepared_user_context = 4;
}

// Immutable instructions selected by the user for this command. Kept apart
// from visible transcript text and applied at USER priority by the gateway.
// The checkpoint authenticates the resolved content, including on continuation.
message ProviderPreparedUserContextV1 {
  uint32 message_index = 1;
  repeated string selected_skill_ids = 2;
  string content_utf8 = 3;
}

// Read-only Host enrichment pinned to one existing user message. The Host
// commits these exact bytes in the provider frontier before opening the vendor
// stream. It cannot modify the sealed provider, tools or workspace authority.
// Late retrieval is applied only by a later operation, never to an open stream.
message ProviderPreparedBoundaryContextV1 {
  uint32 message_index = 1;
  bytes source_message_sha256 = 2;
  string content_utf8 = 3;
}

// Canonical payload for ResolvedAttemptSpec.capability_set_snapshot. The
// runner validates descriptor uniqueness and each JSON schema digest before a
// ProviderTurnContext can be composed.
message CapabilitySetSnapshotV1 {
  uint32 schema_version = 1;
  repeated ProviderToolDescriptor tools = 2;
}

// Canonical payload for ResolvedAttemptSpec.preset_snapshot. Provider/model
// and reasoning effort remain sealed by ProviderBinding; this payload controls
// only turn-level inference options.
message ProviderPresetSnapshotV1 {
  uint32 schema_version = 1;
  optional string effective_preset = 2;
  bool thinking = 3;
  optional uint64 thinking_budget_tokens = 4;
}

// Optional process adapter sealed into an attempt that deliberately selects
// the Codex app-server provider. The runner constructs the fixed, fail-closed
// argv; executable arguments are intentionally not data in this contract.
message CodexAppServerProcessSnapshotV1 {
  uint32 schema_version = 1;
  string candidate_version = 2;
  string protocol_version = 3;
  bytes protocol_schema_sha256 = 4;
  string executable = 5;
  string working_directory = 6;
  repeated ProcessEnvironmentVariable environment = 7;
}

message ProcessEnvironmentVariable {
  string name = 1;
  string value = 2;
}

// Transport-independent engine input. Attempt identity, provider binding,
// operation identity, idempotency and deadlines are intentionally absent: the
// runner adapter seals them from the hydrated ResolvedAttemptSpec.
message ProviderTurnContext {
  ProviderTextContent system = 1;
  repeated ProviderMessage messages = 2;
  repeated ProviderToolDescriptor tools = 3;
  bool thinking = 4;
  optional string reasoning_effort = 5;
  optional uint64 thinking_budget_tokens = 6;
  optional string previous_response_id = 7;
  optional uint64 previous_response_message_count = 8;
  ProviderPreparedUserContextV1 prepared_user_context = 9;
  ProviderPreparedBoundaryContextV1 prepared_boundary_context = 10;
  repeated ProviderContextChapterWriteV1 pending_chapters = 11;
}

// Runner -> Host. Starts one logical provider operation. Credentials and
// vendor clients never cross this frame; the Host resolves the sealed binding.
message ProviderStart {
  AttemptIdentity identity = 1;
  string operation_id = 2;
  ProviderBinding binding = 3;
  ProviderTextContent system = 4;
  repeated ProviderMessage messages = 5;
  repeated ProviderToolDescriptor tools = 6;
  bool thinking = 7;
  optional string reasoning_effort = 8;
  optional uint64 thinking_budget_tokens = 9;
  optional string previous_response_id = 10;
  optional uint64 previous_response_message_count = 11;
  int64 deadline_at_unix_ms = 12;
  string idempotency_key = 13;
  ProviderPreparedUserContextV1 prepared_user_context = 14;
  // When true, Host sends at most one non-terminal stream event until the
  // runner consumes it. This is transport credit, never a durable commit ACK.
  bool consumption_ack_required = 15;
  ProviderPreparedBoundaryContextV1 prepared_boundary_context = 16;
  repeated ProviderContextChapterWriteV1 pending_chapters = 17;
}

message ProviderEventConsumed {
  AttemptIdentity identity = 1;
  string operation_id = 2;
  uint64 event_sequence = 3;
}

// Bounded transfer of one canonical ProviderStart that exceeds a Data frame.
// At most 16 MiB, in contiguous chunks of at most 128 KiB. Exact frame replay
// is handled by the authenticated channel, never by appending a chunk twice.
message ProviderRequestChunk {
  AttemptIdentity identity = 1;
  string runtime_instance_id = 2;
  string operation_id = 3;
  uint64 total_bytes = 4;
  bytes request_sha256 = 5;
  uint64 chunk_offset = 6;
  bytes encoded_chunk = 7;
  bool checkpoint_only = 8;
}

// References the complete transfer on this same attempt/channel. The Host
// verifies length, digest, canonical encoding and inner authority before
// admitting the provider or persisting a checkpoint. No paths cross the wire.
message ProviderRequestCommit {
  AttemptIdentity identity = 1;
  string runtime_instance_id = 2;
  string operation_id = 3;
  uint64 total_bytes = 4;
  bytes request_sha256 = 5;
  bool checkpoint_only = 6;
}

// Host -> Runner. Commits registry ownership before any provider delta.
message ProviderAccepted {
  AttemptIdentity identity = 1;
  string runtime_instance_id = 2;
  string operation_id = 3;
  bytes request_payload_sha256 = 4;
  int64 accepted_at_unix_ms = 5;
}

message ProviderCancel {
  AttemptIdentity identity = 1;
  string operation_id = 2;
  string reason_code = 3;
  string idempotency_key = 4;
}

message ProviderTextDelta {
  AttemptIdentity identity = 1;
  string operation_id = 2;
  uint64 event_sequence = 3;
  string text = 4;
  optional string item_id = 5;
  ProviderMessagePhase phase = 6;
}

message ProviderThinkingDelta {
  AttemptIdentity identity = 1;
  string operation_id = 2;
  uint64 event_sequence = 3;
  string text = 4;
}

message ProviderToolCall {
  AttemptIdentity identity = 1;
  string operation_id = 2;
  uint64 event_sequence = 3;
  string tool_use_id = 4;
  string capability_name = 5;
  bytes encoded_json_arguments = 6;
  bytes arguments_sha256 = 7;
}

message ProviderUsage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  optional uint64 prompt_tokens_total = 3;
  optional uint64 cache_creation_input_tokens = 4;
  optional uint64 cache_read_input_tokens = 5;
  optional uint64 thinking_tokens = 6;
  optional uint64 cost_micros = 7;
}

message ProviderUsageEvent {
  AttemptIdentity identity = 1;
  string operation_id = 2;
  uint64 event_sequence = 3;
  ProviderUsage usage = 4;
}

enum ProviderTerminalClassification {
  PROVIDER_TERMINAL_CLASSIFICATION_UNSPECIFIED = 0;
  PROVIDER_TERMINAL_CLASSIFICATION_COMPLETED = 1;
  PROVIDER_TERMINAL_CLASSIFICATION_FAILED = 2;
  PROVIDER_TERMINAL_CLASSIFICATION_CANCELLED = 3;
}

message ProviderTerminal {
  AttemptIdentity identity = 1;
  string operation_id = 2;
  uint64 event_sequence = 3;
  ProviderTerminalClassification classification = 4;
  string reason_code = 5;
  optional string response_id = 6;
  ProviderUsage final_usage = 7;
  int64 completed_at_unix_ms = 8;
  optional uint64 response_message_count = 9;
}

// Runner -> Host. Proposes one canonical engine record for the fenced Rust
// session writer. The Host validates semantic authority before asking the
// native store to commit it.
message EngineEventProposal {
  AttemptIdentity identity = 1;
  string runtime_instance_id = 2;
  EngineEventRecordV1 record = 3;
  bytes expected_payload_sha256 = 4;
}

// Host -> Runner. Returned only after the exact proposal crossed the native
// filesystem journal and produced its hash-chained store receipt.
message EngineEventCommitted {
  AttemptIdentity identity = 1;
  string runtime_instance_id = 2;
  uint64 local_sequence = 3;
  bytes event_payload_sha256 = 4;
  CommitSessionRecordReceipt commit_receipt = 5;
}

enum AttemptTrigger {
  ATTEMPT_TRIGGER_UNSPECIFIED = 0;
  ATTEMPT_TRIGGER_INITIAL = 1;
  ATTEMPT_TRIGGER_RESUME = 2;
  ATTEMPT_TRIGGER_PROVIDER_FALLBACK = 3;
  ATTEMPT_TRIGGER_WORKER_RECOVERY = 4;
  // First attempt of a new command/run continuing a settled session frontier.
  // RESUME remains a later attempt of the same run.
  ATTEMPT_TRIGGER_SESSION_CONTINUATION = 5;
}

enum AgentRunWaitMode {
  AGENT_RUN_WAIT_MODE_UNSPECIFIED = 0;
  AGENT_RUN_WAIT_MODE_FOREGROUND = 1;
  AGENT_RUN_WAIT_MODE_BACKGROUND = 2;
}

message TaskInput {
  oneof body {
    string inline_utf8 = 1;
    ArtifactRef artifact = 2;
  }

  repeated ArtifactRef attachments = 3;
}

message ProviderBinding {
  optional string requested_provider = 1;
  optional string requested_model = 2;
  optional string requested_reasoning_effort = 3;
  optional string requested_preset = 4;
  string effective_provider = 5;
  string effective_model = 6;
  optional string effective_reasoning_effort = 7;
  optional string effective_preset = 8;
}

message ResolutionReason {
  string code = 1;
  string dimension = 2;
  optional string requested = 3;
  optional string effective = 4;
  optional string detail = 5;
}

// Fully resolved and immutable executable input. Partial AgentRun seeds are
// domain objects and are intentionally not representable here.
message ResolvedAttemptSpec {
  uint32 schema_version = 1;
  uint64 spec_version = 2;
  AttemptIdentity identity = 3;
  uint32 ordinal = 4;
  AttemptTrigger trigger = 5;
  uint32 spawn_depth = 6;
  string role = 7;
  string agent_definition_id = 8;
  TaskInput task = 9;
  ProviderBinding provider_binding = 10;
  repeated ResolutionReason downgrade_reasons = 11;
  AgentRunWaitMode wait_mode = 12;
  AgentRunBudget run_tree_budget = 13;
  SnapshotRef verifier_policy_snapshot = 14;
  SnapshotRef capability_set_snapshot = 15;
  SnapshotRef environment_snapshot = 16;
  SnapshotRef workspace_lease_snapshot = 17;
  uint64 workspace_lease_fencing_epoch = 18;
  SnapshotRef policy_snapshot = 19;
  SnapshotRef preset_snapshot = 20;
  ArtifactRef checkpoint_input = 21;
  ArtifactRef transcript_input = 22;
  ResourceBudget resource_budget = 23;
  int64 deadline_at_unix_ms = 24;
  SnapshotRef agent_definition_snapshot = 25;
  SnapshotRef codex_app_server_process_snapshot = 26;
  SnapshotRef initial_conversation_snapshot = 27;
  // Effects/provider work stop here; deadline_at_unix_ms still bounds durable
  // terminal commits and cleanup. Absence preserves the original deadline.
  optional int64 execution_deadline_at_unix_ms = 28;
}

message PrepareAttempt {
  AttemptIdentity identity = 1;
  // Serialized ResolvedAttemptSpec. These bytes remain opaque while the
  // receiver validates expected_spec_sha256 with spec_schema_version, so
  // unknown fields are not lost through decode/reserialization.
  bytes encoded_spec = 2;
  // semantic_sha256("codestudio.agent.v1.ResolvedAttemptSpec",
  // spec_schema_version, encoded_spec), as defined by IPC-044.
  bytes expected_spec_sha256 = 3;
  repeated SnapshotRef expected_snapshots = 4;
  string idempotency_key = 5;
  uint32 spec_schema_version = 6;
}

message AttemptPrepared {
  AttemptIdentity identity = 1;
  string runtime_instance_id = 2;
  bytes spec_sha256 = 3;
  repeated SnapshotRef loaded_snapshots = 4;
  repeated ArtifactRef validated_artifacts = 5;
  ResourceBudget effective_resource_budget = 6;
  ContainmentReport effective_containment = 7;
  int64 ready_at_unix_ms = 8;
}

message ActivateAttempt {
  AttemptIdentity identity = 1;
  uint64 agent_run_version = 2;
  uint64 attempt_version = 3;
  int64 deadline_at_unix_ms = 4;
  bytes activation_nonce = 5;
  bytes spec_sha256 = 6;
  string idempotency_key = 7;
}

enum PhysicalAttemptPhase {
  PHYSICAL_ATTEMPT_PHASE_UNSPECIFIED = 0;
  PHYSICAL_ATTEMPT_PHASE_BOOTSTRAPPING = 1;
  PHYSICAL_ATTEMPT_PHASE_NEGOTIATING = 2;
  PHYSICAL_ATTEMPT_PHASE_HYDRATING = 3;
  PHYSICAL_ATTEMPT_PHASE_PREPARED = 4;
  PHYSICAL_ATTEMPT_PHASE_ACTIVE = 5;
  PHYSICAL_ATTEMPT_PHASE_WAITING = 6;
  PHYSICAL_ATTEMPT_PHASE_CHECKPOINTING = 7;
  PHYSICAL_ATTEMPT_PHASE_TERMINALIZING = 8;
  PHYSICAL_ATTEMPT_PHASE_EXITING = 9;
}

message Heartbeat {
  AttemptIdentity identity = 1;
  string runtime_instance_id = 2;
  int64 last_alive_at_unix_ms = 3;
  int64 last_progress_at_unix_ms = 4;
  uint64 last_event_seq = 5;
  repeated string active_provider_operation_ids = 6;
  repeated string active_capability_operation_ids = 7;
  repeated string active_child_attempt_ids = 8;
  PhysicalAttemptPhase phase = 9;
  ResourceSample resources = 10;
}

enum CancelReason {
  CANCEL_REASON_UNSPECIFIED = 0;
  CANCEL_REASON_USER_REQUEST = 1;
  CANCEL_REASON_DEADLINE_EXCEEDED = 2;
  CANCEL_REASON_BUDGET_EXCEEDED = 3;
  CANCEL_REASON_POLICY_REVOKED = 4;
  CANCEL_REASON_HOST_SHUTDOWN = 5;
  CANCEL_REASON_SUPERSEDED = 6;
}

message CancelAttempt {
  AttemptIdentity identity = 1;
  CancelReason reason = 2;
  string reason_code = 3;
  int64 grace_deadline_at_unix_ms = 4;
  string idempotency_key = 5;
}

message FenceAttempt {
  AttemptIdentity identity = 1;
  uint64 replacement_fencing_epoch = 2;
  string reason_code = 3;
  int64 fenced_at_unix_ms = 4;
  string idempotency_key = 5;
}

enum TerminalClassification {
  TERMINAL_CLASSIFICATION_UNSPECIFIED = 0;
  TERMINAL_CLASSIFICATION_COMPLETED = 1;
  TERMINAL_CLASSIFICATION_FAILED = 2;
  TERMINAL_CLASSIFICATION_ABORTED = 3;
  TERMINAL_CLASSIFICATION_INTERRUPTED = 4;
}

message TerminalProposal {
  AttemptIdentity identity = 1;
  string runtime_instance_id = 2;
  TerminalClassification classification = 3;
  string reason_code = 4;
  ArtifactRef error = 5;
  ArtifactRef transcript = 6;
  ArtifactRef checkpoint = 7;
  ArtifactRef result = 8;
  UsageBudgetSnapshot final_usage = 9;
  uint64 last_emitted_sequence = 10;
  bytes terminal_payload_sha256 = 11;
  AgentRunBudget final_budget = 12;
}

// Host acknowledgement emitted only after the transcript and terminal state
// have crossed the durable commit barrier.
message TerminalCommitted {
  AttemptIdentity identity = 1;
  string terminal_proposal_message_id = 2;
  bytes terminal_payload_sha256 = 3;
  uint64 agent_run_version = 4;
  uint64 attempt_version = 5;
  int64 committed_at_unix_ms = 6;
}

message Ack {
  string acknowledged_message_id = 1;
  bytes acknowledged_payload_sha256 = 2;
  int64 acknowledged_at_unix_ms = 3;
}
