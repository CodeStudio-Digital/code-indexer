syntax = "proto3";

package codestudio.agent.v1;

import "codestudio/agent/v1/artifact.proto";
import "codestudio/agent/v1/common.proto";

enum TransportChannel {
  TRANSPORT_CHANNEL_UNSPECIFIED = 0;
  TRANSPORT_CHANNEL_CONTROL = 1;
  TRANSPORT_CHANNEL_DATA = 2;
  TRANSPORT_CHANNEL_MANAGEMENT = 3;
  TRANSPORT_CHANNEL_PULSE = 4;
}

// Header common to every length-delimited frame. Field numbers 1-20 are
// normative and must never be renumbered or reused.
message FrameHeader {
  uint32 protocol_version = 1;
  string connection_id = 2;
  string message_id = 3;
  optional string reply_to_message_id = 4;
  string session_id = 5;
  string command_id = 6;
  string agent_run_id = 7;
  string attempt_id = 8;
  string executor_owner_id = 9;
  uint64 fencing_epoch = 10;
  string correlation_id = 11;
  uint64 stream_seq = 12;
  int64 sent_at_unix_ms = 13;
  optional int64 deadline_at_unix_ms = 14;
  bytes payload_sha256 = 15;
  optional string operation_id = 16;
  optional string tool_use_id = 17;
  string root_agent_run_id = 18;
  optional string owner_agent_run_id = 19;
  optional string parent_agent_run_id = 20;
}

// A single Protobuf length-delimited transport frame. encoded_payload contains
// one serialized FramePayload and remains opaque until its size and digest have
// been validated. payload_sha256 is:
// SHA-256("codestudio.agent.frame-payload.v1\0" || encoded_payload).
//
// The physical endpoint determines the channel; channel is repeated here so
// cross-wiring fails closed before payload dispatch.
message Frame {
  FrameHeader header = 1;
  TransportChannel channel = 2;
  bytes encoded_payload = 3;
}

message FramePayload {
  oneof body {
    AgentHello agent_hello = 10;
    HostHello host_hello = 11;
    PrepareAttempt prepare_attempt = 12;
    AttemptPrepared attempt_prepared = 13;
    ActivateAttempt activate_attempt = 14;
    Heartbeat heartbeat = 15;
    CancelAttempt cancel_attempt = 16;
    FenceAttempt fence_attempt = 17;
    TerminalProposal terminal_proposal = 18;
    TerminalCommitted terminal_committed = 19;
    Ack ack = 20;
    BindAttemptChannel bind_attempt_channel = 21;
    AttemptChannelBound attempt_channel_bound = 22;
    HydrationManifest hydration_manifest = 23;
    HydrationProgress hydration_progress = 24;
    HydrationChunk hydration_chunk = 25;
    HydrationComplete hydration_complete = 26;
    HydrationCommitted hydration_committed = 27;
  }
}

message AgentHello {
  ProtocolVersionRange supported_protocols = 1;
  string contract_version = 2;
  uint32 contract_schema_version = 3;
  RuntimeProvenance provenance = 4;
  bytes launch_nonce = 5;
  ContainmentCapabilities containment = 6;
  uint64 supported_feature_bits = 7;
  repeated NativeCapabilityProvenance native_capabilities = 8;
}

message HostHello {
  ProtocolVersion selected_protocol = 1;
  string connection_id = 2;
  string contract_version = 3;
  uint32 contract_schema_version = 4;
  uint64 heartbeat_interval_ms = 5;
  uint64 heartbeat_timeout_ms = 6;
  FrameLimits frame_limits = 7;
  bytes connection_session_token = 8;
  uint64 allowed_feature_bits = 9;
  uint64 required_feature_bits = 10;
}

// Host -> runner. Binds the independently provisioned data endpoint to the
// authenticated control connection. The Host-minted endpoint token is
// single-use and the runner retains only its handoff-bound verifier.
message BindAttemptChannel {
  AttemptIdentity identity = 1;
  string runtime_instance_id = 2;
  TransportChannel channel = 3;
  bytes connection_session_token = 4;
}

// Runner -> Host. Emitted only after peer, token, runtime, identity and caps
// were physically verified on the same data stream.
message AttemptChannelBound {
  AttemptIdentity identity = 1;
  string runtime_instance_id = 2;
  TransportChannel channel = 3;
  FrameLimits effective_limits = 4;
  int64 bound_at_unix_ms = 5;
}

// Starts one stop-and-wait hydration transfer. The receiver binds subsequent
// chunks to the SHA-256 of this exact FramePayload's opaque encoded bytes.
message HydrationManifest {
  AttemptIdentity identity = 1;
  string transfer_id = 2;
  repeated HydrationItem items = 3;
  uint64 total_payload_bytes = 4;
  uint64 max_chunk_bytes = 5;
}

message HydrationItem {
  uint32 ordinal = 1;
  oneof reference {
    SnapshotRef snapshot = 2;
    ArtifactRef artifact = 3;
  }
  uint64 byte_length = 4;
}

// Chunks are admitted exactly at the last acknowledged item/offset. The chunk
// hash covers encoded_chunk alone and never authorizes another item.
message HydrationChunk {
  AttemptIdentity identity = 1;
  string transfer_id = 2;
  bytes manifest_payload_sha256 = 3;
  uint32 item_ordinal = 4;
  uint64 offset = 5;
  bytes encoded_chunk = 6;
  bytes chunk_sha256 = 7;
  bool end_of_item = 8;
}

// Acknowledges the manifest or one chunk and grants exactly one next chunk.
message HydrationProgress {
  AttemptIdentity identity = 1;
  string runtime_instance_id = 2;
  string transfer_id = 3;
  bytes manifest_payload_sha256 = 4;
  uint32 next_item_ordinal = 5;
  uint64 next_offset = 6;
  uint64 accepted_payload_bytes = 7;
  uint64 max_next_chunk_bytes = 8;
}

message HydrationComplete {
  AttemptIdentity identity = 1;
  string transfer_id = 2;
  bytes manifest_payload_sha256 = 3;
  uint32 item_count = 4;
  uint64 total_payload_bytes = 5;
}

message HydrationCommitted {
  AttemptIdentity identity = 1;
  string runtime_instance_id = 2;
  string transfer_id = 3;
  bytes manifest_payload_sha256 = 4;
  uint32 item_count = 5;
  uint64 total_payload_bytes = 6;
}

enum AttemptTrigger {
  ATTEMPT_TRIGGER_UNSPECIFIED = 0;
  ATTEMPT_TRIGGER_INITIAL = 1;
  ATTEMPT_TRIGGER_RESUME = 2;
  ATTEMPT_TRIGGER_PROVIDER_FALLBACK = 3;
  ATTEMPT_TRIGGER_WORKER_RECOVERY = 4;
}

enum AgentRunWaitMode {
  AGENT_RUN_WAIT_MODE_UNSPECIFIED = 0;
  AGENT_RUN_WAIT_MODE_FOREGROUND = 1;
  AGENT_RUN_WAIT_MODE_BACKGROUND = 2;
}

message TaskInput {
  oneof body {
    string inline_utf8 = 1;
    ArtifactRef artifact = 2;
  }

  repeated ArtifactRef attachments = 3;
}

message ProviderBinding {
  optional string requested_provider = 1;
  optional string requested_model = 2;
  optional string requested_reasoning_effort = 3;
  optional string requested_preset = 4;
  string effective_provider = 5;
  string effective_model = 6;
  optional string effective_reasoning_effort = 7;
  optional string effective_preset = 8;
}

message ResolutionReason {
  string code = 1;
  string dimension = 2;
  optional string requested = 3;
  optional string effective = 4;
  optional string detail = 5;
}

// Fully resolved and immutable executable input. Partial AgentRun seeds are
// domain objects and are intentionally not representable here.
message ResolvedAttemptSpec {
  uint32 schema_version = 1;
  uint64 spec_version = 2;
  AttemptIdentity identity = 3;
  uint32 ordinal = 4;
  AttemptTrigger trigger = 5;
  uint32 spawn_depth = 6;
  string role = 7;
  string agent_definition_id = 8;
  TaskInput task = 9;
  ProviderBinding provider_binding = 10;
  repeated ResolutionReason downgrade_reasons = 11;
  AgentRunWaitMode wait_mode = 12;
  AgentRunBudget run_tree_budget = 13;
  SnapshotRef verifier_policy_snapshot = 14;
  SnapshotRef capability_set_snapshot = 15;
  SnapshotRef environment_snapshot = 16;
  SnapshotRef workspace_lease_snapshot = 17;
  uint64 workspace_lease_fencing_epoch = 18;
  SnapshotRef policy_snapshot = 19;
  SnapshotRef preset_snapshot = 20;
  ArtifactRef checkpoint_input = 21;
  ArtifactRef transcript_input = 22;
  ResourceBudget resource_budget = 23;
  int64 deadline_at_unix_ms = 24;
  SnapshotRef agent_definition_snapshot = 25;
}

message PrepareAttempt {
  AttemptIdentity identity = 1;
  // Serialized ResolvedAttemptSpec. These bytes remain opaque while the
  // receiver validates expected_spec_sha256 with spec_schema_version, so
  // unknown fields are not lost through decode/reserialization.
  bytes encoded_spec = 2;
  // semantic_sha256("codestudio.agent.v1.ResolvedAttemptSpec",
  // spec_schema_version, encoded_spec), as defined by IPC-044.
  bytes expected_spec_sha256 = 3;
  repeated SnapshotRef expected_snapshots = 4;
  string idempotency_key = 5;
  uint32 spec_schema_version = 6;
}

message AttemptPrepared {
  AttemptIdentity identity = 1;
  string runtime_instance_id = 2;
  bytes spec_sha256 = 3;
  repeated SnapshotRef loaded_snapshots = 4;
  repeated ArtifactRef validated_artifacts = 5;
  ResourceBudget effective_resource_budget = 6;
  ContainmentReport effective_containment = 7;
  int64 ready_at_unix_ms = 8;
}

message ActivateAttempt {
  AttemptIdentity identity = 1;
  uint64 agent_run_version = 2;
  uint64 attempt_version = 3;
  int64 deadline_at_unix_ms = 4;
  bytes activation_nonce = 5;
  bytes spec_sha256 = 6;
  string idempotency_key = 7;
}

enum PhysicalAttemptPhase {
  PHYSICAL_ATTEMPT_PHASE_UNSPECIFIED = 0;
  PHYSICAL_ATTEMPT_PHASE_BOOTSTRAPPING = 1;
  PHYSICAL_ATTEMPT_PHASE_NEGOTIATING = 2;
  PHYSICAL_ATTEMPT_PHASE_HYDRATING = 3;
  PHYSICAL_ATTEMPT_PHASE_PREPARED = 4;
  PHYSICAL_ATTEMPT_PHASE_ACTIVE = 5;
  PHYSICAL_ATTEMPT_PHASE_WAITING = 6;
  PHYSICAL_ATTEMPT_PHASE_CHECKPOINTING = 7;
  PHYSICAL_ATTEMPT_PHASE_TERMINALIZING = 8;
  PHYSICAL_ATTEMPT_PHASE_EXITING = 9;
}

message Heartbeat {
  AttemptIdentity identity = 1;
  string runtime_instance_id = 2;
  int64 last_alive_at_unix_ms = 3;
  int64 last_progress_at_unix_ms = 4;
  uint64 last_event_seq = 5;
  repeated string active_provider_operation_ids = 6;
  repeated string active_capability_operation_ids = 7;
  repeated string active_child_attempt_ids = 8;
  PhysicalAttemptPhase phase = 9;
  ResourceSample resources = 10;
}

enum CancelReason {
  CANCEL_REASON_UNSPECIFIED = 0;
  CANCEL_REASON_USER_REQUEST = 1;
  CANCEL_REASON_DEADLINE_EXCEEDED = 2;
  CANCEL_REASON_BUDGET_EXCEEDED = 3;
  CANCEL_REASON_POLICY_REVOKED = 4;
  CANCEL_REASON_HOST_SHUTDOWN = 5;
  CANCEL_REASON_SUPERSEDED = 6;
}

message CancelAttempt {
  AttemptIdentity identity = 1;
  CancelReason reason = 2;
  string reason_code = 3;
  int64 grace_deadline_at_unix_ms = 4;
  string idempotency_key = 5;
}

message FenceAttempt {
  AttemptIdentity identity = 1;
  uint64 replacement_fencing_epoch = 2;
  string reason_code = 3;
  int64 fenced_at_unix_ms = 4;
  string idempotency_key = 5;
}

enum TerminalClassification {
  TERMINAL_CLASSIFICATION_UNSPECIFIED = 0;
  TERMINAL_CLASSIFICATION_COMPLETED = 1;
  TERMINAL_CLASSIFICATION_FAILED = 2;
  TERMINAL_CLASSIFICATION_ABORTED = 3;
  TERMINAL_CLASSIFICATION_INTERRUPTED = 4;
}

message TerminalProposal {
  AttemptIdentity identity = 1;
  string runtime_instance_id = 2;
  TerminalClassification classification = 3;
  string reason_code = 4;
  ArtifactRef error = 5;
  ArtifactRef transcript = 6;
  ArtifactRef checkpoint = 7;
  ArtifactRef result = 8;
  UsageBudgetSnapshot final_usage = 9;
  uint64 last_emitted_sequence = 10;
  bytes terminal_payload_sha256 = 11;
  AgentRunBudget final_budget = 12;
}

// Host acknowledgement emitted only after the transcript and terminal state
// have crossed the durable commit barrier.
message TerminalCommitted {
  AttemptIdentity identity = 1;
  string terminal_proposal_message_id = 2;
  bytes terminal_payload_sha256 = 3;
  uint64 agent_run_version = 4;
  uint64 attempt_version = 5;
  int64 committed_at_unix_ms = 6;
}

message Ack {
  string acknowledged_message_id = 1;
  bytes acknowledged_payload_sha256 = 2;
  int64 acknowledged_at_unix_ms = 3;
}
