syntax = "proto3";

package codestudio.agent.v1;

// A negotiated protocol version. Major versions are wire-incompatible;
// compatible additions increment minor.
message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message ProtocolVersionRange {
  ProtocolVersion minimum = 1;
  ProtocolVersion maximum = 2;
}

// Durable identity and authority for one AgentRunAttempt.
//
// The host validates every field against the frame header and its durable
// lease before handling a message that can create state or an effect.
message AttemptIdentity {
  string session_id = 1;
  string command_id = 2;
  string agent_run_id = 3;
  string attempt_id = 4;
  string executor_owner_id = 5;
  uint64 fencing_epoch = 6;
  string correlation_id = 7;
  string root_agent_run_id = 8;
  optional string owner_agent_run_id = 9;
  optional string parent_agent_run_id = 10;
}

// Build and process facts used to reject stale, unknown, or revoked runners.
message RuntimeProvenance {
  string build_id = 1;
  string source_commit = 2;
  bytes binary_sha256 = 3;
  string runtime_instance_id = 4;
  uint32 pid = 5;
  string operating_system = 6;
  string architecture = 7;
}

// A versioned immutable input. Hash validation is mandatory before activation.
message SnapshotRef {
  string ref = 1;
  uint64 version = 2;
  bytes content_sha256 = 3;
  string origin = 4;
  string schema_id = 5;
  uint32 schema_version = 6;
}

message NativeCapabilityProvenance {
  string capability_id = 1;
  string version = 2;
  bytes descriptor_sha256 = 3;
  string origin = 4;
}

message ContainmentCapabilities {
  bool process_tree = 1;
  bool memory_limit = 2;
  bool cpu_limit = 3;
  bool process_count_limit = 4;
  bool open_file_limit = 5;
  bool filesystem_quota = 6;
  bool network_policy = 7;
}

enum ContainmentLevel {
  CONTAINMENT_LEVEL_UNSPECIFIED = 0;
  // Owns the full attempt process tree and applies declared limits in aggregate.
  CONTAINMENT_LEVEL_HARD_AGGREGATE = 1;
  // Owns the full attempt process tree; declared limits may be per-process.
  CONTAINMENT_LEVEL_HARD_PROCESS = 2;
  CONTAINMENT_LEVEL_MONITORED = 3;
  CONTAINMENT_LEVEL_UNAVAILABLE = 4;
}

enum ResourceLimitKind {
  RESOURCE_LIMIT_KIND_UNSPECIFIED = 0;
  RESOURCE_LIMIT_KIND_MEMORY = 1;
  RESOURCE_LIMIT_KIND_CPU_TIME = 2;
  RESOURCE_LIMIT_KIND_WALL_TIME = 3;
  RESOURCE_LIMIT_KIND_PROCESSES = 4;
  RESOURCE_LIMIT_KIND_THREADS = 5;
  RESOURCE_LIMIT_KIND_OPEN_HANDLES = 6;
  RESOURCE_LIMIT_KIND_SCRATCH_BYTES = 7;
}

// Truthful result of applying a ResourceBudget. Activation fails closed when
// the required level or limit set is absent.
message ContainmentReport {
  ContainmentLevel level = 1;
  repeated ResourceLimitKind enforced_limits = 2;
  repeated ResourceLimitKind unsupported_limits = 3;
  ContainmentCapabilities capabilities = 4;
}

message FrameLimits {
  uint64 max_frame_bytes = 1;
  uint64 max_chunk_bytes = 2;
  uint64 max_in_flight_frames = 3;
  uint64 max_in_flight_bytes = 4;
  uint64 read_timeout_ms = 5;
  uint64 write_timeout_ms = 6;
  bool transport_crc32c = 7;
}

// Immutable host-minted commitment authorizing one future ActivateAttempt.
//
// The supervisor may carry this seal but never receives the raw activation
// nonce. The runner verifies the versions and SHA-256 of the raw nonce before
// publishing active authority.
message ActivationAuthoritySeal {
  uint64 agent_run_version = 1;
  uint64 attempt_version = 2;
  bytes activation_nonce_sha256 = 3;
}

// Resource limits applied to the whole attempt process tree.
// Zero is invalid in V1: an unlimited value requires a future explicit schema
// variant plus host policy support.
message ResourceBudget {
  uint64 soft_memory_bytes = 1;
  uint64 hard_memory_bytes = 2;
  uint64 cpu_time_ms = 3;
  uint64 max_wall_ms = 4;
  uint32 max_processes = 5;
  uint32 max_threads = 6;
  uint32 max_open_handles = 7;
  uint64 max_hot_transcript_bytes = 8;
  uint32 max_ipc_frames = 9;
  uint64 max_ipc_bytes = 10;
  uint64 max_spool_bytes = 11;
  uint64 max_artifact_bytes = 12;
  uint32 max_concurrent_tools = 13;
  uint32 max_blocking_tasks = 14;
  uint64 cancel_grace_ms = 15;
}

message ResourceSample {
  uint64 resident_memory_bytes = 1;
  uint64 peak_resident_memory_bytes = 2;
  uint64 cpu_time_ms = 3;
  uint32 process_count = 4;
  uint32 open_file_count = 5;
  uint64 spool_bytes = 6;
}

// Logical run-tree budget. Currency values are integer micros, never float.
message AgentRunBudget {
  optional uint64 max_turns = 1;
  optional uint64 max_wall_ms = 2;
  optional uint64 max_input_tokens = 3;
  optional uint64 max_output_tokens = 4;
  optional uint64 max_tool_calls = 5;
  optional uint32 max_agents = 6;
  optional uint32 max_depth = 7;
  optional uint64 max_cost_micros = 8;
  optional string cost_currency = 9;
}

message UsageBudgetSnapshot {
  uint64 turns = 1;
  uint64 wall_ms = 2;
  uint64 input_tokens = 3;
  uint64 output_tokens = 4;
  uint64 tool_calls = 5;
  uint32 child_runs = 6;
  uint64 cost_micros = 7;
  optional string cost_currency = 8;
}
