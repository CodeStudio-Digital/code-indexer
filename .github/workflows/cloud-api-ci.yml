name: cloud-api CI

# Gated CI for the CodeStudio Cloud API: typecheck + unit tests + secret scan on
# every push/PR touching the cloud surface; a manually-approved deploy on master.
on:
  push:
    branches: [master, feature/ide-mvp]
    paths:
      - 'services/cloud-api/**'
      - 'packages/cloud-*/**'
      - '.github/workflows/cloud-api-ci.yml'
  pull_request:
    paths:
      - 'services/cloud-api/**'
      - 'packages/cloud-*/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Worker typecheck (workerd-targeted)
        run: pnpm --filter @cloudstudio/cloud-api exec tsc -p tsconfig.json --noEmit
      - name: Cloud unit tests
        run: >-
          pnpm exec vitest run
          packages/cloud-kernel packages/cloud-identity packages/cloud-billing
          packages/cloud-sharing packages/cloud-feedback services/cloud-api
      - name: LOC cap (advisory)
        run: pnpm check:loc
        continue-on-error: true

  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: gitleaks
        run: gitleaks git . --redact --verbose

  deploy:
    needs: [test, secret-scan]
    # Only on a direct push to master; the `production` environment adds a manual
    # approval gate + holds the deploy secrets (configure in repo settings).
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy Worker
        run: pnpm --filter @cloudstudio/cloud-api exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
