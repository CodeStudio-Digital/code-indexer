<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: var(--font-sans, system-ui);
        background: var(--background, #fff);
        color: var(--foreground, #111827);
        font-size: 12px;
      }
      * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--muted-foreground, #9ca3af) 38%, transparent) transparent; }
      ::-webkit-scrollbar { width: 9px; height: 9px; }
      ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--muted-foreground, #9ca3af) 34%, transparent); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      button:disabled { cursor: default; opacity: .5; }
      .app { height: 100%; display: grid; grid-template-rows: 40px 1fr; min-height: 0; }
      .topbar { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border, #e5e7eb); background: var(--card, #fff); padding: 0 10px; }
      .brand { font-weight: 700; font-size: 14px; }
      .status { display: inline-flex; align-items: center; gap: 5px; color: var(--muted-foreground, #6b7280); }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #9ca3af; }
      .dot.ok { background: #16a34a; } .dot.no { background: #dc2626; }
      .top-spacer { flex: 1; }
      .shell { min-height: 0; display: grid; grid-template-columns: 150px minmax(240px, 34%) 1fr; }
      .shell.solo { grid-template-columns: 150px 1fr; }
      .shell.solo .list-pane { display: none; }
      .shell.solo .detail { grid-column: 2; }
      .rail { min-height: 0; overflow: auto; border-right: 1px solid var(--border, #e5e7eb); background: color-mix(in srgb, var(--muted, #f3f4f6) 42%, transparent); padding: 8px; }
      .rail-group { margin: 10px 0 5px; color: var(--muted-foreground, #6b7280); font-size: 10px; text-transform: uppercase; }
      .nav { width: 100%; display: grid; grid-template-columns: 22px 1fr; align-items: center; gap: 7px; border: 0; border-radius: 6px; background: transparent; color: inherit; text-align: left; padding: 7px 8px; }
      .nav:hover { background: var(--muted, #f3f4f6); }
      .nav.active { background: var(--accent, #e0ecff); color: var(--accent-foreground, #1d4ed8); font-weight: 700; }
      .nav-k { color: var(--muted-foreground, #6b7280); font-family: var(--font-mono, ui-monospace, monospace); font-size: 11px; }
      .nav.active .nav-k { color: inherit; }
      .list-pane { min-width: 0; min-height: 0; overflow: hidden; border-right: 1px solid var(--border, #e5e7eb); display: grid; grid-template-rows: auto auto 1fr; }
      .pane-head { padding: 12px 12px 8px; border-bottom: 1px solid var(--border, #e5e7eb); }
      .pane-title { margin: 0; font-size: 15px; }
      .pane-sub { margin: 3px 0 0; color: var(--muted-foreground, #6b7280); line-height: 1.35; }
      .toolbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--border, #e5e7eb); }
      .search { flex: 1; min-width: 110px; }
      input, select, textarea { min-height: 28px; border: 1px solid var(--border, #d1d5db); border-radius: 6px; background: var(--card, #fff); color: inherit; padding: 5px 8px; }
      textarea { width: 100%; min-height: 80px; resize: vertical; font-family: var(--font-mono, ui-monospace, monospace); }
      .btn { min-height: 28px; border: 1px solid var(--border, #d1d5db); border-radius: 6px; background: var(--card, #fff); color: inherit; padding: 5px 9px; white-space: nowrap; }
      .btn:hover { border-color: color-mix(in srgb, var(--primary, #2563eb) 55%, var(--border, #d1d5db)); }
      .btn.primary { border-color: var(--primary, #2563eb); background: var(--primary, #2563eb); color: var(--primary-foreground, #fff); }
      .btn.danger { border-color: #dc2626; background: #dc2626; color: #fff; }
      .btn.sm { min-height: 24px; padding: 3px 7px; font-size: 11px; }
      .rows { overflow: auto; min-height: 0; }
      .row { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--border, #f1f5f9); background: transparent; color: inherit; padding: 9px 12px; }
      .row:hover { background: var(--muted, #f3f4f6); }
      .row.active { background: var(--accent, #e0ecff); }
      .row-title { font-weight: 600; }
      .row-meta { color: var(--muted-foreground, #6b7280); font-size: 11px; margin-top: 2px; font-family: var(--font-mono, ui-monospace, monospace); }
      .detail { min-width: 0; min-height: 0; overflow: auto; padding: 14px; }
      .detail h2 { margin: 0 0 4px; font-size: 16px; }
      .actions { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
      .kv { display: grid; grid-template-columns: 120px 1fr; gap: 4px 10px; margin-top: 8px; }
      .kv .k { color: var(--muted-foreground, #6b7280); }
      .kv .v { font-family: var(--font-mono, ui-monospace, monospace); word-break: break-all; }
      pre { background: color-mix(in srgb, var(--muted, #f3f4f6) 60%, transparent); border: 1px solid var(--border, #e5e7eb); border-radius: 6px; padding: 10px; overflow: auto; max-height: 320px; white-space: pre-wrap; word-break: break-word; }
      .empty, .error { color: var(--muted-foreground, #6b7280); padding: 16px; }
      .error { color: #dc2626; }
      .field { margin-bottom: 8px; } .field label { display: block; margin-bottom: 3px; color: var(--muted-foreground, #6b7280); }
      .field input, .field textarea, .field select { width: 100%; }
      .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; }
      .modal { width: min(440px, 92vw); background: var(--card, #fff); border: 1px solid var(--border, #e5e7eb); border-radius: 10px; padding: 16px; }
      .modal h3 { margin: 0 0 10px; }
      .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
      .chat-wrap { display: grid; grid-template-rows: auto 1fr auto; gap: 8px; height: 100%; min-height: 0; }
      .chat-bar { display: flex; gap: 6px; }
      .chat-log { overflow: auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
      .chat-empty { color: var(--muted-foreground, #6b7280); padding: 8px 0; }
      .msg { display: flex; } .msg.user { justify-content: flex-end; }
      .bubble { max-width: 86%; border: 1px solid var(--border, #e5e7eb); border-radius: 10px; padding: 7px 10px; white-space: pre-wrap; word-break: break-word; line-height: 1.4; }
      .msg.user .bubble { background: var(--primary, #2563eb); color: var(--primary-foreground, #fff); border-color: var(--primary, #2563eb); }
      .bubble.streaming::after { content: '▌'; opacity: .6; }
      .chat-input { display: flex; gap: 6px; align-items: flex-end; }
      .chat-input textarea { min-height: 32px; max-height: 120px; }
      .tools-strip { display: flex; flex-direction: column; gap: 3px; }
      .tool-line { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted-foreground, #6b7280); font-family: var(--font-mono, ui-monospace, monospace); }
      .tool-line .tdot { width: 6px; height: 6px; border-radius: 50%; background: #9ca3af; }
      .tool-line.run .tdot { background: #2563eb; } .tool-line.ok .tdot { background: #16a34a; } .tool-line.fail .tdot { background: #dc2626; }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <span id="brandText" class="brand"></span>
        <span class="status"><span id="dot" class="dot"></span><span id="statusText"></span></span>
        <span class="top-spacer"></span>
        <button id="refresh" class="btn sm"></button>
      </div>
      <div id="shell" class="shell">
        <div id="rail" class="rail"></div>
        <div class="list-pane">
          <div class="pane-head"><h1 id="paneTitle" class="pane-title"></h1><p id="paneSub" class="pane-sub"></p></div>
          <div class="toolbar"><input id="search" class="search" /><button id="createBtn" class="btn sm primary"></button></div>
          <div id="rows" class="rows"></div>
        </div>
        <div id="detail" class="detail"></div>
      </div>
    </div>
    <div id="modalRoot"></div>
    <script>
      (function () {
        var mcp = window.mcp;
        var ui = (mcp && mcp.i18n && mcp.i18n.translator) ? mcp.i18n.translator({
          en: {},
          'pt-BR': {
            'checking…': 'verificando…',
            'bridge unavailable': 'bridge indisponível',
            'Refresh': 'Atualizar',
            'Filter…': 'Filtrar…',
            'New': 'Novo',
            'Compute': 'Computação',
            'Storage': 'Storage',
            'Network': 'Rede',
            'Tools': 'Ferramentas',
            'Containers': 'Containers',
            'Running containers — run, pause, stop, logs': 'Containers em execução — rodar, pausar, parar, logs',
            'Images': 'Imagens',
            'Local images — run, pull, build, remove': 'Imagens locais — rodar, baixar, buildar, remover',
            'Volumes': 'Volumes',
            'Named volumes': 'Volumes nomeados',
            'Networks': 'Redes',
            'Container networks': 'Redes de container',
            'Pods': 'Pods',
            'Podman pods': 'Pods do Podman',
            'Project': 'Projeto',
            'Detect & run this project': 'Detectar e rodar este projeto',
            'Podman tool failed': 'Tool do Podman falhou',
            'podman ready': 'podman pronto',
            'podman unavailable': 'podman indisponível',
            'Loading…': 'Carregando…',
            'Nothing here.': 'Nada aqui.',
            'Select an item.': 'Selecione um item.',
            'Done': 'Concluído',
            'Unpause': 'Retomar',
            'Pause': 'Pausar',
            'Start': 'Iniciar',
            'Stop': 'Parar',
            'Logs': 'Logs',
            'Remove': 'Remover',
            'Run': 'Rodar',
            'Detect': 'Detectar',
            'Detection': 'Detecção',
            'Build & run': 'Buildar e rodar',
            'Compose up': 'Compose up',
            'Detect Dockerfile/compose in this project and run it with the workspace bind-mounted at /app.': 'Detecta Dockerfile/compose neste projeto e roda com o workspace montado em /app.',
            'Cancel': 'Cancelar',
            'Confirm': 'Confirmar',
            'Run container': 'Rodar container',
            'Image': 'Imagem',
            'Name (optional)': 'Nome (opcional)',
            'Ports (comma-sep, host:container)': 'Portas (separadas por vírgula, host:container)',
            'Env (KEY=VALUE per line)': 'Env (KEY=VALUE por linha)',
            'Volumes (comma-sep)': 'Volumes (separados por vírgula)',
            'Pull image': 'Baixar imagem',
            'Reference': 'Referência',
            'Create volume': 'Criar volume',
            'Name': 'Nome',
            'Driver (optional)': 'Driver (opcional)',
            'Create network': 'Criar rede',
            'Subnet (optional)': 'Subnet (opcional)',
            'Create pod': 'Criar pod',
            'Ports (comma-sep)': 'Portas (separadas por vírgula)',
            'Remove container {name}?': 'Remover container {name}?',
            'Remove image {name}?': 'Remover imagem {name}?',
            'Remove volume {name}?': 'Remover volume {name}?',
            'Remove network {name}?': 'Remover rede {name}?',
            'Remove pod {name}?': 'Remover pod {name}?',
            'Containerize': 'Conteinerizar',
            'Assistant': 'Assistente',
            'Podman best-practices assistant': 'Assistente de boas práticas do Podman',
            'Assistant unavailable in this build.': 'Assistente indisponível nesta build.',
            'Loading models…': 'Carregando modelos…',
            'No models configured': 'Nenhum modelo configurado',
            'Ask about containers, pods, images — optimized, clean and secure.': 'Pergunte sobre containers, pods, imagens — otimizado, limpo e seguro.',
            'Ask the Podman assistant…': 'Pergunte ao assistente do Podman…',
            'Send': 'Enviar',
            'Running {name}…': 'Executando {name}…',
            '{name} done': '{name} concluída',
            '{name} failed': '{name} falhou'
          }
        }) : function (k) { return k; };
        function uiText(text, vars) {
          if (text == null) return '';
          var s = String(text);
          var m = /^Remove container (.+)\?$/.exec(s);
          if (m) return ui('Remove container {name}?', { name: m[1] });
          m = /^Remove image (.+)\?$/.exec(s);
          if (m) return ui('Remove image {name}?', { name: m[1] });
          m = /^Remove volume (.+)\?$/.exec(s);
          if (m) return ui('Remove volume {name}?', { name: m[1] });
          m = /^Remove network (.+)\?$/.exec(s);
          if (m) return ui('Remove network {name}?', { name: m[1] });
          m = /^Remove pod (.+)\?$/.exec(s);
          if (m) return ui('Remove pod {name}?', { name: m[1] });
          return ui(s, vars || {});
        }
        var statusText = document.getElementById('statusText');
        var dot = document.getElementById('dot');
        document.getElementById('brandText').textContent = 'Podman';
        statusText.textContent = uiText('checking…');
        document.getElementById('refresh').textContent = uiText('Refresh');
        document.getElementById('createBtn').textContent = uiText('New');
        document.getElementById('search').placeholder = uiText('Filter…');
        if (!mcp || !mcp.invokeTool) { statusText.textContent = uiText('bridge unavailable'); return; }

        // Resource model: each row comes from listTool, rendered via name/meta.
        var resources = [
          { group: 'Compute', id: 'containers', k: 'PS', title: 'Containers', sub: 'Running containers — run, pause, stop, logs', listTool: 'podman_ps', listArgs: { all: true },
            key: function (r) { return r.id; }, name: function (r) { return (r.names && r.names[0]) || r.id.slice(0,12); }, meta: function (r) { return r.image + ' · ' + r.state; }, detail: detailContainer, create: createRun },
          { group: 'Compute', id: 'images', k: 'IM', title: 'Images', sub: 'Local images — run, pull, build, remove', listTool: 'podman_images',
            key: function (r) { return r.reference; }, name: function (r) { return r.reference; }, meta: function (r) { return r.id.slice(0,12); }, detail: detailImage, create: createPull },
          { group: 'Storage', id: 'volumes', k: 'VO', title: 'Volumes', sub: 'Named volumes', listTool: 'podman_volume_ls',
            key: function (r) { return r.name; }, name: function (r) { return r.name; }, meta: function (r) { return r.driver; }, detail: detailVolume, create: createVolume },
          { group: 'Network', id: 'networks', k: 'NW', title: 'Networks', sub: 'Container networks', listTool: 'podman_network_ls',
            key: function (r) { return r.name; }, name: function (r) { return r.name; }, meta: function (r) { return r.driver; }, detail: detailNetwork, create: createNetwork },
          { group: 'Network', id: 'pods', k: 'PD', title: 'Pods', sub: 'Podman pods', listTool: 'podman_pod_ps',
            key: function (r) { return r.id; }, name: function (r) { return r.name; }, meta: function (r) { return r.status + ' · ' + r.containers; }, detail: detailPod, create: createPod },
          { group: 'Tools', id: 'project', k: 'PJ', title: 'Project', sub: 'Detect & run this project', solo: true, detail: detailProject },
          { group: 'Tools', id: 'assistant', k: 'AI', title: 'Assistant', sub: 'Podman best-practices assistant', solo: true, detail: detailAssistant }
        ];

        var state = { resource: 'containers', selectedKey: null, filter: '', rows: {} };

        var rail = document.getElementById('rail');
        var rowsEl = document.getElementById('rows');
        var detail = document.getElementById('detail');
        var paneTitle = document.getElementById('paneTitle');
        var paneSub = document.getElementById('paneSub');
        var search = document.getElementById('search');

        function resource(id) { return resources.filter(function (r) { return r.id === id; })[0]; }
        function rowsOf(res) { return (res && res.data && res.data.rows) || []; }
        function detailsOf(res) { return (res && res.data && (res.data.details || res.data)) || {}; }
        function call(tool, args) {
          return mcp.invokeTool(tool, args || {}).then(function (r) {
            if (r.isError) throw new Error(r.content || uiText('Podman tool failed'));
            return r;
          });
        }
        function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
        function button(label, cls, fn) { var b = el('button', 'btn ' + (cls || ''), uiText(label)); b.onclick = fn; return b; }
        function toast(kind, message) { if (mcp.ui && mcp.ui.toast) mcp.ui.toast({ kind: kind || 'info', message: message }); }
        function clear(n) { n.innerHTML = ''; }
        function setDetail(n) { clear(detail); detail.appendChild(n); }

        function checkStatus() {
          // podman_ps doubles as a liveness probe.
          call('podman_ps', { all: true }).then(function () { dot.className = 'dot ok'; statusText.textContent = uiText('podman ready'); })
            .catch(function () { dot.className = 'dot no'; statusText.textContent = uiText('podman unavailable'); });
        }

        function renderRail() {
          clear(rail); var group = '';
          resources.forEach(function (r) {
            if (r.group !== group) { group = r.group; rail.appendChild(el('div', 'rail-group', uiText(group))); }
            var b = el('button', 'nav' + (state.resource === r.id ? ' active' : ''));
            b.appendChild(el('span', 'nav-k', r.k)); b.appendChild(el('span', null, uiText(r.title)));
            b.onclick = function () { state.resource = r.id; state.selectedKey = null; state.filter = ''; search.value = ''; render(); };
            rail.appendChild(b);
          });
        }

        function load() {
          var r = resource(state.resource);
          if (!r || !r.listTool) { renderDetail(); return; }
          rowsEl.innerHTML = '';
          rowsEl.appendChild(el('div', 'empty', uiText('Loading…')));
          call(r.listTool, r.listArgs || {}).then(function (res) {
            state.rows[r.id] = rowsOf(res); renderRows(); renderDetail();
          }).catch(function (e) { rowsEl.innerHTML = ''; rowsEl.appendChild(el('div', 'error', String(e.message || e))); });
        }

        function renderRows() {
          var r = resource(state.resource); clear(rowsEl);
          var rows = (state.rows[r.id] || []).filter(function (row) {
            if (!state.filter) return true;
            return (r.name(row) + ' ' + r.meta(row)).toLowerCase().indexOf(state.filter.toLowerCase()) >= 0;
          });
          if (!rows.length) { rowsEl.appendChild(el('div', 'empty', uiText('Nothing here.'))); return; }
          rows.forEach(function (row) {
            var key = r.key(row);
            var b = el('button', 'row' + (state.selectedKey === key ? ' active' : ''));
            b.appendChild(el('div', 'row-title', r.name(row)));
            b.appendChild(el('div', 'row-meta', r.meta(row)));
            b.onclick = function () { state.selectedKey = key; renderRows(); renderDetail(); };
            rowsEl.appendChild(b);
          });
        }

        function selectedRow(r) {
          var rows = state.rows[r.id] || [];
          return rows.filter(function (row) { return r.key(row) === state.selectedKey; })[0] || null;
        }

        function renderDetail() {
          var r = resource(state.resource);
          if (r.solo) { r.detail(); return; }
          var row = selectedRow(r);
          if (!row) { setDetail(el('div', 'empty', uiText('Select an item.'))); return; }
          r.detail(row);
        }

        function kv(obj) {
          var box = el('div', 'kv');
          Object.keys(obj).forEach(function (k) { box.appendChild(el('div', 'k', k)); box.appendChild(el('div', 'v', String(obj[k] == null ? '' : obj[k]))); });
          return box;
        }

        function mutate(tool, args, danger) {
          var go = function () { call(tool, args).then(function (res) { toast('success', res.content || uiText('Done')); load(); }).catch(function (e) { toast('error', String(e.message || e)); }); };
          if (danger) confirmModal(danger).then(function (ok) { if (ok) go(); }); else go();
        }

        // ── detail renderers ───────────────────────────────────────────────
        function detailContainer(c) {
          var box = el('div'); box.appendChild(el('h2', null, (c.names && c.names[0]) || c.id.slice(0,12)));
          var a = el('div', 'actions');
          a.appendChild(button(c.state === 'paused' ? 'Unpause' : 'Pause', '', function () { mutate(c.state === 'paused' ? 'podman_unpause' : 'podman_pause', { container: c.id }); }));
          a.appendChild(button('Start', 'sm', function () { mutate('podman_start', { container: c.id }); }));
          a.appendChild(button('Stop', 'sm', function () { mutate('podman_stop', { container: c.id }); }));
          a.appendChild(button('Logs', 'sm', function () { showLogs(c.id); }));
          a.appendChild(button('Remove', 'danger sm', function () { mutate('podman_rm', { container: c.id, force: true }, 'Remove container ' + ((c.names && c.names[0]) || c.id) + '?'); }));
          box.appendChild(a);
          box.appendChild(kv({ id: c.id.slice(0,12), image: c.image, state: c.state, status: c.status, ports: c.ports || '-' }));
          setDetail(box);
        }
        function showLogs(id) {
          call('podman_logs', { container: id, tail: 300 }).then(function (res) {
          var box = el('div'); box.appendChild(el('h2', null, uiText('Logs'))); box.appendChild(el('pre', null, res.content)); setDetail(box);
          }).catch(function (e) { toast('error', String(e.message || e)); });
        }
        function detailImage(i) {
          var box = el('div'); box.appendChild(el('h2', null, i.reference));
          var a = el('div', 'actions');
          a.appendChild(button('Run', 'primary sm', function () { createRun(i.reference); }));
          a.appendChild(button('Remove', 'danger sm', function () { mutate('podman_rmi', { reference: i.reference, force: true }, 'Remove image ' + i.reference + '?'); }));
          box.appendChild(a); box.appendChild(kv({ id: i.id.slice(0,12), repository: i.repository, tag: i.tag, size: i.size ? (i.size/1048576).toFixed(0) + ' MB' : '-' }));
          setDetail(box);
        }
        function detailVolume(v) {
          var box = el('div'); box.appendChild(el('h2', null, v.name));
          var a = el('div', 'actions'); a.appendChild(button('Remove', 'danger sm', function () { mutate('podman_volume_rm', { name: v.name, force: true }, 'Remove volume ' + v.name + '?'); }));
          box.appendChild(a); box.appendChild(kv({ driver: v.driver, mountpoint: v.mountpoint || '-' })); setDetail(box);
        }
        function detailNetwork(n) {
          var box = el('div'); box.appendChild(el('h2', null, n.name));
          var a = el('div', 'actions'); a.appendChild(button('Remove', 'danger sm', function () { mutate('podman_network_rm', { name: n.name, force: true }, 'Remove network ' + n.name + '?'); }));
          box.appendChild(a); box.appendChild(kv({ id: n.id ? n.id.slice(0,12) : '-', driver: n.driver })); setDetail(box);
        }
        function detailPod(p) {
          var box = el('div'); box.appendChild(el('h2', null, p.name));
          var a = el('div', 'actions');
          a.appendChild(button('Start', 'sm', function () { mutate('podman_pod_start', { pod: p.id }); }));
          a.appendChild(button('Stop', 'sm', function () { mutate('podman_pod_stop', { pod: p.id }); }));
          a.appendChild(button('Remove', 'danger sm', function () { mutate('podman_pod_rm', { pod: p.id, force: true }, 'Remove pod ' + p.name + '?'); }));
          box.appendChild(a); box.appendChild(kv({ id: p.id.slice(0,12), status: p.status, containers: p.containers })); setDetail(box);
        }
        function detailProject() {
          var box = el('div'); box.appendChild(el('h2', null, uiText('Project')));
          var a = el('div', 'actions');
          a.appendChild(button('Detect', '', function () {
            call('podman_detect', {}).then(function (res) { var d = detailsOf(res); var c = el('div'); c.appendChild(el('h2', null, uiText('Detection'))); c.appendChild(el('pre', null, res.content)); var ar = el('div', 'actions'); if (d.containerfile) ar.appendChild(button('Build & run', 'primary', function () { mutate('podman_project_run', {}); })); c.appendChild(ar); setDetail(c); }).catch(function (e) { toast('error', String(e.message || e)); });
          }));
          a.appendChild(button('Build & run', 'primary', function () { mutate('podman_project_run', {}); }));
          a.appendChild(button('Containerize', 'sm', function () {
            call('podman_containerize', {}).then(function (res) {
              var d = detailsOf(res);
              var c = el('div'); c.appendChild(el('h2', null, uiText('Containerize')));
              c.appendChild(el('p', 'pane-sub', res.content));
              c.appendChild(el('pre', null, d.containerfile || ''));
              setDetail(c); toast('success', res.content);
            }).catch(function (e) { toast('error', String(e.message || e)); });
          }));
          a.appendChild(button('Compose up', 'sm', function () { mutate('podman_compose', { action: 'up', detach: true }); }));
          box.appendChild(a); box.appendChild(el('p', 'pane-sub', uiText('Detect Dockerfile/compose in this project and run it with the workspace bind-mounted at /app.'))); setDetail(box);
        }

        // ── assistant (chat) ───────────────────────────────────────────────
        function detailAssistant() {
          if (!mcp.assistant || !mcp.assistant.chat) {
            setDetail(el('div', 'error', uiText('Assistant unavailable in this build.'))); return;
          }
          var wrap = el('div', 'chat-wrap');
          var bar = el('div', 'chat-bar'); var modelSel = el('select');
          modelSel.innerHTML = '<option value="">' + uiText('Loading models…') + '</option>';
          bar.appendChild(modelSel); wrap.appendChild(bar);
          var log = el('div', 'chat-log'); log.appendChild(el('div', 'chat-empty', uiText('Ask about containers, pods, images — optimized, clean and secure.')));
          wrap.appendChild(log);
          var inputRow = el('div', 'chat-input'); var ask = el('textarea'); ask.rows = 1; ask.placeholder = uiText('Ask the Podman assistant…');
          var send = button('Send', 'primary', go); inputRow.appendChild(ask); inputRow.appendChild(send); wrap.appendChild(inputRow);
          setDetail(wrap);

          var closeChat = null, history = [], started = false, toolStrip = null;
          function startLog() { if (!started) { log.innerHTML = ''; started = true; } }
          function userBubble(text) { startLog(); toolStrip = null; var m = el('div', 'msg user'); m.appendChild(el('div', 'bubble', text)); log.appendChild(m); log.scrollTop = log.scrollHeight; }
          function botBubble() { startLog(); toolStrip = null; var m = el('div', 'msg bot'); var b = el('div', 'bubble streaming'); m.appendChild(b); log.appendChild(m); log.scrollTop = log.scrollHeight; return b; }
          function toolLine(name) { startLog(); if (!toolStrip) { toolStrip = el('div', 'tools-strip'); log.appendChild(toolStrip); } var line = el('div', 'tool-line run'); line.appendChild(el('span', 'tdot')); line.appendChild(el('span', null, uiText('Running {name}…', { name: name }))); toolStrip.appendChild(line); log.scrollTop = log.scrollHeight; return line; }

          mcp.assistant.listModels().then(function (models) {
            modelSel.innerHTML = '';
            if (!models || !models.length) { modelSel.innerHTML = '<option value="">' + uiText('No models configured') + '</option>'; return; }
            models.forEach(function (m) { var o = el('option'); o.value = m.providerId + '|' + m.modelId; o.textContent = m.label + (m.isDefault ? ' *' : ''); if (m.isDefault) o.selected = true; modelSel.appendChild(o); });
          }).catch(function () { modelSel.innerHTML = '<option value="">' + uiText('No models configured') + '</option>'; });

          function go() {
            var msg = ask.value.trim(); if (!msg || closeChat) return;
            ask.value = ''; ask.style.height = 'auto'; userBubble(msg);
            var sel = (modelSel.value || '').split('|'); var text = '', bubble = null, pending = {};
            send.disabled = true;
            closeChat = mcp.assistant.chat(msg, { providerId: sel[0] || undefined, modelId: sel[1] || undefined, history: history.slice() }, {
              onData: function (c) {
                if (c.type === 'text') { if (!bubble) bubble = botBubble(); text += c.text; bubble.textContent = text; log.scrollTop = log.scrollHeight; }
                else if (c.type === 'tool_use') { pending[c.callId || c.name] = toolLine(c.name); bubble = null; }
                else if (c.type === 'tool_result') { var ln = pending[c.callId || c.name]; if (ln) { ln.className = 'tool-line ' + (c.isError ? 'fail' : 'ok'); ln.lastChild.textContent = uiText(c.isError ? '{name} failed' : '{name} done', { name: c.name }); } }
                else if (c.type === 'confirm_request') confirmModal(c.name + '\n\n' + JSON.stringify(c.input, null, 2)).then(function (okv) { mcp.assistant.confirm(c.callId, okv); });
                else if (c.type === 'error') { if (bubble) bubble.classList.remove('streaming'); botBubble().textContent = '⚠ ' + c.message; }
              },
              onEnd: function () { if (bubble) bubble.classList.remove('streaming'); if (text) history.push({ role: 'user', text: msg }, { role: 'assistant', text: text }); closeChat = null; send.disabled = false; ask.focus(); },
              onError: function (m) { botBubble().textContent = '⚠ ' + m; closeChat = null; send.disabled = false; }
            });
          }
          ask.addEventListener('input', function () { ask.style.height = 'auto'; ask.style.height = Math.min(ask.scrollHeight, 120) + 'px'; });
          ask.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); } });
          ask.focus();
        }

        // ── create / run modals ────────────────────────────────────────────
        function fieldsModal(title, fields, onSubmit) {
          var root = document.getElementById('modalRoot');
          var backdrop = el('div', 'backdrop'); var modal = el('div', 'modal'); modal.appendChild(el('h3', null, uiText(title)));
          var inputs = {};
          fields.forEach(function (f) {
            var wrap = el('div', 'field'); wrap.appendChild(el('label', null, uiText(f.label)));
            var input = f.textarea ? el('textarea') : el('input'); input.value = f.value || ''; if (f.placeholder) input.placeholder = uiText(f.placeholder);
            inputs[f.key] = input; wrap.appendChild(input); modal.appendChild(wrap);
          });
          var actions = el('div', 'modal-actions');
          actions.appendChild(button('Cancel', '', function () { root.innerHTML = ''; }));
          actions.appendChild(button('Run', 'primary', function () {
            var out = {}; Object.keys(inputs).forEach(function (k) { out[k] = inputs[k].value.trim(); }); root.innerHTML = ''; onSubmit(out);
          }));
          modal.appendChild(actions); backdrop.appendChild(modal); root.appendChild(backdrop);
        }
        function confirmModal(text) {
          return new Promise(function (resolve) {
            var root = document.getElementById('modalRoot'); var backdrop = el('div', 'backdrop'); var modal = el('div', 'modal');
            modal.appendChild(el('h3', null, uiText('Confirm'))); modal.appendChild(el('p', null, uiText(text)));
            var actions = el('div', 'modal-actions');
            actions.appendChild(button('Cancel', '', function () { root.innerHTML = ''; resolve(false); }));
            actions.appendChild(button('Confirm', 'danger', function () { root.innerHTML = ''; resolve(true); }));
            modal.appendChild(actions); backdrop.appendChild(modal); root.appendChild(backdrop);
          });
        }
        function createRun(image) {
          fieldsModal('Run container', [
            { key: 'image', label: 'Image', value: image || '', placeholder: 'docker.io/library/nginx:latest' },
            { key: 'name', label: 'Name (optional)' },
            { key: 'ports', label: 'Ports (comma-sep, host:container)', placeholder: '8080:80' },
            { key: 'env', label: 'Env (KEY=VALUE per line)', textarea: true },
            { key: 'volumes', label: 'Volumes (comma-sep)', placeholder: '/host:/app' }
          ], function (v) {
            mutate('podman_run', { image: v.image, name: v.name || undefined, ports: v.ports, env: v.env, volumes: v.volumes });
          });
        }
        function createPull() { fieldsModal('Pull image', [{ key: 'reference', label: 'Reference', placeholder: 'docker.io/library/node:20' }], function (v) { mutate('podman_pull', { reference: v.reference }); }); }
        function createVolume() { fieldsModal('Create volume', [{ key: 'name', label: 'Name' }, { key: 'driver', label: 'Driver (optional)' }], function (v) { mutate('podman_volume_create', { name: v.name, driver: v.driver || undefined }); }); }
        function createNetwork() { fieldsModal('Create network', [{ key: 'name', label: 'Name' }, { key: 'subnet', label: 'Subnet (optional)' }], function (v) { mutate('podman_network_create', { name: v.name, subnet: v.subnet || undefined }); }); }
        function createPod() { fieldsModal('Create pod', [{ key: 'name', label: 'Name' }, { key: 'ports', label: 'Ports (comma-sep)' }], function (v) { mutate('podman_pod_create', { name: v.name, ports: v.ports }); }); }

        // ── wiring ─────────────────────────────────────────────────────────
        function render() {
          var r = resource(state.resource);
          document.getElementById('shell').className = 'shell' + (r.solo ? ' solo' : '');
          paneTitle.textContent = uiText(r.title); paneSub.textContent = uiText(r.sub || '');
          document.getElementById('createBtn').style.display = r.create ? '' : 'none';
          document.getElementById('createBtn').onclick = function () { if (r.create) r.create(); };
          renderRail();
          if (r.solo) renderDetail(); else load();
        }
        search.oninput = function () { state.filter = search.value; renderRows(); };
        document.getElementById('refresh').onclick = function () { checkStatus(); render(); };
        checkStatus(); render();
      })();
    </script>
  </body>
</html>
