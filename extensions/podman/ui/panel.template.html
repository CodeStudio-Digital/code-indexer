<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { height: 100%; }
      .pod-topbar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
        height: 40px;
        padding: 0 10px;
        border-bottom: 1px solid var(--border, #e5e7eb);
        background: var(--card, #fff);
      }
      .pod-brand { font-weight: 700; font-size: 14px; }
      .pod-status { font-size: 11px; }
      .pod-shell-host { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .pod-body-pane { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: auto; }
      .pod-pad { padding: 14px; }

      .pod-backdrop {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(0, 0, 0, .4);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .pod-modal {
        width: min(440px, 92vw);
        max-height: 86vh;
        overflow: auto;
        background: var(--card, #fff);
        border: 1px solid var(--border, #e5e7eb);
        border-radius: 12px;
        padding: 16px;
      }
      .pod-modal-title { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
      .pod-modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

      .pod-chat { display: flex; flex-direction: column; gap: 8px; height: 100%; min-height: 0; padding: 12px; }
      .pod-chat-bar { display: flex; gap: 6px; flex: none; }
      .pod-chat-models { max-width: 280px; }
      .pod-chat-log { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
      .pod-chat-input { display: flex; gap: 6px; align-items: flex-end; flex: none; }
      .pod-chat-ask { min-height: 34px; max-height: 120px; }
      .pod-bubble {
        align-self: flex-start;
        max-width: 86%;
        border: 1px solid var(--border, #e5e7eb);
        border-radius: 10px;
        padding: 7px 10px;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.45;
      }
      .pod-bubble.user {
        align-self: flex-end;
        background: var(--primary, #2563eb);
        color: var(--primary-foreground, #fff);
        border-color: var(--primary, #2563eb);
      }
      .pod-bubble.streaming::after { content: '▌'; opacity: .6; }
      .pod-tools { display: flex; flex-direction: column; gap: 3px; }
      .pod-tool {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--muted-foreground, #6b7280);
        font-family: var(--font-mono, ui-monospace, monospace);
      }
      .pod-tool::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .pod-tool.run { color: var(--primary, #2563eb); }
      .pod-tool.ok { color: var(--success, #16a34a); }
      .pod-tool.fail { color: var(--destructive, #dc2626); }
    </style>
  </head>
  <body>
    <div id="root" class="mcp-app"></div>
    <script src="./src/main.ts"></script>
  </body>
</html>
