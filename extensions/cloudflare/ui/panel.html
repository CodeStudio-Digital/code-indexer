<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; font-family: var(--font-sans, system-ui);
        background: var(--background, #fff); color: var(--foreground, #111);
        font-size: 13px; display: flex; flex-direction: column;
      }
      header { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-bottom: 1px solid var(--border, #e5e7eb); flex-shrink: 0; }
      header .title { font-weight: 600; font-size: 14px; }
      .badge { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--muted, #eee); color: var(--muted-foreground, #666); }
      .badge.ok { background: #16a34a22; color: #16a34a; } .badge.no { background: #dc262622; color: #dc2626; }
      header .acct { margin-left: auto; font-size: 11px; color: var(--muted-foreground, #888); }
      .shell { flex: 1; min-height: 0; display: flex; }
      /* sidebar nav */
      aside { width: 168px; flex-shrink: 0; border-right: 1px solid var(--border, #eee); overflow: auto; padding: 8px 6px; }
      aside .navitem { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 7px 10px; border: 0; background: transparent; cursor: pointer; color: var(--foreground, #111); border-radius: var(--radius, 6px); font: inherit; }
      aside .navitem:hover { background: var(--muted, #f1f1f1); }
      aside .navitem.active { background: var(--accent, #e6efff); color: var(--accent-foreground, #1d4ed8); font-weight: 500; }
      aside .navitem .ico { width: 16px; text-align: center; opacity: .8; }
      /* content */
      main { flex: 1; min-width: 0; overflow: auto; padding: 16px 18px; }
      h2 { margin: 0 0 2px; font-size: 15px; }
      .sub { color: var(--muted-foreground, #888); font-size: 12px; margin: 0 0 14px; }
      .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
      input, select, textarea {
        padding: 7px 9px; font: inherit; border: 1px solid var(--border, #ccc);
        border-radius: var(--radius, 6px); background: var(--card, #fff); color: inherit;
      }
      input, select { flex: 1; min-width: 140px; }
      textarea { width: 100%; min-height: 64px; font-family: var(--font-mono, monospace); resize: vertical; }
      button.act { padding: 7px 14px; font: inherit; cursor: pointer; border: 0; border-radius: var(--radius, 6px); background: var(--primary, #2563eb); color: var(--primary-foreground, #fff); white-space: nowrap; }
      button.act.sec { background: var(--secondary, #eee); color: var(--secondary-foreground, #111); }
      button.act.sm { padding: 4px 10px; font-size: 12px; }
      button.act:disabled { opacity: .5; cursor: default; }
      .cards { display: flex; flex-direction: column; gap: 6px; }
      .card { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border, #eee); border-radius: var(--radius, 8px); }
      .card .grow { flex: 1; min-width: 0; }
      .card .name { font-weight: 500; }
      .card .meta { font-size: 11px; color: var(--muted-foreground, #888); font-family: var(--font-mono, monospace); margin-top: 1px; }
      .card.click { cursor: pointer; } .card.click:hover { border-color: var(--primary, #2563eb); }
      .muted { color: var(--muted-foreground, #888); }
      .empty { text-align: center; color: var(--muted-foreground, #999); padding: 30px 12px; font-size: 12px; border: 1px dashed var(--border, #ddd); border-radius: var(--radius, 8px); }
      .err { color: #dc2626; font-size: 12px; padding: 8px 0; white-space: pre-wrap; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border, #eee); white-space: nowrap; }
      th { color: var(--muted-foreground, #777); font-weight: 600; position: sticky; top: 0; background: var(--background, #fff); }
      td { font-family: var(--font-mono, monospace); }
      .grid-wrap { overflow: auto; border: 1px solid var(--border, #eee); border-radius: var(--radius, 8px); max-height: 46vh; }
      .crumbs { font-size: 12px; color: var(--muted-foreground, #888); margin-bottom: 8px; }
      .crumbs a { color: var(--primary, #2563eb); cursor: pointer; text-decoration: none; }
      .stream { background: var(--muted, #f3f3f3); padding: 10px; border-radius: var(--radius, 6px); font-family: var(--font-mono, monospace); font-size: 12px; white-space: pre-wrap; overflow: auto; max-height: 42vh; margin-top: 10px; }
      #chat { border: 1px solid var(--border, #eee); border-radius: var(--radius, 8px); padding: 10px; min-height: 140px; max-height: 42vh; overflow: auto; margin-bottom: 10px; }
      #chat .b { margin: 6px 0; line-height: 1.45; } #chat .role { color: var(--muted-foreground, #888); font-weight: 600; margin-right: 4px; }
      #chat .sys { color: var(--muted-foreground, #999); font-size: 11px; font-family: var(--font-mono, monospace); }
      .nobridge { padding: 28px; text-align: center; color: var(--muted-foreground, #888); }
    </style>
  </head>
  <body>
    <header>
      <span class="title">Cloudflare</span>
      <span class="badge" id="status">…</span>
      <span class="acct" id="acct"></span>
    </header>
    <div class="shell">
      <aside id="nav"></aside>
      <main id="view"><div class="empty">…</div></main>
    </div>

    <script>
      (function () {
        if (!window.mcp || !window.mcp.invokeTool) {
          document.body.innerHTML = '<div class="nobridge">Plugin bridge unavailable.<br>Restart the IDE and reopen this panel.</div>';
          return;
        }
        var mcp = window.mcp;
        var t = mcp.i18n.translator({
          en: {
            overview: 'Overview', databases: 'Databases', storage: 'Storage', queues: 'Queues',
            vectorize: 'Vectorize', deploy: 'Deploy', dns: 'DNS', logs: 'Logs', assistant: 'Assistant',
            settings: 'Settings',
            connected: 'Connected', notProject: 'Not a Cloudflare project',
            refresh: 'Refresh', run: 'Run', open: 'Open', back: 'Back', create: 'Create', deleteW: 'Delete',
            noAccount: 'Connect an account in Settings first.', empty: 'Nothing here yet.',
            d1Sub: 'Your D1 SQL databases. Click one to browse tables and run queries.',
            tables: 'Tables', query: 'Query', runQuery: 'Run query', rows: 'rows',
            kvNs: 'KV namespaces', buckets: 'R2 buckets', objects: 'Objects',
            tokenLabel: 'Cloudflare API token', tokenPh: 'paste an API token', save: 'Save & connect',
            tokenHint: 'Stored only for this plugin. Enables the dashboard below.',
            deploySub: 'Deploy this project and see recent deployments.',
            deployNow: 'Deploy now', lastDeploys: 'Recent deployments',
            tail: 'Live logs', login: 'Login (browser)', stop: 'Stop',
            askPh: 'Ask in plain language — e.g. "list my databases and deploy"',
            send: 'Send', cancel: 'Cancel', aiEmpty: 'Cloudflare-scoped assistant. Off-topic is refused.',
            configureAI: 'Configure a provider in Settings → AI', confirmRun: 'Run', loading: 'Loading…'
          },
          'pt-BR': {
            overview: 'Visão geral', databases: 'Bancos de dados', storage: 'Armazenamento', queues: 'Filas',
            vectorize: 'Vectorize', deploy: 'Deploy', dns: 'DNS', logs: 'Logs', assistant: 'Assistente',
            settings: 'Configuração',
            connected: 'Conectado', notProject: 'Não é um projeto Cloudflare',
            refresh: 'Atualizar', run: 'Executar', open: 'Abrir', back: 'Voltar', create: 'Criar', deleteW: 'Excluir',
            noAccount: 'Conecte uma conta em Configuração primeiro.', empty: 'Nada aqui ainda.',
            d1Sub: 'Seus bancos SQL D1. Clique num para ver tabelas e rodar queries.',
            tables: 'Tabelas', query: 'Query', runQuery: 'Rodar query', rows: 'linhas',
            kvNs: 'Namespaces KV', buckets: 'Buckets R2', objects: 'Objetos',
            tokenLabel: 'Token de API da Cloudflare', tokenPh: 'cole um token de API', save: 'Salvar & conectar',
            tokenHint: 'Guardado só para este plugin. Habilita o painel abaixo.',
            deploySub: 'Faça deploy deste projeto e veja deploys recentes.',
            deployNow: 'Fazer deploy', lastDeploys: 'Deploys recentes',
            tail: 'Logs ao vivo', login: 'Entrar (navegador)', stop: 'Parar',
            askPh: 'Peça em linguagem natural — ex.: "liste meus bancos e faça deploy"',
            send: 'Enviar', cancel: 'Cancelar', aiEmpty: 'Assistente focado em Cloudflare. Fora do escopo é recusado.',
            configureAI: 'Configure um provedor em Configuração → IA', confirmRun: 'Executar', loading: 'Carregando…'
          }
        });

        var view = document.getElementById('view');
        // Thin wrapper: call a tool, return its structured rows (or throw the error text).
        function call(tool, args) {
          return mcp.invokeTool(tool, args || {}).then(function (r) {
            if (r.isError) throw new Error(r.content || 'error');
            return r;
          });
        }
        function rowsOf(r) { return (r.data && r.data.rows) || []; }
        // Resilient fallback: if a tool returned no structured rows (older
        // backend, or a tool that only emits text), show its content lines so
        // the user NEVER sees "empty" when there's actually data.
        function contentLines(r) {
          var c = (r && r.content || '').trim();
          if (!c) return [];
          return c.split('\n').map(function (s) { return s.replace(/^[-•●○]\s*/, '').trim(); }).filter(Boolean);
        }
        function hasData(r) { return rowsOf(r).length > 0 || contentLines(r).length > 0; }
        function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
        function setView(node) { view.innerHTML = ''; view.appendChild(node); }
        function loading() { setView(el('div', 'empty', t('loading'))); }
        function showErr(e) { var d = el('div', 'err', String(e && e.message || e)); setView(d); }
        function needAccount(node) { setView(el('div', 'empty', t('noAccount'))); }

        // header status
        function refreshHeader() {
          call('cf_detect').then(function (r) {
            var isCf = !/Not a Cloudflare/.test(r.content);
            var s = document.getElementById('status');
            s.textContent = isCf ? t('connected') : t('notProject');
            s.className = 'badge ' + (isCf ? 'ok' : 'no');
          }).catch(function () {});
          call('cf_whoami').then(function (r) {
            var rows = rowsOf(r);
            var sel = rows.filter(function (a) { return a.selected; })[0] || rows[0];
            document.getElementById('acct').textContent = sel ? (sel.name || sel.id) : '';
          }).catch(function () { document.getElementById('acct').textContent = ''; });
        }

        // ── sections ──
        var SECTIONS = [
          { id: 'overview', ico: '◆', render: renderOverview },
          { id: 'databases', ico: '▤', render: renderDatabases },
          { id: 'storage', ico: '▣', render: renderStorage },
          { id: 'queues', ico: '↔', render: renderQueues },
          { id: 'vectorize', ico: '◈', render: renderVectorize },
          { id: 'deploy', ico: '▲', render: renderDeploy },
          { id: 'dns', ico: '◉', render: renderDns },
          { id: 'logs', ico: '≣', render: renderLogs },
          { id: 'assistant', ico: '✦', render: renderAssistant },
          { id: 'settings', ico: '⚙', render: renderSettings }
        ];
        var current = 'overview';
        function buildNav() {
          var nav = document.getElementById('nav'); nav.innerHTML = '';
          SECTIONS.forEach(function (s) {
            var b = el('button', 'navitem' + (s.id === current ? ' active' : ''));
            b.appendChild(el('span', 'ico', s.ico));
            b.appendChild(el('span', null, t(s.id)));
            b.onclick = function () { current = s.id; buildNav(); s.render(); };
            nav.appendChild(b);
          });
        }

        // header + section helpers
        function head(titleKey, subKey, actions) {
          var wrap = el('div');
          wrap.appendChild(el('h2', null, t(titleKey)));
          if (subKey) wrap.appendChild(el('p', 'sub', t(subKey)));
          if (actions) { var bar = el('div', 'toolbar'); actions.forEach(function (a) { bar.appendChild(a); }); wrap.appendChild(bar); }
          return wrap;
        }
        function listFromTool(tool, opts) {
          // opts: { name(row), meta(row), onClick(row), actions(row)->[btn] }
          var box = el('div'); var cards = el('div', 'cards'); box.appendChild(cards);
          cards.appendChild(el('div', 'muted', t('loading')));
          call(tool).then(function (r) {
            var rows = rowsOf(r); cards.innerHTML = '';
            if (rows.length) {
              rows.forEach(function (row) {
                var c = el('div', 'card' + (opts.onClick ? ' click' : ''));
                var g = el('div', 'grow');
                g.appendChild(el('div', 'name', opts.name(row)));
                if (opts.meta) g.appendChild(el('div', 'meta', opts.meta(row)));
                c.appendChild(g);
                if (opts.onClick) c.onclick = function () { opts.onClick(row); };
                (opts.actions ? opts.actions(row) : []).forEach(function (b) { c.appendChild(b); });
                cards.appendChild(c);
              });
              return;
            }
            // Fallback: no structured rows but the tool returned text → show it,
            // so real data never reads as "empty".
            var lines = contentLines(r);
            if (lines.length) {
              lines.forEach(function (line) {
                var c = el('div', 'card'); c.appendChild(el('div', 'grow', null));
                c.firstChild.appendChild(el('div', 'name', line));
                cards.appendChild(c);
              });
              return;
            }
            cards.appendChild(el('div', 'empty', t('empty')));
          }).catch(function (e) { cards.innerHTML = ''; cards.appendChild(el('div', 'err', String(e.message || e))); });
          return box;
        }

        // ── Overview ──
        function renderOverview() {
          var n = el('div'); n.appendChild(head('overview', null, [mkRefresh(renderOverview)]));
          var grid = el('div', 'cards');
          [['databases','▤'],['storage','▣'],['queues','↔'],['deploy','▲'],['dns','◉'],['assistant','✦']].forEach(function (p) {
            var c = el('div', 'card click'); var g = el('div', 'grow');
            g.appendChild(el('div', 'name', p[1] + '  ' + t(p[0])));
            c.appendChild(g); c.onclick = function () { current = p[0]; buildNav(); SECTIONS.filter(function(s){return s.id===p[0];})[0].render(); };
            grid.appendChild(c);
          });
          n.appendChild(grid); setView(n);
        }

        function mkRefresh(fn) { var b = el('button', 'act sec sm', t('refresh')); b.onclick = fn; return b; }

        // ── Databases (list → tables → query) ──
        function renderDatabases() {
          var n = head('databases', 'd1Sub', [mkRefresh(renderDatabases)]);
          n.appendChild(listFromTool('cf_d1_list', {
            name: function (r) { return r.name; },
            meta: function (r) { return r.uuid; },
            onClick: function (r) { openDatabase(r); }
          }));
          setView(n);
        }
        function openDatabase(db) {
          var n = el('div');
          var cr = el('div', 'crumbs'); var a = el('a', null, t('databases')); a.onclick = renderDatabases;
          cr.appendChild(a); cr.appendChild(document.createTextNode(' / ' + db.name)); n.appendChild(cr);
          n.appendChild(el('h2', null, db.name));
          // query box
          var ta = el('textarea'); ta.value = "SELECT name FROM sqlite_master WHERE type='table'";
          n.appendChild(ta);
          var bar = el('div', 'toolbar'); var run = el('button', 'act', t('runQuery'));
          bar.appendChild(run); n.appendChild(bar);
          var result = el('div'); n.appendChild(result);
          run.onclick = function () {
            run.disabled = true; result.innerHTML = ''; result.appendChild(el('div', 'muted', t('loading')));
            call('cf_d1_query', { database: db.name, sql: ta.value }).then(function (r) {
              result.innerHTML = ''; renderGrid(result, r);
            }).catch(function (e) { result.innerHTML = ''; result.appendChild(el('div', 'err', String(e.message || e))); })
            .finally(function () { run.disabled = false; });
          };
          setView(n); run.onclick();
        }
        function renderGrid(parent, data) {
          var rows = data.rows || []; var cols = data.columns || (rows[0] ? Object.keys(rows[0]) : []);
          parent.appendChild(el('div', 'sub', rows.length + ' ' + t('rows')));
          if (!rows.length) { parent.appendChild(el('div', 'empty', t('empty'))); return; }
          var wrap = el('div', 'grid-wrap'); var table = el('table');
          var thead = el('tr'); cols.forEach(function (c) { thead.appendChild(el('th', null, c)); }); table.appendChild(thead);
          rows.forEach(function (row) {
            var tr = el('tr'); cols.forEach(function (c) { var v = row[c]; tr.appendChild(el('td', null, v == null ? '' : (typeof v === 'object' ? JSON.stringify(v) : String(v)))); }); table.appendChild(tr);
          });
          wrap.appendChild(table); parent.appendChild(wrap);
        }

        // ── Storage (KV + R2) ──
        function renderStorage() {
          var n = head('storage', null, [mkRefresh(renderStorage)]);
          n.appendChild(el('h2', null, t('kvNs')));
          n.appendChild(listFromTool('cf_kv_list', { name: function (r) { return r.title; }, meta: function (r) { return r.id; } }));
          n.appendChild(el('div', null, '')).style.height = '14px';
          n.appendChild(el('h2', null, t('buckets')));
          n.appendChild(listFromTool('cf_r2_list', {
            name: function (r) { return r.name; }, meta: function (r) { return r.creation_date || ''; },
            onClick: function (r) { openBucket(r); }
          }));
          setView(n);
        }
        function openBucket(b) {
          var n = el('div');
          var cr = el('div', 'crumbs'); var a = el('a', null, t('storage')); a.onclick = renderStorage;
          cr.appendChild(a); cr.appendChild(document.createTextNode(' / ' + b.name)); n.appendChild(cr);
          n.appendChild(el('h2', null, b.name));
          var box = el('div', 'cards'); box.appendChild(el('div', 'muted', t('loading'))); n.appendChild(box);
          call('cf_r2_objects', { bucket: b.name }).then(function (r) {
            var rows = rowsOf(r); box.innerHTML = '';
            if (!rows.length) { box.appendChild(el('div', 'empty', t('empty'))); return; }
            rows.forEach(function (o) { var c = el('div', 'card'); var g = el('div', 'grow'); g.appendChild(el('div', 'name', o.key)); g.appendChild(el('div', 'meta', (o.size != null ? o.size + ' bytes' : ''))); c.appendChild(g); box.appendChild(c); });
          }).catch(function (e) { box.innerHTML = ''; box.appendChild(el('div', 'err', String(e.message || e))); });
          setView(n);
        }

        // ── Queues / Vectorize / DNS (simple lists) ──
        function renderQueues() {
          var n = head('queues', null, [mkRefresh(renderQueues)]);
          n.appendChild(listFromTool('cf_queues_list', { name: function (r) { return r.queue_name || r.name; }, meta: function (r) { return r.queue_id || ''; } }));
          setView(n);
        }
        function renderVectorize() {
          var n = head('vectorize', null, [mkRefresh(renderVectorize)]);
          n.appendChild(listFromTool('cf_vectorize_list', { name: function (r) { return r.name; }, meta: function (r) { return (r.config ? ('dim ' + r.config.dimensions + ' · ' + r.config.metric) : ''); } }));
          setView(n);
        }
        function renderDns() {
          var n = head('dns', null, [mkRefresh(renderDns)]);
          n.appendChild(listFromTool('cf_zones_list', {
            name: function (r) { return r.name; }, meta: function (r) { return r.id; },
            onClick: function (r) { openZone(r); }
          }));
          setView(n);
        }
        function openZone(z) {
          var n = el('div');
          var cr = el('div', 'crumbs'); var a = el('a', null, t('dns')); a.onclick = renderDns;
          cr.appendChild(a); cr.appendChild(document.createTextNode(' / ' + z.name)); n.appendChild(cr);
          n.appendChild(el('h2', null, z.name));
          var box = el('div', 'cards'); box.appendChild(el('div', 'muted', t('loading'))); n.appendChild(box);
          call('cf_dns_list', { zoneId: z.id }).then(function (r) {
            var rows = rowsOf(r); box.innerHTML = '';
            if (!rows.length) { box.appendChild(el('div', 'empty', t('empty'))); return; }
            rows.forEach(function (d) { var c = el('div', 'card'); var g = el('div', 'grow'); g.appendChild(el('div', 'name', d.type + '  ' + d.name)); g.appendChild(el('div', 'meta', d.content + (d.proxied ? ' · proxied' : ''))); c.appendChild(g); box.appendChild(c); });
          }).catch(function (e) { box.innerHTML = ''; box.appendChild(el('div', 'err', String(e.message || e))); });
          setView(n);
        }

        // ── Deploy ──
        function renderDeploy() {
          var n = head('deploy', 'deploySub', []);
          var bar = el('div', 'toolbar');
          var dep = el('button', 'act', t('deployNow'));
          bar.appendChild(dep); bar.appendChild(mkRefresh(renderDeploy)); n.appendChild(bar);
          var out = el('div', 'stream'); out.style.display = 'none'; n.appendChild(out);
          dep.onclick = function () {
            mcp.ui.confirm({ title: t('deployNow'), message: 'wrangler deploy', confirmText: t('confirmRun'), danger: true }).then(function (okv) {
              if (!okv) return; dep.disabled = true; out.style.display = ''; out.textContent = t('loading');
              call('cf_deploy').then(function (r) { out.textContent = r.content; }).catch(function (e) { out.textContent = String(e.message || e); }).finally(function () { dep.disabled = false; refreshHeader(); });
            });
          };
          n.appendChild(el('h2', null, t('lastDeploys')));
          n.appendChild(listFromTool('cf_deployments', { name: function (r) { return (r.created_on || '?'); }, meta: function (r) { return (r.author_email || '') + ' · ' + (r.id || ''); } }));
          setView(n);
        }

        // ── Logs (stream) ──
        var activeStream = null;
        function renderLogs() {
          var n = head('logs', null, []);
          var bar = el('div', 'toolbar');
          var login = el('button', 'act sec', t('login'));
          var tail = el('button', 'act', t('tail'));
          var stop = el('button', 'act sec', t('stop')); stop.disabled = true;
          bar.appendChild(login); bar.appendChild(tail); bar.appendChild(stop); n.appendChild(bar);
          var out = el('div', 'stream'); out.textContent = '—'; n.appendChild(out);
          function start(label, args, btn) {
            if (activeStream) activeStream();
            out.textContent = label + '…\n'; btn.disabled = true; stop.disabled = false;
            activeStream = mcp.execStream('npx', ['wrangler'].concat(args), {
              onData: function (c) { if (c && c.type === 'data') { out.textContent += c.data; out.scrollTop = out.scrollHeight; } },
              onEnd: function () { out.textContent += '\n[done]\n'; activeStream = null; btn.disabled = false; stop.disabled = true; },
              onError: function (m) { out.textContent += '\n[error] ' + m + '\n'; activeStream = null; btn.disabled = false; stop.disabled = true; }
            });
          }
          login.onclick = function () { start('login', ['login'], login); };
          tail.onclick = function () { start('tail', ['tail', '--format', 'pretty'], tail); };
          stop.onclick = function () { if (activeStream) { activeStream(); activeStream = null; } stop.disabled = true; out.textContent += '\n[stopped]\n'; };
          setView(n);
        }

        // ── Settings (token + account) ──
        function renderSettings() {
          var n = head('settings', null, []);
          n.appendChild(el('label', 'sub', t('tokenLabel')));
          var bar = el('div', 'toolbar');
          var inp = el('input'); inp.type = 'password'; inp.placeholder = t('tokenPh');
          var save = el('button', 'act', t('save'));
          bar.appendChild(inp); bar.appendChild(save); n.appendChild(bar);
          n.appendChild(el('p', 'sub', t('tokenHint')));
          var out = el('div'); n.appendChild(out);
          save.onclick = function () {
            if (!inp.value.trim()) { mcp.ui.toast({ kind: 'error', message: t('tokenPh') }); return; }
            save.disabled = true;
            call('cf_set_token', { token: inp.value.trim() })
              .then(function () { return call('cf_whoami'); })
              .then(function (r) {
                out.innerHTML = ''; var box = el('div', 'cards'); out.appendChild(box);
                rowsOf(r).forEach(function (a) { var c = el('div', 'card'); var g = el('div', 'grow'); g.appendChild(el('div', 'name', a.name || a.id)); g.appendChild(el('div', 'meta', a.id)); c.appendChild(g); box.appendChild(c); });
                refreshHeader();
              })
              .catch(function (e) { out.innerHTML = ''; out.appendChild(el('div', 'err', String(e.message || e))); })
              .finally(function () { save.disabled = false; });
          };
          setView(n);
        }

        // ── Assistant ──
        function renderAssistant() {
          var n = head('assistant', null, []);
          var modelSel = el('select'); modelSel.innerHTML = '<option>…</option>';
          var mbar = el('div', 'toolbar'); mbar.appendChild(modelSel); n.appendChild(mbar);
          var chat = el('div'); chat.id = 'chat'; chat.appendChild(el('div', 'empty', t('aiEmpty'))); n.appendChild(chat);
          var bar = el('div', 'toolbar');
          var ask = el('input'); ask.placeholder = t('askPh');
          var send = el('button', 'act', t('send'));
          var cancel = el('button', 'act sec', t('cancel')); cancel.disabled = true;
          bar.appendChild(ask); bar.appendChild(send); bar.appendChild(cancel); n.appendChild(bar);
          setView(n);

          var history = [], closeChat = null, started = false;
          function bubble(role, txt) { if (!started) { chat.innerHTML = ''; started = true; } var d = el('div', 'b'); var r = el('span', 'role', role + ':'); d.appendChild(r); var s = el('span', null, txt); d.appendChild(s); chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return s; }
          function sys(txt) { if (!started) { chat.innerHTML = ''; started = true; } chat.appendChild(el('div', 'b sys', txt)); chat.scrollTop = chat.scrollHeight; }
          mcp.assistant.listModels().then(function (models) {
            modelSel.innerHTML = '';
            if (!models.length) { modelSel.innerHTML = '<option value="">' + t('configureAI') + '</option>'; return; }
            models.forEach(function (m) { var o = el('option'); o.value = m.providerId + '|' + m.modelId; o.textContent = m.label + (m.isDefault ? ' ★' : ''); if (m.isDefault) o.selected = true; modelSel.appendChild(o); });
          }).catch(function () {});
          function go() {
            var msg = ask.value.trim(); if (!msg || closeChat) return;
            ask.value = ''; bubble('you', msg); var sp = null, txt = ''; var sel = (modelSel.value || '').split('|');
            send.disabled = true; cancel.disabled = false;
            closeChat = mcp.assistant.chat(msg, { providerId: sel[0] || undefined, modelId: sel[1] || undefined, history: history.slice() }, {
              onData: function (c) {
                if (c.type === 'text') { if (!sp) sp = bubble('cf', ''); txt += c.text; sp.textContent = txt; chat.scrollTop = chat.scrollHeight; }
                else if (c.type === 'tool_use') sys('→ ' + c.name);
                else if (c.type === 'tool_result') sys('  ' + (c.isError ? '✗' : '✓'));
                else if (c.type === 'confirm_request') mcp.ui.confirm({ title: c.name, message: JSON.stringify(c.input), confirmText: t('confirmRun'), danger: true }).then(function (okv) { mcp.assistant.confirm(c.callId, okv); });
                else if (c.type === 'error') sys('[error] ' + c.message);
              },
              onEnd: function () { if (txt) history.push({ role: 'user', text: msg }, { role: 'assistant', text: txt }); closeChat = null; send.disabled = false; cancel.disabled = true; },
              onError: function (m) { sys('[error] ' + m); closeChat = null; send.disabled = false; cancel.disabled = true; }
            });
          }
          send.onclick = go; ask.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
          cancel.onclick = function () { if (closeChat) { closeChat(); closeChat = null; send.disabled = false; cancel.disabled = true; } };
        }

        // boot
        buildNav();
        renderOverview();
        refreshHeader();
      })();
    </script>
  </body>
</html>
