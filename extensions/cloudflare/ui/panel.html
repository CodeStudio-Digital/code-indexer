<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: var(--font-sans, system-ui);
        background: var(--background, #fff);
        color: var(--foreground, #111827);
        font-size: 12px;
      }
      /* Elegant thin scrollbars (Chromium/WebKit + Firefox). */
      * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--muted-foreground, #9ca3af) 38%, transparent) transparent; }
      ::-webkit-scrollbar { width: 9px; height: 9px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: color-mix(in srgb, var(--muted-foreground, #9ca3af) 34%, transparent);
        border-radius: 999px; border: 2px solid transparent; background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--muted-foreground, #9ca3af) 60%, transparent); background-clip: padding-box; }
      ::-webkit-scrollbar-corner { background: transparent; }
      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      button:disabled { cursor: default; opacity: .5; }
      .app {
        height: 100%;
        display: grid;
        grid-template-rows: 40px 1fr;
        min-height: 0;
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid var(--border, #e5e7eb);
        background: var(--card, #fff);
        padding: 0 10px;
      }
      .brand { font-weight: 700; font-size: 14px; letter-spacing: 0; }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--muted-foreground, #6b7280);
      }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #9ca3af; }
      .dot.ok { background: #16a34a; }
      .dot.no { background: #dc2626; }
      .top-spacer { flex: 1; }
      .account-select { min-width: 230px; max-width: 360px; }
      .shell {
        min-height: 0;
        display: grid;
        grid-template-columns: 168px minmax(260px, 34%) 1fr;
      }
      /* Solo views (Assistant / Settings / Logs) don't need a list column —
         the detail pane spans the full width for a focused, single-column UI. */
      .shell.solo { grid-template-columns: 168px 1fr; }
      .shell.solo .list-pane { display: none; }
      .shell.solo .detail { grid-column: 2; }
      .rail {
        min-height: 0;
        overflow: auto;
        border-right: 1px solid var(--border, #e5e7eb);
        background: color-mix(in srgb, var(--muted, #f3f4f6) 42%, transparent);
        padding: 8px;
      }
      .rail-group { margin: 10px 0 5px; color: var(--muted-foreground, #6b7280); font-size: 10px; text-transform: uppercase; }
      .nav {
        width: 100%;
        display: grid;
        grid-template-columns: 24px 1fr;
        align-items: center;
        gap: 7px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        text-align: left;
        padding: 7px 8px;
      }
      .nav:hover { background: var(--muted, #f3f4f6); }
      .nav.active { background: var(--accent, #e0ecff); color: var(--accent-foreground, #1d4ed8); font-weight: 700; }
      .nav-k { color: var(--muted-foreground, #6b7280); font-family: var(--font-mono, ui-monospace, monospace); font-size: 11px; }
      .nav.active .nav-k { color: inherit; }
      .list-pane {
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        border-right: 1px solid var(--border, #e5e7eb);
        display: grid;
        grid-template-rows: auto auto 1fr;
      }
      .pane-head { padding: 12px 12px 8px; border-bottom: 1px solid var(--border, #e5e7eb); }
      .pane-title { margin: 0; font-size: 15px; }
      .pane-sub { margin: 3px 0 0; color: var(--muted-foreground, #6b7280); line-height: 1.35; }
      .toolbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--border, #e5e7eb); }
      .toolbar.tight { padding: 6px 0; border: 0; }
      .search { flex: 1; min-width: 120px; }
      input, select, textarea {
        min-height: 28px;
        border: 1px solid var(--border, #d1d5db);
        border-radius: 6px;
        background: var(--card, #fff);
        color: inherit;
        padding: 5px 8px;
      }
      textarea {
        width: 100%;
        min-height: 92px;
        resize: vertical;
        font-family: var(--font-mono, ui-monospace, monospace);
      }
      .btn {
        min-height: 28px;
        border: 1px solid var(--border, #d1d5db);
        border-radius: 6px;
        background: var(--card, #fff);
        color: inherit;
        padding: 5px 9px;
        white-space: nowrap;
      }
      .btn:hover { border-color: color-mix(in srgb, var(--primary, #2563eb) 55%, var(--border, #d1d5db)); }
      .btn.primary { border-color: var(--primary, #2563eb); background: var(--primary, #2563eb); color: var(--primary-foreground, #fff); }
      .btn.danger { border-color: #dc2626; background: #dc2626; color: #fff; }
      .btn.ghost { background: transparent; }
      .btn.sm { min-height: 24px; padding: 3px 7px; font-size: 11px; }
      .rows { min-height: 0; overflow: auto; }
      .item {
        width: 100%;
        border: 0;
        border-bottom: 1px solid var(--border, #edf0f3);
        background: transparent;
        color: inherit;
        text-align: left;
        padding: 9px 12px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
      }
      .item:hover { background: var(--muted, #f3f4f6); }
      .item.active { background: color-mix(in srgb, var(--accent, #e0ecff) 70%, transparent); }
      .item-title { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .item-meta { margin-top: 2px; color: var(--muted-foreground, #6b7280); font-family: var(--font-mono, ui-monospace, monospace); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .chip { color: var(--muted-foreground, #6b7280); border: 1px solid var(--border, #d1d5db); border-radius: 999px; padding: 1px 6px; }
      .detail {
        min-width: 0;
        min-height: 0;
        overflow: auto;
        padding: 14px;
      }
      /* Assistant view runs full-height with its own internal scroll. */
      .detail.chat { overflow: hidden; display: flex; flex-direction: column; }
      .detail.chat > div { display: flex; flex-direction: column; min-height: 0; flex: 1; }
      .detail-head {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .detail-title { margin: 0; font-size: 17px; }
      .detail-sub { margin: 4px 0 0; color: var(--muted-foreground, #6b7280); font-family: var(--font-mono, ui-monospace, monospace); overflow-wrap: anywhere; }
      .actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
      .tabs { display: flex; flex-wrap: wrap; gap: 5px; border-bottom: 1px solid var(--border, #e5e7eb); margin: 4px 0 12px; }
      .tab { border: 0; background: transparent; padding: 7px 8px; color: var(--muted-foreground, #6b7280); border-bottom: 2px solid transparent; }
      .tab.active { color: var(--foreground, #111827); border-color: var(--primary, #2563eb); font-weight: 700; }
      .empty, .error, .notice {
        border: 1px dashed var(--border, #d1d5db);
        border-radius: 6px;
        padding: 14px;
        color: var(--muted-foreground, #6b7280);
      }
      .error { color: #b91c1c; white-space: pre-wrap; }
      .notice { border-style: solid; background: var(--muted, #f8fafc); }
      .kv {
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr);
        gap: 6px 12px;
        margin: 8px 0 12px;
      }
      .kv div:nth-child(odd) { color: var(--muted-foreground, #6b7280); }
      .kv div:nth-child(even) { font-family: var(--font-mono, ui-monospace, monospace); overflow-wrap: anywhere; }
      .table-wrap { overflow: auto; border: 1px solid var(--border, #e5e7eb); border-radius: 6px; max-height: 56vh; }
      table { width: 100%; border-collapse: collapse; font-size: 11px; }
      th, td { border-bottom: 1px solid var(--border, #edf0f3); padding: 6px 7px; text-align: left; vertical-align: top; white-space: nowrap; }
      th { position: sticky; top: 0; background: var(--background, #fff); color: var(--muted-foreground, #6b7280); z-index: 1; }
      td { font-family: var(--font-mono, ui-monospace, monospace); }
      td.actions-cell { font-family: inherit; }
      pre {
        margin: 0;
        padding: 10px;
        border-radius: 6px;
        background: var(--muted, #f3f4f6);
        max-height: 58vh;
        overflow: auto;
        white-space: pre-wrap;
        font-family: var(--font-mono, ui-monospace, monospace);
      }
      .sqlbar { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: start; margin-bottom: 10px; }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(17, 24, 39, .38);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 20;
      }
      .modal {
        width: min(560px, 100%);
        max-height: min(720px, 92vh);
        overflow: auto;
        background: var(--background, #fff);
        border: 1px solid var(--border, #e5e7eb);
        border-radius: 8px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, .20);
      }
      .modal h3 { margin: 0; font-size: 15px; }
      .modal-head, .modal-foot { padding: 12px; border-bottom: 1px solid var(--border, #e5e7eb); }
      .modal-foot { border-top: 1px solid var(--border, #e5e7eb); border-bottom: 0; display: flex; justify-content: flex-end; gap: 6px; }
      .modal-body { padding: 12px; display: grid; gap: 10px; }
      label.field { display: grid; gap: 4px; color: var(--muted-foreground, #6b7280); }
      label.field input, label.field textarea, label.field select { color: var(--foreground, #111827); }
      .stream { min-height: 180px; }
      /* ── Chat (Assistant) ── */
      .chat-wrap { display: grid; grid-template-rows: auto 1fr auto; gap: 10px; min-height: 0; flex: 1; }
      .chat-log { min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px; }
      .chat-empty { margin: auto; max-width: 360px; text-align: center; color: var(--muted-foreground, #6b7280); line-height: 1.5; }
      .msg { display: flex; }
      .msg.user { justify-content: flex-end; }
      .bubble {
        max-width: 84%; padding: 8px 11px; border-radius: 12px; line-height: 1.5;
        white-space: pre-wrap; overflow-wrap: anywhere;
      }
      .msg.user .bubble { background: var(--primary, #2563eb); color: var(--primary-foreground, #fff); border-bottom-right-radius: 4px; }
      .msg.bot .bubble { background: var(--muted, #f3f4f6); color: var(--foreground, #111827); border-bottom-left-radius: 4px; }
      .msg.bot .bubble.streaming::after { content: '▋'; opacity: .5; animation: blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .tools-strip { display: flex; flex-direction: column; gap: 3px; margin: 1px 0; align-self: flex-start; max-width: 84%; }
      .tool-line {
        display: inline-flex; align-items: center; gap: 6px; font-size: 11px;
        color: var(--muted-foreground, #6b7280); background: color-mix(in srgb, var(--muted, #f3f4f6) 60%, transparent);
        border: 1px solid var(--border, #e5e7eb); border-radius: 999px; padding: 2px 9px; width: fit-content;
      }
      .tool-line .tdot { width: 6px; height: 6px; border-radius: 50%; background: #9ca3af; flex-shrink: 0; }
      .tool-line.run .tdot { background: var(--primary, #2563eb); animation: blink 1.1s infinite; }
      .tool-line.ok .tdot { background: #16a34a; }
      .tool-line.fail .tdot { background: #dc2626; }
      .chat-input { display: flex; gap: 7px; align-items: flex-end; }
      .chat-input textarea { min-height: 38px; max-height: 120px; resize: none; font-family: inherit; }
      .chat-bar { display: flex; gap: 7px; align-items: center; margin-bottom: 2px; }
      .chat-bar select { max-width: 280px; }
      @media (max-width: 900px) {
        .shell { grid-template-columns: 132px 1fr; }
        .detail { grid-column: 2; }
        .list-pane { display: none; }
        .account-select { min-width: 140px; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <div class="brand">Cloudflare</div>
        <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">Checking project</span></div>
        <div class="top-spacer"></div>
        <select id="accountSelect" class="account-select"><option>Set token in Settings</option></select>
        <button id="refreshAccounts" class="btn sm">Refresh</button>
      </div>
      <div class="shell">
        <nav id="rail" class="rail"></nav>
        <section class="list-pane">
          <div class="pane-head">
            <h2 id="listTitle" class="pane-title"></h2>
            <p id="listSub" class="pane-sub"></p>
          </div>
          <div id="listToolbar" class="toolbar"></div>
          <div id="listRows" class="rows"></div>
        </section>
        <main id="detail" class="detail"></main>
      </div>
    </div>
    <div id="modalRoot"></div>

    <script>
      (function () {
        if (!window.mcp || !window.mcp.invokeTool) {
          document.body.innerHTML = '<div class="empty">Plugin bridge unavailable. Restart the IDE and reopen this panel.</div>';
          return;
        }

        var mcp = window.mcp;
        // i18n — the plugin ships its own catalogs; host injects the locale.
        var t = (mcp.i18n && mcp.i18n.translator) ? mcp.i18n.translator({
          en: {
            'assistant.title': 'Cloudflare assistant', 'assistant.sub': 'Scoped to this plugin’s tools — off-topic requests are refused.',
            'assistant.empty': 'Ask about your Cloudflare resources — e.g. “list my D1 databases and deploy”. Mutating actions ask for confirmation.',
            'assistant.placeholder': 'Message the Cloudflare assistant…', 'assistant.send': 'Send',
            'assistant.loadingModels': 'Loading models…', 'assistant.noModels': 'Configure an AI provider first',
            'assistant.running': 'Running {name}…', 'assistant.toolDone': '{name}', 'assistant.toolFailed': '{name} failed',
            'settings.title': 'Settings', 'settings.sub': 'Your API token is stored only in this plugin’s storage.',
            'settings.notice': 'Use a Cloudflare API token with permissions for the resources you want to manage.',
            'settings.tokenPh': 'Cloudflare API token', 'settings.save': 'Save and connect', 'settings.tokenRequired': 'Token required', 'settings.connected': 'Connected.',
            'logs.title': 'Wrangler logs', 'logs.sub': 'Live streams via the plugin exec bridge (uses your wrangler login).',
            'logs.login': 'Login', 'logs.tail': 'Tail', 'logs.stop': 'Stop', 'logs.ready': 'Ready.', 'logs.stopped': '[stopped]'
          },
          'pt-BR': {
            'assistant.title': 'Assistente Cloudflare', 'assistant.sub': 'Focado nas ferramentas deste plugin — pedidos fora do escopo são recusados.',
            'assistant.empty': 'Pergunte sobre seus recursos Cloudflare — ex.: “liste meus bancos D1 e faça deploy”. Ações que alteram pedem confirmação.',
            'assistant.placeholder': 'Escreva pro assistente Cloudflare…', 'assistant.send': 'Enviar',
            'assistant.loadingModels': 'Carregando modelos…', 'assistant.noModels': 'Configure um provedor de IA primeiro',
            'assistant.running': 'Executando {name}…', 'assistant.toolDone': '{name}', 'assistant.toolFailed': 'Falhou: {name}',
            'settings.title': 'Configuração', 'settings.sub': 'Seu token de API é guardado só no armazenamento deste plugin.',
            'settings.notice': 'Use um token de API da Cloudflare com permissões para os recursos que você quer gerenciar.',
            'settings.tokenPh': 'Token de API da Cloudflare', 'settings.save': 'Salvar e conectar', 'settings.tokenRequired': 'Token obrigatório', 'settings.connected': 'Conectado.',
            'logs.title': 'Logs do Wrangler', 'logs.sub': 'Streams ao vivo pela ponte de exec do plugin (usa seu wrangler login).',
            'logs.login': 'Entrar', 'logs.tail': 'Tail', 'logs.stop': 'Parar', 'logs.ready': 'Pronto.', 'logs.stopped': '[parado]'
          }
        }) : function (k) { return k; };
        var rail = document.getElementById('rail');
        var listTitle = document.getElementById('listTitle');
        var listSub = document.getElementById('listSub');
        var listToolbar = document.getElementById('listToolbar');
        var listRows = document.getElementById('listRows');
        var detail = document.getElementById('detail');
        var modalRoot = document.getElementById('modalRoot');
        var accountSelect = document.getElementById('accountSelect');

        var state = {
          resource: 'd1',
          selectedKey: null,
          rows: {},
          filter: '',
          activeStream: null
        };

        var resources = [
          { group: 'Data', id: 'd1', k: 'D1', title: 'D1', sub: 'Databases, tables, rows and SQL', listTool: 'cf_d1_list', key: function (r) { return r.uuid || r.name; }, name: function (r) { return r.name; }, meta: function (r) { return r.uuid; }, create: createD1, detail: detailD1 },
          { group: 'Data', id: 'kv', k: 'KV', title: 'KV', sub: 'Namespaces and keys', listTool: 'cf_kv_list', key: function (r) { return r.id; }, name: function (r) { return r.title; }, meta: function (r) { return r.id; }, create: createKV, detail: detailKV },
          { group: 'Data', id: 'r2', k: 'R2', title: 'R2', sub: 'Buckets and text objects', listTool: 'cf_r2_list', key: function (r) { return r.name; }, name: function (r) { return r.name; }, meta: function (r) { return r.creation_date || ''; }, create: createR2, detail: detailR2 },
          { group: 'Compute', id: 'queues', k: 'QU', title: 'Queues', sub: 'Messages, leases, metrics and consumers', listTool: 'cf_queues_list', key: function (r) { return r.queue_id || r.name; }, name: function (r) { return r.queue_name || r.name || r.queue_id; }, meta: function (r) { return r.queue_id || ''; }, create: createQueue, detail: detailQueue },
          { group: 'Compute', id: 'do', k: 'DO', title: 'Durable Objects', sub: 'Namespaces and object IDs exposed by REST', listTool: 'cf_do_namespaces', key: function (r) { return r.id; }, name: function (r) { return r.name; }, meta: function (r) { return (r.class || '') + ' ' + r.id; }, detail: detailDO },
          { group: 'Compute', id: 'workers', k: 'WK', title: 'Workers', sub: 'Scripts, deployments, secrets and cron', listTool: 'cf_workers_list', key: function (r) { return r.id || r.name || r.script_name; }, name: function (r) { return r.id || r.name || r.script_name; }, meta: function (r) { return r.modified_on || r.created_on || ''; }, detail: detailWorker },
          { group: 'Compute', id: 'pages', k: 'PG', title: 'Pages', sub: 'Projects and deployments', listTool: 'cf_pages_list', key: function (r) { return r.name; }, name: function (r) { return r.name; }, meta: function (r) { return r.subdomain || ''; }, detail: detailPages },
          { group: 'Network', id: 'dns', k: 'DN', title: 'DNS', sub: 'Zones and records', listTool: 'cf_zones_list', key: function (r) { return r.id; }, name: function (r) { return r.name; }, meta: function (r) { return r.status ? r.id + ' / ' + r.status : r.id; }, detail: detailDNS },
          { group: 'AI', id: 'vectorize', k: 'VX', title: 'Vectorize', sub: 'Indexes, vectors and metadata indexes', listTool: 'cf_vectorize_list', key: function (r) { return r.name; }, name: function (r) { return r.name; }, meta: function (r) { return r.config ? 'dim ' + r.config.dimensions + ' / ' + r.config.metric : ''; }, create: createVectorize, detail: detailVectorize },
          { group: 'AI', id: 'more', k: 'AI', title: 'AI and Hyperdrive', sub: 'Models, Hyperdrive and cache purge', customList: renderMoreList, detail: detailMore },
          { group: 'Tools', id: 'logs', k: 'LG', title: 'Logs', sub: 'Wrangler login and live tail', solo: true, detail: detailLogs },
          { group: 'Tools', id: 'assistant', k: 'AS', title: 'Assistant', sub: 'Cloudflare-scoped tool assistant', solo: true, detail: detailAssistant },
          { group: 'Tools', id: 'settings', k: 'ST', title: 'Settings', sub: 'Token and account', solo: true, detail: detailSettings }
        ];

        function resource(id) { return resources.filter(function (r) { return r.id === id; })[0]; }
        function rowsOf(result) { return result && result.data && result.data.rows || []; }
        function detailsOf(result) { return result && result.data && (result.data.details || result.data) || {}; }
        function call(tool, args) {
          return mcp.invokeTool(tool, args || {}).then(function (r) {
            if (r.isError) throw new Error(r.content || 'Cloudflare tool failed');
            return r;
          });
        }
        function el(tag, cls, text) {
          var node = document.createElement(tag);
          if (cls) node.className = cls;
          if (text != null) node.textContent = text;
          return node;
        }
        function button(label, cls, fn) {
          var b = el('button', 'btn ' + (cls || ''), label);
          b.onclick = fn;
          return b;
        }
        function toast(kind, message) { mcp.ui.toast({ kind: kind || 'info', message: message }); }
        function clear(node) { node.innerHTML = ''; }
        function setDetail(node) { clear(detail); detail.appendChild(node); }
        function errorBox(message) { return el('div', 'error', String(message)); }
        function emptyBox(message) { return el('div', 'empty', message || 'Nothing selected.'); }
        function jsonPre(value) { return el('pre', null, typeof value === 'string' ? value : JSON.stringify(value || {}, null, 2)); }
        function valueText(v) {
          if (v == null) return '';
          return typeof v === 'object' ? JSON.stringify(v) : String(v);
        }
        function matchRow(row, r) {
          if (!state.filter) return true;
          var needle = state.filter.toLowerCase();
          return (r.name(row) + ' ' + r.meta(row)).toLowerCase().indexOf(needle) >= 0;
        }
        function selectedRow(r) {
          var rows = state.rows[r.id] || [];
          if (!rows.length) return null;
          return rows.filter(function (row) { return r.key(row) === state.selectedKey; })[0] || rows[0];
        }

        function renderRail() {
          clear(rail);
          var group = '';
          resources.forEach(function (r) {
            if (r.group !== group) {
              group = r.group;
              rail.appendChild(el('div', 'rail-group', group));
            }
            var b = el('button', 'nav' + (state.resource === r.id ? ' active' : ''));
            b.appendChild(el('span', 'nav-k', r.k));
            b.appendChild(el('span', null, r.title));
            b.onclick = function () {
              state.resource = r.id;
              state.selectedKey = null;
              state.filter = '';
              render();
            };
            rail.appendChild(b);
          });
        }

        function render() {
          renderRail();
          var r = resource(state.resource);
          // Solo views (assistant/settings/logs) collapse the middle list column
          // so the detail pane owns the full width — no empty second column.
          document.querySelector('.shell').classList.toggle('solo', !!r.solo);
          // The assistant runs as a full-height chat with its own internal scroll.
          detail.classList.toggle('chat', r.id === 'assistant');
          if (r.solo) { r.detail(); return; }

          listTitle.textContent = r.title;
          listSub.textContent = r.sub;
          clear(listToolbar);
          clear(listRows);

          if (r.customList) {
            r.customList(r);
            r.detail();
            return;
          }

          var search = el('input', 'search');
          search.placeholder = 'Filter ' + r.title;
          search.value = state.filter;
          search.oninput = function () { state.filter = search.value; renderList(r); };
          listToolbar.appendChild(search);
          listToolbar.appendChild(button('Reload', 'sm', function () { loadList(r, true); }));
          if (r.create) listToolbar.appendChild(button('Create', 'primary sm', function () { r.create(); }));
          renderListLoading();
          loadList(r, false);
        }

        function renderListLoading() {
          clear(listRows);
          listRows.appendChild(emptyBox('Loading...'));

        function loadList(r, force) {
          if (!force && state.rows[r.id]) {
            renderList(r);
            return;
          }
          call(r.listTool, {}).then(function (result) {
            state.rows[r.id] = rowsOf(result);
            if (!state.selectedKey && state.rows[r.id][0]) state.selectedKey = r.key(state.rows[r.id][0]);
            renderList(r);
          }).catch(function (e) {
            clear(listRows);
            listRows.appendChild(errorBox(e.message || e));
            setDetail(errorBox(e.message || e));
          });
        }

        function renderList(r) {
          clear(listRows);
          var rows = (state.rows[r.id] || []).filter(function (row) { return matchRow(row, r); });
          if (!rows.length) {
            listRows.appendChild(emptyBox('No matching resources.'));
            setDetail(emptyBox('Create or refresh resources from the list toolbar.'));
            return;
          }
          rows.forEach(function (row) {
            var key = r.key(row);
            var item = el('button', 'item' + (key === state.selectedKey ? ' active' : ''));
            var left = el('div');
            left.appendChild(el('div', 'item-title', r.name(row)));
            left.appendChild(el('div', 'item-meta', r.meta(row)));
            item.appendChild(left);
            item.appendChild(el('span', 'chip', r.k));
            item.onclick = function () {
              state.selectedKey = key;
              renderList(r);
            };
            listRows.appendChild(item);
          });
          var row = selectedRow(r);
          if (row) r.detail(row);
        }

        function detailShell(title, sub, actions) {
          var wrap = el('div');
          var head = el('div', 'detail-head');
          var left = el('div');
          left.appendChild(el('h2', 'detail-title', title || 'Untitled'));
          if (sub) left.appendChild(el('div', 'detail-sub', sub));
          head.appendChild(left);
          var act = el('div', 'actions');
          (actions || []).forEach(function (a) { act.appendChild(a); });
          head.appendChild(act);
          wrap.appendChild(head);
          return wrap;
        }

        function table(parent, rows, actions) {
          clear(parent);
          if (!rows || !rows.length) {
            parent.appendChild(emptyBox('No rows.'));
            return;
          }
          var cols = [];
          rows.forEach(function (row) {
            Object.keys(row || {}).forEach(function (k) { if (cols.indexOf(k) < 0) cols.push(k); });
          });
          var wrap = el('div', 'table-wrap');
          var t = el('table');
          var h = el('tr');
          cols.forEach(function (c) { h.appendChild(el('th', null, c)); });
          if (actions) h.appendChild(el('th', null, 'Actions'));
          t.appendChild(h);
          rows.forEach(function (row) {
            var tr = el('tr');
            cols.forEach(function (c) { tr.appendChild(el('td', null, valueText(row[c]))); });
            if (actions) {
              var td = el('td', 'actions-cell');
              actions(row).forEach(function (b) { td.appendChild(b); });
              tr.appendChild(td);
            }
            t.appendChild(tr);
          });
          wrap.appendChild(t);
          parent.appendChild(wrap);
        }

        function fieldsModal(title, fields, danger) {
          return new Promise(function (resolve) {
            var backdrop = el('div', 'modal-backdrop');
            var modal = el('div', 'modal');
            var head = el('div', 'modal-head');
            head.appendChild(el('h3', null, title));
            var body = el('form', 'modal-body');
            var inputs = {};
            fields.forEach(function (f) {
              var label = el('label', 'field');
              label.appendChild(el('span', null, f.label));
              var input = f.type === 'textarea' ? el('textarea') : f.type === 'select' ? el('select') : el('input');
              if (f.type && f.type !== 'textarea' && f.type !== 'select') input.type = f.type;
              if (f.placeholder) input.placeholder = f.placeholder;
              if (f.value != null) input.value = f.value;
              if (f.options) f.options.forEach(function (opt) {
                var o = el('option');
                o.value = opt.value;
                o.textContent = opt.label;
                input.appendChild(o);
              });
              label.appendChild(input);
              inputs[f.name] = input;
              body.appendChild(label);
            });
            var foot = el('div', 'modal-foot');
            foot.appendChild(button('Cancel', '', function () { modalRoot.innerHTML = ''; resolve(null); }));
            foot.appendChild(button(danger ? 'Run' : 'Save', danger ? 'danger' : 'primary', function () {
              var out = {};
              fields.forEach(function (f) { out[f.name] = inputs[f.name].value; });
              modalRoot.innerHTML = '';
              resolve(out);
            }));
            body.onsubmit = function (e) { e.preventDefault(); foot.lastChild.click(); };
            modal.appendChild(head);
            modal.appendChild(body);
            modal.appendChild(foot);
            backdrop.appendChild(modal);
            modalRoot.appendChild(backdrop);
            var first = body.querySelector('input, textarea, select');
            if (first) first.focus();
          });
        }

        function confirmModal(title, body) {
          return fieldsModal(title, [{ name: 'confirm', label: body || title, value: 'yes' }], true)
            .then(function (v) { return !!v; });
        }

        function parseJsonInput(text, fallback) {
          if (!text || !text.trim()) return fallback;
          return JSON.parse(text);
        }

        function mutate(tool, args, reload, dangerTitle) {
          var run = function () {
            return call(tool, args).then(function (r) {
              toast('success', r.content || 'OK');
              if (reload) reload();
              return r;
            }).catch(function (e) { toast('error', String(e.message || e)); });
          };
          if (!dangerTitle) return run();
          return confirmModal(dangerTitle, JSON.stringify(args || {}, null, 2)).then(function (ok) {
            if (ok) return run();
            return null;
          });
        }

                ];

          function drawRows(tableName) {
            var offset = 0;

            head.appendChild(button('Back to tables', 'sm', drawTables));

              fieldsModal('Insert row into ' + tableName, [{ name: 'data', label: 'Row JSON object', type: 'textarea', value: '{}' }]).then(function (v) {

              });
            }));
            head.appendChild(button('Prev', 'sm', function () { offset = Math.max(0, offset - 50); load(); }));
            head.appendChild(button('Next', 'sm', function () { offset += 50; load(); }));
            clear(body);
            body.appendChild(head);
            var grid = el('div');
            body.appendChild(grid);
            function load() {
              grid.innerHTML = '';

                      });

                  ];

            }

          function drawSql() {
            var sql = el('textarea');

            bar.appendChild(button('Run write', 'danger', function () { mutate('cf_d1_execute', { database: db.name, sql: sql.value }, null, 'Run mutating SQL').then(function () { run('cf_d1_query'); }); }));
            body.appendChild(bar);
            var result = el('div');

            }

          var wrap = detailShell(p.name, p.subdomain || '', [
            button('Delete project', 'danger sm', function () { mutate('cf_pages_delete', { project: p.name }, function () { state.rows.pages = null; state.selectedKey = null; render(); }, 'Delete Pages project'); })
          ]);
          var grid = el('div');
          wrap.appendChild(grid);
          setDetail(wrap);
          grid.appendChild(emptyBox('Loading deployments...'));
          call('cf_pages_deployments', { project: p.name }).then(function (r) {
            table(grid, rowsOf(r), function (row) {
              return [
                button('Retry', 'sm', function () { mutate('cf_pages_deployment_retry', { project: p.name, deploymentId: row.id }); }),
                button('Rollback', 'danger sm', function () { mutate('cf_pages_deployment_rollback', { project: p.name, deploymentId: row.id }, null, 'Rollback Pages deployment'); }),
                button('Delete', 'danger sm', function () { mutate('cf_pages_deployment_delete', { project: p.name, deploymentId: row.id }, null, 'Delete Pages deployment'); })
              ];
            });
          }).catch(function (e) { grid.innerHTML = ''; grid.appendChild(errorBox(e.message || e)); });
        }

        function detailDNS(zone) {
          var wrap = detailShell(zone.name, zone.id, [
            button('Add record', 'primary sm', addRecord),
            button('Export', 'sm', function () { call('cf_dns_export', { zoneId: zone.id }).then(function (r) { grid.innerHTML = ''; grid.appendChild(jsonPre(r.content)); }); }),
            button('Scan', 'sm', function () { mutate('cf_dns_scan_trigger', { zoneId: zone.id }); })
          ]);
          var tools = el('div', 'toolbar tight');
          var search = el('input'); search.placeholder = 'Record search'; search.style.flex = '1';
          tools.appendChild(search);
          tools.appendChild(button('Load records', 'sm', load));
          wrap.appendChild(tools);
          var grid = el('div');
          wrap.appendChild(grid);
          setDetail(wrap);
          function addRecord() {
            fieldsModal('Create DNS record', [
              { name: 'type', label: 'Type', value: 'A' },
              { name: 'name', label: 'Name' },
              { name: 'content', label: 'Content' },
              { name: 'ttl', label: 'TTL (optional)', type: 'number' }
            ]).then(function (v) {
              if (!v) return;
              mutate('cf_dns_create', { zoneId: zone.id, type: v.type, name: v.name, content: v.content, ttl: v.ttl ? Number(v.ttl) : undefined }, load);
            });
          }
          function load() {
            grid.innerHTML = '';
            grid.appendChild(emptyBox('Loading records...'));
            call('cf_dns_list', { zoneId: zone.id, search: search.value || undefined }).then(function (r) {
              table(grid, rowsOf(r), function (row) {
                return [
                  button('Edit', 'sm', function () {
                    fieldsModal('Patch DNS record', [{ name: 'body', label: 'Patch JSON', type: 'textarea', value: JSON.stringify({ content: row.content }, null, 2) }]).then(function (v) {
                      if (v) mutate('cf_dns_update', { zoneId: zone.id, recordId: row.id, body: parseJsonInput(v.body, {}) }, load);
                    });
                  }),
                  button('Delete', 'danger sm', function () { mutate('cf_dns_delete', { zoneId: zone.id, recordId: row.id }, load, 'Delete DNS record'); })
                ];
              });
            }).catch(function (e) { grid.innerHTML = ''; grid.appendChild(errorBox(e.message || e)); });
          }
          load();
        }

        function createVectorize() {
          fieldsModal('Create Vectorize index', [
            { name: 'name', label: 'Name' },
            { name: 'dimensions', label: 'Dimensions', type: 'number', value: '768' },
            { name: 'metric', label: 'Metric', type: 'select', options: [
              { value: 'cosine', label: 'cosine' },
              { value: 'euclidean', label: 'euclidean' },
              { value: 'dot-product', label: 'dot-product' }
            ] }
          ]).then(function (v) {
            if (v) mutate('cf_vectorize_create', { name: v.name, dimensions: Number(v.dimensions), metric: v.metric }, function () { state.rows.vectorize = null; render(); });
          });
        }

        function detailVectorize(ix) {
          var wrap = detailShell(ix.name, ix.config ? 'dim ' + ix.config.dimensions + ' / ' + ix.config.metric : '', [
            button('Info', 'sm', function () { show('cf_vectorize_info', { name: ix.name }); }),
            button('List vectors', 'sm', function () { listVectors(); }),
            button('Query', 'primary sm', query),
            button('Delete index', 'danger sm', function () { mutate('cf_vectorize_delete', { name: ix.name }, function () { state.rows.vectorize = null; state.selectedKey = null; render(); }, 'Delete Vectorize index'); })
          ]);
          var grid = el('div');
          wrap.appendChild(grid);
          setDetail(wrap);
          function show(tool, args) {
            grid.innerHTML = '';
            grid.appendChild(emptyBox('Loading...'));
            call(tool, args).then(function (r) { grid.innerHTML = ''; grid.appendChild(jsonPre(detailsOf(r))); }).catch(function (e) { grid.innerHTML = ''; grid.appendChild(errorBox(e.message || e)); });
          }
          function listVectors() {
            grid.innerHTML = '';
            grid.appendChild(emptyBox('Loading vectors...'));
            call('cf_vectorize_vectors_list', { name: ix.name, limit: 50 }).then(function (r) { table(grid, rowsOf(r)); }).catch(function (e) { grid.innerHTML = ''; grid.appendChild(errorBox(e.message || e)); });
          }
          function query() {
            fieldsModal('Vectorize query', [{ name: 'body', label: 'Query JSON body', type: 'textarea', value: '{\n  \"topK\": 5,\n  \"vector\": []\n}' }]).then(function (v) {
              if (v) show('cf_vectorize_query', { name: ix.name, body: parseJsonInput(v.body, {}) });
            });
          }
          show('cf_vectorize_info', { name: ix.name });
        }

        function renderMoreList() {
          listToolbar.appendChild(button('AI models', 'primary sm', function () { state.selectedKey = 'ai'; detailMore(); }));
          listToolbar.appendChild(button('Hyperdrive', 'sm', function () { state.selectedKey = 'hyperdrive'; detailMore(); }));
          listToolbar.appendChild(button('Cache purge', 'danger sm', function () { state.selectedKey = 'cache'; detailMore(); }));
          listRows.appendChild(emptyBox('Choose AI models, Hyperdrive, or cache purge above.'));
        }

        function detailMore() {
          var mode = state.selectedKey || 'ai';
          var wrap = detailShell(mode === 'ai' ? 'Workers AI models' : mode === 'hyperdrive' ? 'Hyperdrive' : 'Cache purge', '', []);
          var body = el('div');
          wrap.appendChild(body);
          setDetail(wrap);
          if (mode === 'ai') {
            body.appendChild(emptyBox('Loading models...'));
            call('cf_ai_models', {}).then(function (r) { table(body, rowsOf(r)); }).catch(function (e) { body.innerHTML = ''; body.appendChild(errorBox(e.message || e)); });
          } else if (mode === 'hyperdrive') {
            var bar = el('div', 'toolbar tight');
            bar.appendChild(button('Create from JSON', 'primary sm', function () {
              fieldsModal('Create Hyperdrive config', [{ name: 'body', label: 'Config JSON', type: 'textarea', value: '{}' }]).then(function (v) {
                if (v) mutate('cf_hyperdrive_create', { body: parseJsonInput(v.body, {}) }, function () { state.selectedKey = 'hyperdrive'; detailMore(); });
              });
            }));
            body.appendChild(bar);
            var grid = el('div');
            body.appendChild(grid);
            call('cf_hyperdrive_list', {}).then(function (r) {
              table(grid, rowsOf(r), function (row) {
                return [button('Delete', 'danger sm', function () { mutate('cf_hyperdrive_delete', { configId: row.id }, function () { state.selectedKey = 'hyperdrive'; detailMore(); }, 'Delete Hyperdrive config'); })];
              });
            }).catch(function (e) { grid.appendChild(errorBox(e.message || e)); });
          } else {
            body.appendChild(el('div', 'notice', 'Leave URLs empty to purge the whole zone. Use URL array for a targeted purge.'));
            body.appendChild(button('Purge zone cache', 'danger', function () {
              fieldsModal('Purge cache', [
                { name: 'zoneId', label: 'Zone ID' },
                { name: 'urls', label: 'URLs JSON array (optional)', type: 'textarea', value: '' }
              ], true).then(function (v) {
                if (!v) return;
                mutate('cf_cache_purge', { zoneId: v.zoneId, urls: parseJsonInput(v.urls, undefined) }, null, 'Purge cache');
              });
            }));
          }
        }

        function detailLogs() {
          var wrap = detailShell(t('logs.title'), t('logs.sub'), [
            button(t('logs.login'), 'sm', function () { start('login', ['login']); }),
            button(t('logs.tail'), 'primary sm', function () { start('tail', ['tail', '--format', 'pretty']); }),
            button(t('logs.stop'), 'danger sm', function () { if (state.activeStream) { state.activeStream(); state.activeStream = null; out.textContent += '\n' + t('logs.stopped') + '\n'; } })
          ]);
          var out = el('pre', 'stream', t('logs.ready'));
          wrap.appendChild(out);
          setDetail(wrap);
          function start(label, args) {
            if (state.activeStream) state.activeStream();
            out.textContent = label + '...\n';
            state.activeStream = mcp.execStream('npx', ['wrangler'].concat(args), {
              onData: function (c) { if (c && c.type === 'data') { out.textContent += c.data; out.scrollTop = out.scrollHeight; } },
              onEnd: function () { out.textContent += '\n[done]\n'; state.activeStream = null; },
              onError: function (m) { out.textContent += '\n[error] ' + m + '\n'; state.activeStream = null; }
            });
          }
        }

        function detailAssistant() {
          var wrap = detailShell(t('assistant.title'), t('assistant.sub'), []);
          var chatWrap = el('div', 'chat-wrap');

          // model bar
          var modelBar = el('div', 'chat-bar');
          var modelSel = el('select');
          modelSel.innerHTML = '<option value="">' + t('assistant.loadingModels') + '</option>';
          modelBar.appendChild(modelSel);
          chatWrap.appendChild(modelBar);

          // chat log
          var log = el('div', 'chat-log');
          var empty = el('div', 'chat-empty', t('assistant.empty'));
          log.appendChild(empty);
          chatWrap.appendChild(log);

          // input
          var inputRow = el('div', 'chat-input');
          var ask = el('textarea');
          ask.placeholder = t('assistant.placeholder');
          ask.rows = 1;
          var send = button(t('assistant.send'), 'primary', go);
          inputRow.appendChild(ask);
          inputRow.appendChild(send);
          chatWrap.appendChild(inputRow);

          wrap.appendChild(chatWrap);
          setDetail(wrap);

          var closeChat = null, history = [], started = false, toolStrip = null;
          function ensureStarted() { if (!started) { log.innerHTML = ''; started = true; } }
          function userBubble(text) {
            ensureStarted(); toolStrip = null;
            var m = el('div', 'msg user'); m.appendChild(el('div', 'bubble', text));
            log.appendChild(m); log.scrollTop = log.scrollHeight;
          }
          function botBubble() {
            ensureStarted(); toolStrip = null;
            var m = el('div', 'msg bot'); var b = el('div', 'bubble streaming');
            m.appendChild(b); log.appendChild(m); log.scrollTop = log.scrollHeight;
            return b;
          }
          function toolLine(name) {
            ensureStarted();
            if (!toolStrip) { toolStrip = el('div', 'tools-strip'); log.appendChild(toolStrip); }
            var line = el('div', 'tool-line run');
            line.appendChild(el('span', 'tdot'));
            line.appendChild(el('span', null, t('assistant.running', { name: name })));
            toolStrip.appendChild(line); log.scrollTop = log.scrollHeight;
            return line;
          }

          mcp.assistant.listModels().then(function (models) {
            modelSel.innerHTML = '';
            if (!models.length) { modelSel.innerHTML = '<option value="">' + t('assistant.noModels') + '</option>'; return; }
            models.forEach(function (m) {
              var o = el('option'); o.value = m.providerId + '|' + m.modelId;
              o.textContent = m.label + (m.isDefault ? ' *' : ''); if (m.isDefault) o.selected = true;
              modelSel.appendChild(o);
            });
          });

          function go() {
            var msg = ask.value.trim();
            if (!msg || closeChat) return;
            ask.value = ''; ask.style.height = 'auto';
            userBubble(msg);
            var sel = (modelSel.value || '').split('|');
            var text = '', bubble = null, pendingTools = {};
            send.disabled = true;
            closeChat = mcp.assistant.chat(msg, { providerId: sel[0] || undefined, modelId: sel[1] || undefined, history: history.slice() }, {
              onData: function (c) {
                if (c.type === 'text') { if (!bubble) bubble = botBubble(); text += c.text; bubble.textContent = text; log.scrollTop = log.scrollHeight; }
                else if (c.type === 'tool_use') { pendingTools[c.callId || c.name] = toolLine(c.name); bubble = null; }
                else if (c.type === 'tool_result') {
                  var ln = pendingTools[c.callId || c.name];
                  if (ln) { ln.className = 'tool-line ' + (c.isError ? 'fail' : 'ok'); ln.lastChild.textContent = t(c.isError ? 'assistant.toolFailed' : 'assistant.toolDone', { name: c.name }); }
                }
                else if (c.type === 'confirm_request') confirmModal(c.name, JSON.stringify(c.input, null, 2)).then(function (okv) { mcp.assistant.confirm(c.callId, okv); });
                else if (c.type === 'error') { if (bubble) bubble.classList.remove('streaming'); botBubble().textContent = '⚠ ' + c.message; }
              },
              onEnd: function () { if (bubble) bubble.classList.remove('streaming'); if (text) history.push({ role: 'user', text: msg }, { role: 'assistant', text: text }); closeChat = null; send.disabled = false; ask.focus(); },
              onError: function (m) { botBubble().textContent = '⚠ ' + m; closeChat = null; send.disabled = false; }
            });
          }
          // Enter sends, Shift+Enter newlines; textarea auto-grows.
          ask.addEventListener('input', function () { ask.style.height = 'auto'; ask.style.height = Math.min(ask.scrollHeight, 120) + 'px'; });
          ask.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); } });
          ask.focus();
        }

        function detailSettings() {
          var wrap = detailShell(t('settings.title'), t('settings.sub'), []);
          var body = el('div');
          body.style.maxWidth = '520px';
          body.appendChild(el('div', 'notice', t('settings.notice')));
          var bar = el('div', 'toolbar tight');
          var input = el('input');
          input.type = 'password';
          input.placeholder = t('settings.tokenPh');
          input.style.flex = '1';
          bar.appendChild(input);
          bar.appendChild(button(t('settings.save'), 'primary', function () {
            if (!input.value.trim()) return toast('error', t('settings.tokenRequired'));
            mutate('cf_set_token', { token: input.value.trim() }, function () { toast('success', t('settings.connected')); refreshHeader(); });
          }));
          body.appendChild(bar);
          wrap.appendChild(body);
          setDetail(wrap);
        }

        function refreshHeader() {
          call('cf_detect').then(function (r) {
            var ok = !/Not a Cloudflare/.test(r.content);
            document.getElementById('statusDot').className = 'dot ' + (ok ? 'ok' : 'no');
            document.getElementById('statusText').textContent = ok ? 'Project detected' : 'Not a Cloudflare project';
          }).catch(function () {
            document.getElementById('statusDot').className = 'dot no';
            document.getElementById('statusText').textContent = 'Detection failed';
          });
          call('cf_whoami').then(function (r) {
            accountSelect.innerHTML = '';
            rowsOf(r).forEach(function (a) {
              var o = el('option');
              o.value = a.id;
              o.textContent = (a.selected ? '* ' : '') + (a.name || a.id);
              if (a.selected) o.selected = true;
              accountSelect.appendChild(o);
            });
          }).catch(function () {
            accountSelect.innerHTML = '<option value="">Set token in Settings</option>';
          });
        }

        accountSelect.onchange = function () {
          if (accountSelect.value) mutate('cf_set_account', { accountId: accountSelect.value }, function () {
            state.rows = {};
            refreshHeader();
            render();
          });
        };
        document.getElementById('refreshAccounts').onclick = refreshHeader;

        render();
        refreshHeader();
      })();
    </script>
  </body>
</html>
