<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: var(--font-sans, system-ui);
        background: var(--background, #fff); color: var(--foreground, #111);
        font-size: 13px; display: flex; flex-direction: column;
      }
      /* ── header ── */
      header {
        display: flex; align-items: center; gap: 8px;
        padding: 8px 12px; border-bottom: 1px solid var(--border, #e5e7eb);
        flex-shrink: 0;
      }
      header .title { font-weight: 600; }
      .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--muted, #eee); color: var(--muted-foreground, #666); }
      .badge.ok { background: #16a34a22; color: #16a34a; }
      .badge.no { background: #dc262622; color: #dc2626; }
      header .detail { margin-left: auto; font-size: 11px; color: var(--muted-foreground, #888); max-width: 50%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      /* ── tab bar ── */
      nav { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--border, #e5e7eb); flex-shrink: 0; }
      nav button {
        padding: 6px 12px; border: 0; background: transparent; cursor: pointer;
        color: var(--muted-foreground, #777); font: inherit; border-bottom: 2px solid transparent; margin-bottom: -1px;
      }
      nav button.active { color: var(--foreground, #111); border-bottom-color: var(--primary, #2563eb); font-weight: 500; }
      /* ── panes ── */
      main { flex: 1; min-height: 0; overflow: auto; padding: 14px; }
      .pane { display: none; }
      .pane.active { display: block; }
      label { display: block; font-size: 12px; color: var(--muted-foreground, #777); margin-bottom: 4px; }
      .row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
      input, select {
        flex: 1; min-width: 120px; padding: 7px 9px; font: inherit;
        border: 1px solid var(--border, #ccc); border-radius: var(--radius, 6px);
        background: var(--card, #fff); color: inherit;
      }
      button.act {
        padding: 7px 14px; font: inherit; cursor: pointer; border: 0;
        border-radius: var(--radius, 6px);
        background: var(--primary, #2563eb); color: var(--primary-foreground, #fff);
      }
      button.act.secondary { background: var(--secondary, #eee); color: var(--secondary-foreground, #111); }
      button.act:disabled { opacity: .5; cursor: default; }
      .hint { font-size: 11px; color: var(--muted-foreground, #888); margin: -4px 0 12px; }
      pre.out {
        background: var(--muted, #f3f3f3); padding: 10px; border-radius: var(--radius, 6px);
        font-family: var(--font-mono, monospace); font-size: 12px; white-space: pre-wrap;
        overflow: auto; margin: 12px 0 0; min-height: 60px; max-height: 45vh;
      }
      /* ── tool browser ── */
      .groups { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
      .grp { padding: 4px 10px; border-radius: 999px; cursor: pointer; background: var(--muted, #eee); color: var(--muted-foreground, #666); font-size: 12px; border: 0; }
      .grp.active { background: var(--accent, #e6efff); color: var(--accent-foreground, #1d4ed8); }
      .tool { border: 1px solid var(--border, #eee); border-radius: var(--radius, 8px); padding: 10px 12px; margin-bottom: 8px; }
      .tool h4 { margin: 0 0 2px; font-size: 13px; }
      .tool .desc { color: var(--muted-foreground, #777); font-size: 11px; margin: 0 0 8px; }
      .tool .danger { color: #dc2626; }
      .fields { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
      .fields input, .fields select { min-width: 90px; padding: 5px 7px; }
      /* ── assistant ── */
      #chat { border: 1px solid var(--border, #eee); border-radius: var(--radius, 8px); padding: 10px; min-height: 120px; max-height: 38vh; overflow: auto; margin-bottom: 10px; }
      #chat .b { margin: 6px 0; line-height: 1.45; }
      #chat .role { color: var(--muted-foreground, #888); font-weight: 600; margin-right: 4px; }
      #chat .sys { color: var(--muted-foreground, #999); font-size: 11px; font-family: var(--font-mono, monospace); }
      .empty { color: var(--muted-foreground, #999); text-align: center; padding: 24px 8px; font-size: 12px; }
      .nobridge { padding: 24px; text-align: center; color: var(--muted-foreground, #888); }
    </style>
  </head>
  <body>
    <header>
      <span class="title">Cloudflare</span>
      <span class="badge" id="status">checking…</span>
      <span class="detail" id="detail"></span>
    </header>
    <nav>
      <button data-pane="setup" class="active">Setup</button>
      <button data-pane="tools">Tools</button>
      <button data-pane="logs">Logs</button>
      <button data-pane="ai">Assistant</button>
    </nav>
    <main>
      <!-- SETUP -->
      <div class="pane active" id="pane-setup">
        <label>API token (REST) — stored only for this plugin</label>
        <div class="row">
          <input id="token" type="password" placeholder="paste a Cloudflare API token" />
          <button class="act" id="saveToken">Save</button>
        </div>
        <p class="hint">A token enables the REST API (whoami, D1, KV, R2…). Live tail/login use <code>wrangler login</code> instead.</p>
        <div class="row">
          <button class="act secondary" id="whoami">Verify &amp; list accounts</button>
        </div>
      </div>

      <!-- TOOLS -->
      <div class="pane" id="pane-tools">
        <div class="groups" id="groups"></div>
        <div id="tools"><div class="empty">Loading tools…</div></div>
      </div>

      <!-- LOGS -->
      <div class="pane" id="pane-logs">
        <p class="hint">Streamed via <code>wrangler</code> (uses your <code>wrangler login</code> credentials).</p>
        <div class="row">
          <button class="act secondary" id="login">Login</button>
          <button class="act" id="tail">Tail logs</button>
          <button class="act secondary" id="stop" disabled>Stop</button>
        </div>
      </div>

      <!-- ASSISTANT -->
      <div class="pane" id="pane-ai">
        <div class="row"><select id="model"><option>loading models…</option></select></div>
        <div id="chat"><div class="empty">Ask the Cloudflare-scoped assistant. Off-topic requests are refused.</div></div>
        <div class="row">
          <input id="ask" placeholder="e.g. list my D1 databases, then deploy" />
          <button class="act" id="send">Send</button>
          <button class="act secondary" id="cancel" disabled>Cancel</button>
        </div>
      </div>

      <pre class="out" id="out">ready.</pre>
    </main>

    <script>
      (function () {
        var out = document.getElementById('out');
        // Hard guard: a sandboxed iframe with no bridge means the host isn't
        // running this session's code (restart the app) — say so plainly.
        if (!window.mcp || !window.mcp.invokeTool) {
          document.querySelector('main').innerHTML =
            '<div class="nobridge">Plugin bridge unavailable.<br>Restart the IDE (the host server needs this build) and reopen this panel.</div>';
          return;
        }
        var mcp = window.mcp;
        var NS = (mcp.context && mcp.context.namespace) || 'cloudflare';

        function show(label, v) {
          out.textContent = label + '\n' + (typeof v === 'string' ? v : JSON.stringify(v, null, 2));
          out.scrollTop = 0;
        }
        function invoke(label, tool, args, btn) {
          if (btn) btn.disabled = true;
          out.textContent = label + '…';
          mcp.invokeTool(tool, args || {})
            .then(function (r) { show(label + (r.isError ? ' ✗' : ' ✓'), r.content); })
            .catch(function (e) { show(label + ' FAILED', String(e && e.message || e)); })
            .finally(function () { if (btn) btn.disabled = false; });
        }

        // ── tabs ──
        var navBtns = document.querySelectorAll('nav button');
        navBtns.forEach(function (b) {
          b.onclick = function () {
            navBtns.forEach(function (x) { x.classList.remove('active'); });
            b.classList.add('active');
            document.querySelectorAll('.pane').forEach(function (p) { p.classList.remove('active'); });
            document.getElementById('pane-' + b.getAttribute('data-pane')).classList.add('active');
          };
        });

        // ── detect (header) ──
        function refreshDetect() {
          mcp.invokeTool('cf_detect', {}).then(function (r) {
            var isCf = !/Not a Cloudflare/.test(r.content);
            var s = document.getElementById('status');
            s.textContent = isCf ? 'project detected' : 'no CF project';
            s.className = 'badge ' + (isCf ? 'ok' : 'no');
            document.getElementById('detail').textContent = r.content.replace(/\n/g, ' · ');
          }).catch(function (e) { document.getElementById('detail').textContent = String(e && e.message || e); });
        }

        // ── setup ──
        document.getElementById('saveToken').onclick = function (e) {
          var t = document.getElementById('token').value.trim();
          if (!t) { mcp.ui.toast({ kind: 'error', message: 'Paste a token first.' }); return; }
          invoke('save token', 'cf_set_token', { token: t }, e.target);
        };
        document.getElementById('whoami').onclick = function (e) { invoke('whoami', 'cf_whoami', {}, e.target); };

        // ── logs (streams) ──
        var activeStream = null, stopBtn = document.getElementById('stop');
        function appendLine(s) { out.textContent += s; out.scrollTop = out.scrollHeight; }
        function startStream(label, args, btn) {
          if (activeStream) activeStream();
          out.textContent = label + '…\n';
          if (btn) btn.disabled = true; stopBtn.disabled = false;
          activeStream = mcp.execStream('npx', ['wrangler'].concat(args), {
            onData: function (c) { if (c && c.type === 'data') appendLine(c.data); },
            onEnd: function () { appendLine('\n[' + label + ' ended]\n'); activeStream = null; if (btn) btn.disabled = false; stopBtn.disabled = true; },
            onError: function (m) { appendLine('\n[error] ' + m + '\n'); activeStream = null; if (btn) btn.disabled = false; stopBtn.disabled = true; }
          });
        }
        document.getElementById('login').onclick = function (e) { startStream('login', ['login'], e.target); };
        document.getElementById('tail').onclick = function (e) { startStream('tail', ['tail', '--format', 'pretty'], e.target); };
        stopBtn.onclick = function () { if (activeStream) { activeStream(); activeStream = null; } stopBtn.disabled = true; appendLine('\n[stopped]\n'); };

        // ── tool browser ──
        var GROUPS = {
          kv: 'KV', r2: 'R2', secret: 'Secrets', secrets: 'Secrets', queue: 'Queues',
          queues: 'Queues', vectorize: 'Vectorize', do: 'Durable Obj', ai: 'Workers AI',
          hyperdrive: 'Hyperdrive', cron: 'Cron', pages: 'Pages', zones: 'DNS', dns: 'DNS',
          cache: 'Cache', deploy: 'Deploy', deployments: 'Deploy', last: 'Deploy',
          d1: 'D1', detect: 'Core', set: 'Core', whoami: 'Core'
        };
        function groupOf(name) { return GROUPS[name.replace(/^cf_/, '').split('_')[0]] || 'Other'; }
        function fieldFor(key, schema) {
          var p = (schema.properties && schema.properties[key]) || {};
          var req = (schema.required || []).indexOf(key) >= 0;
          if (p.enum) return '<select data-k="' + key + '">' + p.enum.map(function (o) { return '<option>' + o + '</option>'; }).join('') + '</select>';
          var ph = key + (req ? '*' : '') + (p.type === 'number' ? ' (#)' : '');
          return '<input data-k="' + key + '" placeholder="' + ph + '"' + (p.type === 'number' ? ' inputmode="numeric"' : '') + ' />';
        }
        function renderTool(t) {
          var schema = t.parameters || { properties: {}, required: [] };
          var keys = Object.keys(schema.properties || {});
          var danger = t.riskLevel === 'admin' || t.riskLevel === 'execute';
          var div = document.createElement('div');
          div.className = 'tool';
          div.innerHTML =
            '<h4 class="' + (danger ? 'danger' : '') + '">' + t.name + (danger ? ' ⚠' : '') + '</h4>' +
            '<p class="desc">' + (t.description || '') + '</p>' +
            '<div class="fields">' + keys.map(function (k) { return fieldFor(k, schema); }).join('') +
            '<button class="act ' + (t.mutates ? '' : 'secondary') + '">Run</button></div>';
          var btn = div.querySelector('button');
          btn.onclick = function () {
            var args = {};
            div.querySelectorAll('[data-k]').forEach(function (el) {
              var v = el.value; if (v === '') return;
              var pdef = (schema.properties || {})[el.getAttribute('data-k')] || {};
              args[el.getAttribute('data-k')] = pdef.type === 'number' ? Number(v) : v;
            });
            if (!danger) { invoke(t.name, t.name, args, btn); return; }
            mcp.ui.confirm({
              title: t.name, message: 'This is a mutating/destructive Cloudflare action. Proceed?',
              confirmText: 'Run', danger: true
            }).then(function (ok) { if (ok) invoke(t.name, t.name, args, btn); });
          };
          return div;
        }
        function buildBrowser(tools) {
          var byGroup = {};
          tools.forEach(function (t) { (byGroup[groupOf(t.name)] = byGroup[groupOf(t.name)] || []).push(t); });
          var groups = Object.keys(byGroup).sort();
          var groupsEl = document.getElementById('groups'), toolsEl = document.getElementById('tools');
          function select(g) {
            [].forEach.call(groupsEl.children, function (c) { c.className = 'grp' + (c.textContent === g ? ' active' : ''); });
            toolsEl.innerHTML = '';
            byGroup[g].forEach(function (t) { toolsEl.appendChild(renderTool(t)); });
          }
          groupsEl.innerHTML = '';
          groups.forEach(function (g) {
            var b = document.createElement('button'); b.className = 'grp'; b.textContent = g;
            b.onclick = function () { select(g); }; groupsEl.appendChild(b);
          });
          if (groups.length) select(groups.indexOf('Core') >= 0 ? 'Core' : groups[0]);
          else toolsEl.innerHTML = '<div class="empty">No tools found.</div>';
        }
        mcp.listPlugins().then(function (plugins) {
          var me = plugins.filter(function (p) { return p.namespace === NS; })[0];
          buildBrowser((me && me.contributions && me.contributions.tools) || []);
        }).catch(function (e) {
          document.getElementById('tools').innerHTML = '<div class="empty">Could not load tools: ' + String(e && e.message || e) + '</div>';
        });

        // ── assistant ──
        var chatEl = document.getElementById('chat');
        var askEl = document.getElementById('ask');
        var sendBtn = document.getElementById('send');
        var cancelBtn = document.getElementById('cancel');
        var modelSel = document.getElementById('model');
        var history = [], closeChat = null, chatStarted = false;

        function bubble(role, text) {
          if (!chatStarted) { chatEl.innerHTML = ''; chatStarted = true; }
          var d = document.createElement('div'); d.className = 'b';
          d.innerHTML = '<span class="role">' + role + ':</span>';
          var span = document.createElement('span'); span.textContent = text; d.appendChild(span);
          chatEl.appendChild(d); chatEl.scrollTop = chatEl.scrollHeight; return span;
        }
        function sysLine(text) {
          if (!chatStarted) { chatEl.innerHTML = ''; chatStarted = true; }
          var d = document.createElement('div'); d.className = 'b sys'; d.textContent = text;
          chatEl.appendChild(d); chatEl.scrollTop = chatEl.scrollHeight;
        }

        mcp.assistant.listModels().then(function (models) {
          modelSel.innerHTML = '';
          if (!models.length) { modelSel.innerHTML = '<option value="">configure a provider in Admin → AI Geral</option>'; return; }
          models.forEach(function (m) {
            var o = document.createElement('option');
            o.value = m.providerId + '|' + m.modelId;
            o.textContent = m.label + (m.isDefault ? ' (default)' : '');
            if (m.isDefault) o.selected = true;
            modelSel.appendChild(o);
          });
        }).catch(function () { modelSel.innerHTML = '<option value="">no models</option>'; });

        function send() {
          var msg = askEl.value.trim();
          if (!msg || closeChat) return;
          askEl.value = '';
          bubble('you', msg);
          var sel = (modelSel.value || '').split('|');
          var assistantSpan = null, turnText = '';
          sendBtn.disabled = true; cancelBtn.disabled = false;
          closeChat = mcp.assistant.chat(msg, {
            providerId: sel[0] || undefined, modelId: sel[1] || undefined, history: history.slice()
          }, {
            onData: function (c) {
              if (c.type === 'text') { if (!assistantSpan) assistantSpan = bubble('cf', ''); turnText += c.text; assistantSpan.textContent = turnText; chatEl.scrollTop = chatEl.scrollHeight; }
              else if (c.type === 'tool_use') sysLine('→ ' + c.name + '(' + JSON.stringify(c.input) + ')');
              else if (c.type === 'tool_result') sysLine('  ' + (c.isError ? '✗ ' : '✓ ') + String(c.content).slice(0, 200));
              else if (c.type === 'confirm_request') {
                mcp.ui.confirm({
                  title: 'Run ' + c.name + '?',
                  message: 'The assistant wants to run a mutating action:\n' + JSON.stringify(c.input, null, 2),
                  confirmText: 'Allow', danger: true
                }).then(function (ok) { mcp.assistant.confirm(c.callId, ok); sysLine((ok ? 'approved ' : 'denied ') + c.name); });
              } else if (c.type === 'error') sysLine('[error] ' + c.message);
            },
            onEnd: function () {
              if (turnText) history.push({ role: 'user', text: msg }, { role: 'assistant', text: turnText });
              closeChat = null; sendBtn.disabled = false; cancelBtn.disabled = true;
            },
            onError: function (m) { sysLine('[stream error] ' + m); closeChat = null; sendBtn.disabled = false; cancelBtn.disabled = true; }
          });
        }
        sendBtn.onclick = send;
        askEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });
        cancelBtn.onclick = function () { if (closeChat) { closeChat(); closeChat = null; sysLine('[cancelled]'); sendBtn.disabled = false; cancelBtn.disabled = true; } };

        refreshDetect();
      })();
    </script>
  </body>
</html>
