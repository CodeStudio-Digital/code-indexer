<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* Panel-specific bits only — the host injects the .mcp-* UI kit and the
         theme variables. Keep every component styled via kit classes; the
         exceptions below are the assistant chat, which has no kit primitive. */
      html, body { height: 100%; }
      body { margin: 0; font-size: 12px; }
      #root { height: 100%; }

      .cf-chat-log { display: flex; flex-direction: column; gap: 8px; padding: 4px 0; }
      .cf-msg { display: flex; }
      .cf-msg.user { justify-content: flex-end; }
      .cf-bubble {
        max-width: 88%;
        padding: 6px 10px;
        border-radius: 10px;
        background: var(--muted, #f3f4f6);
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.5;
      }
      .cf-msg.user .cf-bubble { background: var(--accent, #e0ecff); color: var(--accent-foreground, #1d4ed8); }
      .cf-msg.err .cf-bubble { color: var(--destructive, #dc2626); }
      .cf-tools { display: flex; flex-direction: column; gap: 3px; }
      .cf-tool-line {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 10.5px;
        color: var(--muted-foreground, #6b7280);
        font-family: var(--font-mono, ui-monospace, monospace);
      }
      .cf-chat-ask { min-height: 30px; max-height: 120px; resize: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./src/main.ts"></script>
  </body>
</html>
