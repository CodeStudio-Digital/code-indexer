openapi: 3.1.0
info:
  title: CodeStudio Cloud API
  version: "1.0.0"
  description: >
    Secure Cloudflare-Workers backend for CodeStudio accounts, billing, conversation
    sharing and feedback. Bearer-only (no cookies): the desktop app stores the opaque
    rotating refresh token in OS-secure storage and uses the short-lived access token
    as `Authorization: Bearer <accessToken>`. Public endpoints (signup/login/refresh,
    the Stripe webhook, the share viewer) take no Authorization header.
servers:
  - url: https://codestudio-cloud-api.maiconspo6792.workers.dev
    description: Production
  - url: http://127.0.0.1:8787
    description: Local dev (wrangler dev)

tags:
  - name: Auth
  - name: Sessions
  - name: TwoFactor
  - name: Email
  - name: Billing
  - name: Sharing
  - name: Feedback
  - name: Account
  - name: Meta

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The `accessToken` returned by signup/login/refresh/2fa-challenge.
  schemas:
    Error:
      type: object
      properties:
        code: { type: string, example: invalid_credentials }
        message: { type: string }
        details: { type: object, additionalProperties: true }
      required: [code, message]
    Account:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        status: { type: string, enum: [active, locked, deleted] }
    Session:
      type: object
      properties:
        sessionId: { type: string, format: uuid }
        accessToken: { type: string, description: Short-lived JWT — send as Bearer. }
        accessExpiresIn: { type: integer, description: seconds }
        refreshToken: { type: string, description: Opaque, one-shot rotating. Store securely. }
        refreshExpiresIn: { type: integer, description: seconds }
    AuthResult:
      type: object
      properties:
        account: { $ref: '#/components/schemas/Account' }
        session: { $ref: '#/components/schemas/Session' }
    Entitlements:
      type: object
      properties:
        tier: { type: string, enum: [free, pro] }
        status: { type: string, enum: [none, trialing, active, past_due, canceled] }
        periodEndMs: { type: [integer, "null"] }
        features:
          type: object
          properties:
            sharing: { type: boolean }
            sync: { type: boolean }
            prioritySupport: { type: boolean }
        limits:
          type: object
          properties:
            maxActiveShares: { type: integer }
    PublicBlock:
      oneOf:
        - type: object
          properties:
            type: { const: text }
            text: { type: string, maxLength: 100000 }
          required: [type, text]
        - type: object
          properties:
            type: { const: tool_use }
            name: { type: string, maxLength: 64 }
            inputSummary: { type: string, maxLength: 4000 }
          required: [type, name, inputSummary]
        - type: object
          properties:
            type: { const: tool_result }
            toolName: { type: string, maxLength: 64 }
            status: { type: string, enum: [ok, error] }
            redacted: { const: true }
          required: [type, toolName, status, redacted]
        - type: object
          properties:
            type: { const: image }
            redacted: { const: true }
          required: [type, redacted]
        - type: object
          properties:
            type: { const: document }
            name: { type: [string, "null"], maxLength: 255 }
            redacted: { const: true }
          required: [type, name, redacted]
    ShareSnapshot:
      type: object
      required: [schemaVersion, title, model, createdAtMs, messages]
      properties:
        schemaVersion: { const: 1 }
        title: { type: string, minLength: 1, maxLength: 200 }
        model: { type: [string, "null"], maxLength: 120 }
        createdAtMs: { type: integer }
        messages:
          type: array
          maxItems: 2000
          items:
            type: object
            required: [idx, role, blocks]
            properties:
              idx: { type: integer }
              role: { type: string, enum: [user, assistant] }
              blocks:
                type: array
                maxItems: 500
                items: { $ref: '#/components/schemas/PublicBlock' }
  responses:
    Unauthorized:
      description: Missing/invalid bearer or revoked session.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: Too many requests (see Retry-After header).
      headers:
        Retry-After: { schema: { type: integer }, description: seconds }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

paths:
  /v1/health:
    get:
      tags: [Meta]
      summary: Liveness probe (no auth)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  service: { type: string }
                  env: { type: string }
                  ts: { type: string, format: date-time }

  /v1/auth/signup:
    post:
      tags: [Auth]
      summary: Create an account (returns a session). Rate-limited 20/h per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                password: { type: string, minLength: 12, maxLength: 512 }
                passwordConfirm: { type: string, description: optional; must match password }
            example: { email: you@example.com, password: MyStr0ng-Passw0rd-2026 }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        "400": { description: validation_failed / password_mismatch / password_too_weak, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "409": { description: email_already_registered, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "429": { $ref: '#/components/responses/RateLimited' }

  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Password login. May require a 2FA challenge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
            example: { email: you@example.com, password: MyStr0ng-Passw0rd-2026 }
      responses:
        "200": { description: Logged in, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        "401":
          description: invalid_credentials, OR twofa_required (details.challengeToken → POST /v1/auth/2fa/challenge)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        "423": { description: account_locked (Retry-After), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the refresh token + mint a new access token (one-shot; reuse revokes the family).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties: { refreshToken: { type: string } }
      responses:
        "200": { description: Rotated, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        "409": { description: token_reuse (family revoked), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "401": { description: refresh_invalid / refresh_expired, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/auth/me:
    get:
      tags: [Auth]
      summary: Current account + session id.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: { $ref: '#/components/schemas/Account' }
                  session: { type: object, properties: { id: { type: string } } }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/auth/logout:
    post:
      tags: [Sessions]
      summary: Revoke the current session.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /v1/auth/logout-all:
    post:
      tags: [Sessions]
      summary: Revoke ALL sessions for the account.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /v1/auth/sessions:
    get:
      tags: [Sessions]
      summary: List the account's active sessions (devices).
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        userAgent: { type: [string, "null"] }
                        createdAt: { type: string }
                        lastSeenAt: { type: string }
                        current: { type: boolean }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/auth/2fa/enroll:
    post:
      tags: [TwoFactor]
      summary: Begin TOTP enrollment — returns the otpauth:// URI (render as QR) + secret.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  otpauthUri: { type: string, example: "otpauth://totp/CodeStudio:you@example.com?secret=..." }
                  secret: { type: string }
        "403": { description: mfa_already_enabled, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /v1/auth/2fa/confirm:
    post:
      tags: [TwoFactor]
      summary: Confirm enrollment with a code; returns one-time recovery codes (shown once).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string, example: "123456" } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveryCodes: { type: array, items: { type: string } }
        "400": { description: twofa_invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /v1/auth/2fa/disable:
    post:
      tags: [TwoFactor]
      summary: Disable TOTP (requires a current code).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string } } }
      responses:
        "200": { description: OK }
        "401": { description: twofa_invalid / unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/auth/2fa/challenge:
    post:
      tags: [TwoFactor]
      summary: Complete a login that returned twofa_required (TOTP or a recovery code).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, code]
              properties:
                challengeToken: { type: string, description: from login's error.details.challengeToken }
                code: { type: string, description: TOTP digits or a recovery code }
      responses:
        "200": { description: Logged in, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        "401": { description: twofa_invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/auth/verify-email:
    post:
      tags: [Email]
      summary: Consume an email-verification token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        "200": { description: OK }
        "400": { description: email_token_invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/auth/resend-verification:
    post:
      tags: [Email]
      summary: Resend the verification email. Rate-limited 3/15min.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "429": { $ref: '#/components/responses/RateLimited' }
  /v1/auth/request-password-reset:
    post:
      tags: [Email]
      summary: Request a reset link. Always 200 (no account enumeration). Rate-limited per IP+email.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        "200": { description: Accepted (whether or not the email exists). }
  /v1/auth/reset-password:
    post:
      tags: [Email]
      summary: Set a new password with a reset token (revokes all sessions).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 12, maxLength: 512 }
      responses:
        "200": { description: OK }
        "400": { description: email_token_invalid / password_too_weak, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/billing/entitlements:
    get:
      tags: [Billing]
      summary: Current entitlements (auto-grants a 14-day Pro trial on first call).
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Entitlements' } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /v1/billing/checkout:
    post:
      tags: [Billing]
      summary: Create a Stripe Checkout session (returns a redirect URL). 501 until Stripe keys are set.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { url: { type: string } } } } } }
        "501": { description: billing_not_configured, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /v1/billing/portal:
    post:
      tags: [Billing]
      summary: Create a Stripe Customer Portal session. 501 until Stripe keys; 409 if no customer yet.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { url: { type: string } } } } } }
        "409": { description: no_customer, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "501": { description: billing_not_configured, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /v1/billing/webhook:
    post:
      tags: [Billing]
      summary: Stripe webhook sink (no bearer — verified by the Stripe-Signature header over the raw body).
      parameters:
        - in: header
          name: Stripe-Signature
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, description: Raw Stripe event. } } }
      responses:
        "200": { description: received }
        "400": { description: webhook_signature_invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/share:
    post:
      tags: [Sharing]
      summary: Publish a redacted, signed conversation snapshot (entitlement-gated). Body re-redacted server-side.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshot]
              properties:
                snapshot: { $ref: '#/components/schemas/ShareSnapshot' }
                visibility: { type: string, enum: [public, unlisted], default: unlisted }
                expiresInDays: { type: [integer, "null"], minimum: 1, maximum: 365, default: null }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  shareId: { type: string }
                  slug: { type: string }
                  url: { type: string }
                  redactionCount: { type: integer }
        "402": { description: sharing_not_entitled / share_quota_exceeded, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "413": { description: snapshot_too_large, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "501": { description: sharing_not_configured (no SHARE_SIGNING_PRIVKEY), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [Sharing]
      summary: List the caller's shares.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  shares:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        slug: { type: string }
                        title: { type: string }
                        visibility: { type: string }
                        status: { type: string, enum: [active, revoked, expired] }
                        messageCount: { type: integer }
                        createdAtMs: { type: integer }
                        expiresAtMs: { type: [integer, "null"] }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /v1/share/{id}:
    delete:
      tags: [Sharing]
      summary: Revoke a share (owner only).
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
        "404": { description: share_not_found (also returned to non-owners), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /s/{slug}:
    get:
      tags: [Sharing]
      summary: Public read-only viewer feed (no auth). Returns the redacted transcript + Ed25519 signature.
      parameters: [{ in: path, name: slug, required: true, schema: { type: string, pattern: '^[0-9A-Za-z_-]{21}$' } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  title: { type: string }
                  model: { type: [string, "null"] }
                  visibility: { type: string }
                  createdAtMs: { type: integer }
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        idx: { type: integer }
                        role: { type: string }
                        blocks: { type: array, items: { $ref: '#/components/schemas/PublicBlock' } }
                  integrity:
                    type: object
                    properties:
                      sha256: { type: string }
                      signature: { type: string, description: base64 Ed25519 over sha256(canonical snapshot) }
        "404": { description: share_not_found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "410": { description: share_revoked / share_expired, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/feedback:
    post:
      tags: [Feedback]
      summary: Submit feedback. Optional auth — anonymous requires a Turnstile token. Free text is re-redacted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, message]
              properties:
                kind: { type: string, enum: [bug, idea, other] }
                message: { type: string, minLength: 1, maxLength: 4000 }
                appVersion: { type: string, maxLength: 32 }
                os: { type: string, maxLength: 64, example: "win32/26200/x64" }
                sessionShareId: { type: string, description: a signed share slug for repro }
                attachmentIds: { type: array, maxItems: 3, items: { type: string } }
                contactEmail: { type: string, format: email }
                turnstileToken: { type: string, description: required when anonymous }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { publicId: { type: string } } } } } }
        "403": { description: human_verification_required / _failed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "429": { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Feedback]
      summary: List the caller's own feedback.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        publicId: { type: string }
                        kind: { type: string }
                        status: { type: string }
                        message: { type: string }
                        appVersion: { type: [string, "null"] }
                        attachmentCount: { type: integer }
                        createdAtMs: { type: integer }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /v1/feedback/attachment:
    post:
      tags: [Feedback]
      summary: Upload an image attachment (raw bytes; PNG/JPEG/GIF/WEBP only, ≤5 MB). Worker sniffs magic bytes.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachmentId: { type: string }
                  kind: { type: string, enum: [image, text, diagnostic-json] }
                  contentType: { type: string }
        "413": { description: attachment_too_large, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "415": { description: attachment_type_rejected, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/account/export:
    get:
      tags: [Account]
      summary: GDPR/LGPD export — the caller's data across identity/billing/sharing/feedback.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  exportedAt: { type: string, format: date-time }
                  account: { $ref: '#/components/schemas/Account' }
                  sessions: { type: array, items: { type: object } }
                  subscription: { type: [object, "null"] }
                  shares: { type: array, items: { type: object } }
                  feedback: { type: array, items: { type: object } }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /v1/account:
    delete:
      tags: [Account]
      summary: Erase the account (reauth with the password + literal "DELETE"). Immediate hard delete (cascade + R2 purge).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, confirm]
              properties:
                password: { type: string }
                confirm: { const: DELETE }
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { type: object, properties: { deleted: { const: true } } } } } }
        "400": { description: validation_failed (confirm must be "DELETE"), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "401": { description: invalid_credentials, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "429": { $ref: '#/components/responses/RateLimited' }
